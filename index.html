<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visual Life OS</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Life OS">
    <meta name="theme-color" content="#E6B422">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'],
                        serif: ['"Noto Serif SC"', 'serif'] // 用于AI报告的杂志排版感
                    },
                    colors: {
                        'os-bg': '#FFFBEB',       // 全局底色
                        'os-yellow': '#FEF3C7',   // 暖黄
                        'os-purple': '#E9D5FF',   // 紫罗兰
                        'os-pink': '#FDF2F8',     // 浅粉
                        'os-green': '#ECFDF5',    // 薄荷绿
                        'os-blue': '#DBEAFE',     // 婴儿蓝
                        'os-text': '#475569',     // 深灰文本
                    },
                    borderRadius: { 'os-xl': '1.5rem' }, // 24px 平滑圆角
                    animation: {
                        'fade-in': 'fadeIn 0.2s ease-out',
                        'slide-up': 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
                        'wiggle': 'wiggle 0.3s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        wiggle: { '0%, 100%': { transform: 'rotate(-1deg)' }, '50%': { transform: 'rotate(1deg)' } },
                    }
                }
            }
        }
    </script>
    <style>
        :root { --theme-bg: #FFFBEB; --theme-accent: #E6B422; --theme-text: #475569; --accent: #E6B422; --finance-bg: #FFFBF0; --finance-border: #e6dcc0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--theme-bg); -webkit-tap-highlight-color: transparent; transition: background-color 0.3s; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-panel { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.8); }
        .glass-overlay { background: rgba(0, 0, 0, 0.25); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
        .dragging { opacity: 0.5; transform: scale(1.05); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
        @keyframes musicBar { 0%,100%{transform:scaleY(0.25)} 50%{transform:scaleY(1)} }
        .music-bar { display:inline-block; width:3px; border-radius:2px; background:#a78bfa; transform-origin:bottom; animation:musicBar 0.7s ease-in-out infinite; }
        .music-bar:nth-child(2){ animation-delay:0.2s; }
        .music-bar:nth-child(3){ animation-delay:0.4s; }
        /* 深夜主题覆盖 */
        [data-theme="dark"] .bg-white { background-color: #334155 !important; }
        [data-theme="dark"] .bg-gray-50 { background-color: #1e293b !important; }
        [data-theme="dark"] .bg-gray-100 { background-color: #334155 !important; }
        [data-theme="dark"] .glass-panel { background: rgba(15,23,42,0.85) !important; border-color: rgba(255,255,255,0.1) !important; }
        [data-theme="dark"] .text-gray-700, [data-theme="dark"] .text-gray-800 { color: #e2e8f0 !important; }
        [data-theme="dark"] .text-gray-400, [data-theme="dark"] .text-gray-500, [data-theme="dark"] .text-gray-600 { color: #94a3b8 !important; }
        [data-theme="dark"] .border-gray-50, [data-theme="dark"] .border-gray-100, [data-theme="dark"] .border-gray-200 { border-color: #475569 !important; }
        [data-theme="dark"] .divide-gray-50 > * + * { border-color: #475569 !important; }
        [data-theme="dark"] .shadow-sm, [data-theme="dark"] .shadow-md { box-shadow: 0 1px 4px rgba(0,0,0,0.5) !important; }
        [data-theme="dark"] .bg-os-bg { background-color: #1e293b !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // ── Supabase 初始化 ──
        const SUPABASE_URL = 'https://aiyflmkzzuiwmamvoils.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFpeWZsbWt6enVpd21hbXZvaWxzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMzQ0OTksImV4cCI6MjA5NDYxMDQ5OX0.1L59zixF4zg1yCahqo44h41kOiBfrWvtAGYvhGpRKAs';
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 当前登录用户 ID（登录后由 auth 设置）
        let CURRENT_USER_ID = null;

        // 获取当前周的日期数组 (周日到周六)
        const getWeekDates = (date = new Date()) => {
            const d = new Date(date);
            const day = d.getDay();
            const diff = d.getDate() - day;
            return Array.from({length: 7}).map((_, i) => {
                const newDate = new Date(d.setDate(diff + i));
                return newDate.toISOString().split('T')[0];
            });
        };

        const TODAY_STR = new Date().toISOString().split('T')[0];
        const CURRENT_WEEK_DATES = getWeekDates(new Date());

        const getWeek = (date) => {
            const d = new Date(date);
            d.setHours(0, 0, 0, 0);
            d.setDate(d.getDate() + 4 - (d.getDay() || 7));
            const yearStart = new Date(d.getFullYear(), 0, 1);
            const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
            return `${d.getFullYear()}-w${weekNo}`;
        };

        const CATEGORIES = [
            { id: 'sport', icon: '🩰', label: '运动', color: 'bg-pink-400' },
            { id: 'food', icon: '🥩', label: '饮食', color: 'bg-yellow-400' },
            { id: 'movie', icon: '🎬', label: '影视', color: 'bg-purple-400' },
            { id: 'create', icon: '🎨', label: '创作', color: 'bg-blue-400' },
            { id: 'game', icon: '🎮', label: '游戏', color: 'bg-green-400' },
            { id: 'location', icon: '📍', label: '足迹', color: 'bg-orange-400' }
        ];

        const INITIAL_EVENTS = [];
        const INITIAL_TODOS  = [];

        const INITIAL_WIDGETS = [
            { id: 'weekly', size: 'large' },     // 2x2
            { id: 'clock', size: '1x1' },        // 1x1
            { id: 'countdown', size: '1x1' },    // 1x1
            { id: 'weather', size: '2x1' },      // 2x1
            { id: 'habits', size: '2x1' },       // 2x1
            { id: 'quote', size: '2x1' },        // 2x1
            { id: 'music', size: '2x1' },        // 2x1
            { id: 'photo', size: 'large' },      // 2x2
            { id: 'health', size: 'medium' },    // 2x1
            { id: 'deadline', size: 'medium' },  // 2x1
            { id: 'period', size: '2x1' },       // 2x1
            { id: 'smoking', size: '2x1' },      // 2x1
            { id: 'finance', size: 'large' },    // 2x2
            { id: 'shopping', size: 'large' }    // 2x2
        ];

        // 从 localStorage 读取迁移后的记账数据，读不到则用空数组
        const _financeStorage = (() => {
            try { return JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}'); }
            catch { return {}; }
        })();

        // transactions 格式：{ id, date, name, amount, currency, category }
        const MOCK_TRANSACTIONS = _financeStorage.transactions || [];

        // 分类颜色映射（关键词匹配，越长越具体的放前面）
        const FINANCE_CAT_COLOR_MAP = [
            { keys: ['一日三餐','吃饭','外卖','烤肉','咖啡','饮料','食堂','餐饮'], color: '#e07a5f' },
            { keys: ['超市','日用品','日用'],                                        color: '#E6B422' },
            { keys: ['化妆','护肤','美容','美妆','衣服','服饰','芭蕾'],              color: '#f472b6' },
            { keys: ['氪金','会员','订阅'],                                          color: '#60a5fa' },
            { keys: ['周边','玩的','游戏','娱乐','景点'],                             color: '#a78bfa' },
            { keys: ['机票','交通','电车','地铁','出行'],                             color: '#34d399' },
            { keys: ['医疗','课程','学费','学习','教育'],                             color: '#94a3b8' },
            { keys: ['礼物','送礼'],                                                  color: '#fb7185' },
        ];
        const getCatColor = (cat) => {
            if (!cat) return '#d1d5db';
            for (const { keys, color } of FINANCE_CAT_COLOR_MAP) {
                if (keys.some(k => cat.includes(k))) return color;
            }
            return '#d1d5db';
        };

        // ── 设置弹窗（API Key 管理）──
        const SettingsModal = ({ isOpen, onClose }) => {
            const [apiKey, setApiKey] = useState(() => localStorage.getItem('lifeos_gemini_key') || '');
            const [saved, setSaved] = useState(false);

            const saveKey = () => {
                localStorage.setItem('lifeos_gemini_key', apiKey.trim());
                setSaved(true);
                setTimeout(() => setSaved(false), 2000);
            };

            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[120] flex items-center justify-center p-4 glass-overlay animate-fade-in" onClick={onClose}>
                    <div className="bg-white w-full max-w-sm rounded-3xl shadow-2xl p-6 animate-slide-up" onClick={e => e.stopPropagation()}>
                        <div className="flex items-center justify-between mb-5">
                            <h2 className="font-black text-base text-gray-800">⚙️ 设置</h2>
                            <button onClick={onClose} className="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center font-bold text-gray-500 hover:bg-gray-200">×</button>
                        </div>
                        <div className="space-y-4">
                            <div>
                                <label className="text-[10px] font-black uppercase tracking-widest text-gray-400 block mb-2">Gemini API Key</label>
                                <input
                                    type="password"
                                    value={apiKey}
                                    onChange={e => { setApiKey(e.target.value); setSaved(false); }}
                                    placeholder="AIza..."
                                    className="w-full bg-gray-50 rounded-2xl px-4 py-3 text-sm font-mono outline-none border border-gray-100 focus:border-gray-300 transition-colors"
                                />
                                <p className="text-[10px] text-gray-400 mt-1.5">用于 AI 周报和年度总结功能，仅存储在本地</p>
                            </div>
                            <button onClick={saveKey}
                                className="w-full py-3 rounded-2xl font-bold text-sm text-white transition-all"
                                style={{ background: saved ? '#22c55e' : '#1e293b' }}>
                                {saved ? '已保存 ✓' : '保存'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // AI 洞察报告模态框 (伴随式出现)
        const AIReportModal = ({ isOpen, onClose, type, period }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 glass-overlay animate-fade-in" onClick={onClose}>
                    <div className="bg-[#FAF9F6] w-full max-w-2xl rounded-3xl shadow-2xl p-8 max-h-[85vh] overflow-y-auto relative animate-slide-up" onClick={e=>e.stopPropagation()}>
                        <button onClick={onClose} className="absolute top-6 right-6 w-8 h-8 bg-gray-200 rounded-full flex items-center justify-center font-bold text-gray-600 hover:bg-gray-300">×</button>
                        
                        <div className="text-center mb-8">
                            <span className="text-3xl mb-2 block">✨</span>
                            <p className="text-xs font-bold tracking-widest text-gray-400 uppercase mb-1">Gemini AI Insight</p>
                            <h2 className="text-3xl font-serif text-os-text">{period} 视觉与生活洞察</h2>
                        </div>

                        <div className="space-y-8 text-os-text">
                            <section>
                                <h3 className="font-bold text-lg border-b border-gray-200 pb-2 mb-3 flex items-center gap-2">🩰 身体反馈预警</h3>
                                <p className="text-sm leading-relaxed text-gray-600">根据这{type==='week'?'周':'段'}的数据，你的旧伤部位在芭杆运动后出现过 <strong>6级发热</strong>。系统检测到连续高热，强烈建议：<span className="bg-pink-100 text-pink-700 px-1 rounded">未来两天将微蹲动作降阶一半</span>，并增加运动后的冰敷时间。</p>
                            </section>
                            <section>
                                <h3 className="font-bold text-lg border-b border-gray-200 pb-2 mb-3 flex items-center gap-2">🎨 创作与排版总结</h3>
                                <p className="text-sm leading-relaxed text-gray-600">这{type==='week'?'周':'段'}你在排版课题上投入了大量时间。AI 检测到你记录了“网格系统问题”。建议参考 <strong>Müller-Brockmann 的网格系统理论</strong> 来校准你的海报边缘留白，周三的 DDL 冲刺会非常顺利。</p>
                            </section>
                            <section>
                                <h3 className="font-bold text-lg border-b border-gray-200 pb-2 mb-3 flex items-center gap-2">🍷 情绪肯定</h3>
                                <p className="text-sm leading-relaxed text-gray-600">虽然任务很重，但你灵活地安排了“烤肉”和“椒麻鸡”来犒劳自己。保持这种有弹性的生活节奏，你已经在很好的平衡工作和享受了。干得漂亮！</p>
                            </section>
                        </div>
                    </div>
                </div>
            );
        };

        // AI 生成报告面板（接入 Gemini API）
        const AIGeneratePanel = ({ isOpen, onClose, title, type, data }) => {
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [error, setError] = useState(null);
            const [history, setHistory] = useState([]);
            const [expandedIdx, setExpandedIdx] = useState(null);

            useEffect(() => {
                if (!isOpen) return;
                setResult(null);
                setError(null);
                setExpandedIdx(null);
                try {
                    const d = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}');
                    const all = d.aiReports || [];
                    setHistory(all.filter(r => r.type === type));
                } catch { setHistory([]); }
            }, [isOpen, type]);

            if (!isOpen) return null;

            const generate = async () => {
                const apiKey = localStorage.getItem('lifeos_gemini_key') || '';
                if (!apiKey) {
                    setError('请先在设置里填入 Gemini API Key');
                    return;
                }
                setLoading(true);
                setError(null);
                setResult(null);
                try {
                    let promptText;
                    if (type === 'weekly') {
                        const { weekEvents, weekTx, completedTodos, totalTodos, weekHabits } = data || {};
                        promptText = `你是我的生活助手，请根据以下本周数据生成一份温暖有趣的中文周报总结（300字以内）：\n\n本周事件：${JSON.stringify(weekEvents || [])}\n本周消费：${JSON.stringify(weekTx || [])}\nTodo完成：${completedTodos || 0}/${totalTodos || 0}\n习惯打卡：${JSON.stringify(weekHabits || {})}\n\n请包含：本周亮点、消费小结、下周建议，语气轻松可爱`;
                    } else {
                        const { year, yearTotal, monthlyData, catData } = data || {};
                        promptText = `请根据以下${year}年消费数据生成年度财务总结（500字以内）：\n全年支出：${yearTotal}JPY\n月度数据：${JSON.stringify(monthlyData || [])}\n分类占比：${JSON.stringify(catData || [])}\n请包含：年度消费特点、最大开销分析、理财建议，语气温暖鼓励`;
                    }
                    const response = await fetch(
                        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`,
                        {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
                        }
                    );
                    const respData = await response.json();
                    if (!response.ok) throw new Error(respData.error?.message || `API 错误 ${response.status}`);
                    setResult(respData.candidates[0].content.parts[0].text);
                } catch (e) {
                    setError(e.message);
                } finally {
                    setLoading(false);
                }
            };

            const saveReport = () => {
                if (!result) return;
                const report = { type, period: data?.period || title, content: result, createdAt: new Date().toISOString() };
                try {
                    const d = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}');
                    const all = [report, ...(d.aiReports || [])];
                    d.aiReports = all;
                    localStorage.setItem('visualLifeOS_data', JSON.stringify(d));
                    setHistory(all.filter(r => r.type === type));
                    setResult(null);
                } catch {}
            };

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 glass-overlay animate-fade-in" onClick={onClose}>
                    <div className="bg-white w-full max-w-lg rounded-3xl shadow-2xl animate-slide-up flex flex-col max-h-[85vh]" onClick={e => e.stopPropagation()}>
                        <div className="px-6 pt-6 pb-4 border-b border-gray-50 flex items-center justify-between flex-shrink-0">
                            <div>
                                <p className="text-[10px] font-black tracking-widest text-gray-400 uppercase mb-1">✨ Gemini AI</p>
                                <h2 className="font-black text-base text-gray-800">{title}</h2>
                            </div>
                            <button onClick={onClose} className="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center font-bold text-gray-500 hover:bg-gray-200 flex-shrink-0 ml-4">×</button>
                        </div>

                        <div className="flex-1 overflow-y-auto hide-scrollbar px-6 py-5 space-y-4">
                            <button
                                onClick={generate}
                                disabled={loading}
                                className="w-full py-4 rounded-2xl font-black text-sm flex items-center justify-center gap-2 transition-all disabled:opacity-60"
                                style={{ background: loading ? '#f1f5f9' : '#1e293b', color: loading ? '#94a3b8' : '#fff' }}>
                                {loading ? (
                                    <><span className="animate-spin inline-block">⟳</span> 生成中，请稍候…</>
                                ) : (
                                    <><span>✨</span> {result ? '重新生成' : '生成报告'}</>
                                )}
                            </button>

                            {loading && (
                                <div className="space-y-3 animate-fade-in">
                                    {[80, 60, 90, 50, 70].map((w, i) => (
                                        <div key={i} className="h-3 bg-gray-100 rounded-full animate-pulse" style={{ width: `${w}%` }} />
                                    ))}
                                </div>
                            )}

                            {error && (
                                <div className="bg-red-50 border border-red-100 rounded-2xl p-4 text-sm font-bold text-red-600">
                                    {error}
                                </div>
                            )}

                            {result && (
                                <div className="bg-amber-50 border border-amber-100 rounded-2xl p-5 space-y-3 animate-fade-in">
                                    <p className="text-sm leading-relaxed text-gray-700 whitespace-pre-wrap">{result}</p>
                                    <button onClick={saveReport}
                                        className="w-full py-2.5 rounded-xl font-bold text-sm text-white flex items-center justify-center gap-2"
                                        style={{ background: '#22c55e' }}>
                                        💾 保存到历史
                                    </button>
                                </div>
                            )}

                            <div>
                                <h3 className="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-3">历史报告</h3>
                                {history.length === 0 ? (
                                    <div className="flex flex-col items-center justify-center py-8 text-center">
                                        <span className="text-3xl mb-3">📭</span>
                                        <p className="text-sm font-bold text-gray-400">暂无历史报告</p>
                                        <p className="text-xs text-gray-300 mt-1">点击上方「生成报告」创建第一份</p>
                                    </div>
                                ) : (
                                    <div className="space-y-2">
                                        {history.map((r, i) => (
                                            <div key={i} className="border border-gray-100 rounded-2xl overflow-hidden">
                                                <button
                                                    onClick={() => setExpandedIdx(expandedIdx === i ? null : i)}
                                                    className="w-full px-4 py-3 flex items-center justify-between text-left hover:bg-gray-50 transition-colors">
                                                    <div>
                                                        <p className="text-xs font-black text-gray-700">{r.period}</p>
                                                        <p className="text-[10px] text-gray-400">{new Date(r.createdAt).toLocaleDateString('zh-CN')}</p>
                                                    </div>
                                                    <span className="text-gray-400 text-xs">{expandedIdx === i ? '▲' : '▼'}</span>
                                                </button>
                                                {expandedIdx === i && (
                                                    <div className="px-4 pb-4 pt-2 border-t border-gray-50">
                                                        <p className="text-xs leading-relaxed text-gray-600 whitespace-pre-wrap">{r.content}</p>
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 分类筛选器条
        const FilterBar = ({ activeFilter, setActiveFilter }) => (
            <div className="flex gap-2 overflow-x-auto hide-scrollbar py-2">
                <button 
                    onClick={() => setActiveFilter('all')}
                    className={`px-4 py-1.5 rounded-full text-sm font-bold transition-all whitespace-nowrap ${activeFilter === 'all' ? 'bg-os-text text-white shadow-md' : 'bg-white text-gray-400 hover:bg-gray-50'}`}
                >
                    全部
                </button>

        const ShoppingWidget = () => {

            const saveItems = (next) => {

                                    {(key === 'need' ? needCount : wantCount) > 0 && (

                                            {key === 'need' ? needCount : wantCount}

                                    )}
                                </button>

                        </div>
                        <span className="text-base">🛍️</span>
                    </div>

                    {/* 列表 */}
                    <div className="flex-1 overflow-y-auto hide-scrollbar px-4 py-3 space-y-2">

                                        ${item.done ? cfg.check + ' text-white' : 'border-gray-300 hover:border-gray-400'}`}>

                                        {item.name}
                                    </span>

                                </div>

                                    className="opacity-0 group-hover/si:opacity-100 text-gray-300 hover:text-red-400 transition-all text-sm leading-none flex-shrink-0 mt-0.5">×</button>

                    </div>

                    {/* 添加输入框 */}
                    <div className="flex gap-2 px-4 pb-4 pt-2 border-t border-gray-50 flex-shrink-0">
                        <input
                            value={newText}
                            onChange={e => setNewText(e.target.value)}
                            onKeyDown={e => e.key === 'Enter' && addItem()}
                            placeholder={activeTab === 'need' ? '添加需要买的…' : '添加心愿…'}
                            className="flex-1 text-xs bg-gray-50 rounded-xl px-3 py-2 outline-none border border-transparent focus:border-gray-200 transition-colors placeholder-gray-300 font-medium"
                        />
                        <button onClick={addItem}
                            className={`w-8 h-8 rounded-xl text-white text-lg font-black flex items-center justify-center hover:opacity-80 transition-opacity flex-shrink-0 ${cfg.activeBg}`}>
                            +

        const HealthWidget = () => {

                    <div className="bg-white/60 p-3 rounded-xl">

        const DeadlineWidget = () => {

                try {
                    const d = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}');
                    const allTodos = d.allTodos || {};
                    const flat = Object.values(allTodos).flat().filter(t => !t.done && t.date >= TODAY_STR);
                    flat.sort((a, b) => a.date.localeCompare(b.date));
                    return flat[0] || null;

            })();

            if (!urgentTodo) return (
                <div className="bg-os-yellow p-5 rounded-os-xl border border-orange-100 flex flex-col items-center justify-center h-full relative overflow-hidden">

        const ClockWidget = () => {
            const [now, setNow] = useState(new Date());
            useEffect(() => {
                const timer = setInterval(() => setNow(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);
            const weekDays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${weekDays[now.getDay()]}`;
            return (
                <div className="h-full flex flex-col items-center justify-center rounded-os-xl" style={{ background: '#475569' }}>
                    <span className="font-black text-white leading-none tracking-tight" style={{ fontSize: 'clamp(2rem, 5vw, 2.5rem)' }}>{hh}:{mm}</span>
                    <span className="text-[10px] font-medium mt-2 text-center px-2" style={{ color: '#94a3b8' }}>{dateStr}</span>
                </div>
            );
        };


        const PeriodDetailModal = ({ isOpen, onClose, log, saveLog }) => {
            const [selectedDate, setSelectedDate] = useState(TODAY_STR);

            const periodDays = useMemo(() => {
                const days = new Set();
                log.forEach(entry => {
                    const cur = new Date(entry.startDate + 'T00:00:00');
                    const end = new Date(entry.endDate + 'T00:00:00');
                    while (cur <= end) {
                        days.add(cur.toISOString().split('T')[0]);
                        cur.setDate(cur.getDate() + 1);
                    }
                });
                return days;
            }, [log]);

            if (!isOpen) return null;

            const year = new Date().getFullYear();
            const sorted = [...log].sort((a, b) => a.startDate.localeCompare(b.startDate));

            const handleStart = () => {
                if (log.some(e => selectedDate >= e.startDate && selectedDate <= e.endDate)) return;
                saveLog([...log, { startDate: selectedDate, endDate: selectedDate }]);
            };

            const handleEnd = () => {
                if (!sorted.length) return;
                const last = sorted[sorted.length - 1];
                if (selectedDate >= last.startDate) {
                    saveLog(log.map(e => e.startDate === last.startDate ? { ...e, endDate: selectedDate } : e));
                }
            };

            const toggleDay = (dateStr) => {
                if (periodDays.has(dateStr)) {
                    const match = log.find(e => dateStr >= e.startDate && dateStr <= e.endDate);
                    if (!match) return;
                    let next;
                    if (match.startDate === dateStr && match.endDate === dateStr) {
                        next = log.filter(e => e.startDate !== match.startDate);
                    } else if (match.startDate === dateStr) {
                        const d = new Date(dateStr + 'T00:00:00'); d.setDate(d.getDate() + 1);
                        next = log.map(e => e.startDate === match.startDate ? { ...e, startDate: d.toISOString().split('T')[0] } : e);
                    } else if (match.endDate === dateStr) {
                        const d = new Date(dateStr + 'T00:00:00'); d.setDate(d.getDate() - 1);
                        next = log.map(e => e.startDate === match.startDate ? { ...e, endDate: d.toISOString().split('T')[0] } : e);
                    } else {
                        const p = new Date(dateStr + 'T00:00:00'); p.setDate(p.getDate() - 1);
                        const n = new Date(dateStr + 'T00:00:00'); n.setDate(n.getDate() + 1);
                        next = [
                            ...log.filter(e => e.startDate !== match.startDate),
                            { startDate: match.startDate, endDate: p.toISOString().split('T')[0] },
                            { startDate: n.toISOString().split('T')[0], endDate: match.endDate },
                        ];
                    }
                    saveLog(next);
                } else {
                    saveLog([...log, { startDate: dateStr, endDate: dateStr }]);
                }
            };

            const thisYearPeriods = sorted.filter(e => e.startDate.startsWith(`${year}`));
            let avgCycle = null, avgDuration = null;
            if (sorted.length >= 2) {
                const ivs = [];
                for (let i = 1; i < sorted.length; i++) {
                    ivs.push(Math.floor((new Date(sorted[i].startDate + 'T00:00:00') - new Date(sorted[i-1].startDate + 'T00:00:00')) / 86400000));
                }
                avgCycle = Math.round(ivs.reduce((s,v) => s+v, 0) / ivs.length);
            }
            if (sorted.length > 0) {
                const durs = sorted.map(e => Math.floor((new Date(e.endDate+'T00:00:00') - new Date(e.startDate+'T00:00:00')) / 86400000) + 1);
                avgDuration = Math.round(durs.reduce((s,v) => s+v, 0) / durs.length);
            }
            const lastStart = sorted[sorted.length - 1]?.startDate;

            return (
                <div className="fixed inset-0 z-[95] flex items-center justify-center p-4 glass-overlay animate-fade-in" onClick={onClose}>
                    <div className="bg-white w-full max-w-lg rounded-3xl shadow-2xl animate-slide-up flex flex-col" style={{ maxHeight: '90vh' }} onClick={e => e.stopPropagation()}>
                        <div className="px-6 pt-5 pb-4 border-b border-gray-50 flex items-center justify-between flex-shrink-0">
                            <div>
                                <p className="text-[10px] font-black uppercase tracking-widest mb-0.5" style={{ color: '#f472b6' }}>🌸 经期记录</p>
                                <h2 className="font-black text-base text-gray-800">详细数据</h2>
                            </div>
                            <button onClick={onClose} className="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center font-bold text-gray-500 hover:bg-gray-200">×</button>
                        </div>

                        <div className="flex-1 overflow-y-auto hide-scrollbar">
                            {/* 补录入口 */}
                            <div className="px-6 py-4 border-b border-gray-50">
                                <h3 className="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-3">补录经期</h3>
                                <div className="flex gap-2 items-center">
                                    <input type="date" value={selectedDate} max={TODAY_STR}
                                        onChange={e => setSelectedDate(e.target.value)}
                                        className="flex-1 text-sm font-bold rounded-xl px-3 py-2 border outline-none"
                                        style={{ background: '#fdf2f8', borderColor: '#f0d8ea' }} />
                                    <button onClick={handleStart}
                                        className="px-4 py-2 rounded-xl text-sm font-black text-white flex-shrink-0"
                                        style={{ background: '#f472b6' }}>开始</button>
                                    <button onClick={handleEnd}
                                        className="px-4 py-2 rounded-xl text-sm font-black flex-shrink-0"
                                        style={{ background: '#fce7f3', color: '#e11d48' }}>结束</button>
                                </div>
                            </div>

                            {/* 年度日历 */}
                            <div className="px-6 py-4 border-b border-gray-50">
                                <h3 className="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-3">{year} 年日历 · 点击标记/取消</h3>
                                <div className="flex gap-4 overflow-x-auto hide-scrollbar pb-2">
                                    {Array.from({length: 12}, (_, mIdx) => {
                                        const daysInMon = new Date(year, mIdx + 1, 0).getDate();
                                        const firstDay = new Date(year, mIdx, 1).getDay();
                                        return (
                                            <div key={mIdx} className="flex-shrink-0" style={{ width: '126px' }}>
                                                <p className="text-[10px] font-black mb-1.5" style={{ color: '#f472b6' }}>{mIdx + 1}月</p>
                                                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: '1.5px' }}>
                                                    {['日','一','二','三','四','五','六'].map(d => (
                                                        <div key={d} style={{ fontSize: '6px', fontWeight: 700, color: '#d1d5db', textAlign: 'center', height: '13px', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>{d}</div>
                                                    ))}
                                                    {Array.from({length: firstDay}).map((_, i) => <div key={`e-${i}`} style={{ height: '15px' }} />)}
                                                    {Array.from({length: daysInMon}, (_, i) => {
                                                        const d = i + 1;
                                                        const ds = `${year}-${String(mIdx+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                                                        const isPeriod = periodDays.has(ds);
                                                        const isToday = ds === TODAY_STR;
                                                        return (
                                                            <div key={d} onClick={() => toggleDay(ds)}
                                                                style={{
                                                                    height: '15px', fontSize: '7px', fontWeight: 700,
                                                                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                                                                    borderRadius: '2px', cursor: 'pointer',
                                                                    background: isPeriod ? '#f9a8d4' : isToday ? '#475569' : 'transparent',
                                                                    color: isPeriod ? '#be185d' : isToday ? '#fff' : '#9ca3af',
                                                                }}>
                                                                {d}
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* 统计数据 */}
                            <div className="px-6 py-4">
                                <h3 className="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-3">统计数据</h3>
                                <div className="grid grid-cols-2 gap-3">
                                    {[
                                        { label: '平均周期天数', value: avgCycle != null ? `${avgCycle} 天` : '—' },
                                        { label: '平均持续天数', value: avgDuration != null ? `${avgDuration} 天` : '—' },
                                        { label: '今年记录次数', value: `${thisYearPeriods.length} 次` },
                                        { label: '最近开始日期', value: lastStart ? lastStart.slice(5).replace('-', '/') : '—' },
                                    ].map(stat => (
                                        <div key={stat.label} className="rounded-xl p-3" style={{ background: '#fdf2f8' }}>
                                            <p className="text-[9px] font-black uppercase tracking-wide mb-1" style={{ color: '#f472b6' }}>{stat.label}</p>
                                            <p className="text-xl font-black leading-none" style={{ color: '#e11d48' }}>{stat.value}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const SmokingDetailModal = ({ isOpen, onClose, log, saveLog, goal }) => {
            const now = new Date();
            const [displayYear, setDisplayYear] = useState(now.getFullYear());
            const [displayMonth, setDisplayMonth] = useState(now.getMonth() + 1);
            const [backfillDate, setBackfillDate] = useState(TODAY_STR);
            const [backfillCount, setBackfillCount] = useState('');

            if (!isOpen) return null;

            const monthStr = `${displayYear}-${String(displayMonth).padStart(2, '0')}`;
            const daysInMonth = new Date(displayYear, displayMonth, 0).getDate();

            const goPrev = () => { if (displayMonth === 1) { setDisplayMonth(12); setDisplayYear(y => y - 1); } else setDisplayMonth(m => m - 1); };
            const goNext = () => { if (displayMonth === 12) { setDisplayMonth(1); setDisplayYear(y => y + 1); } else setDisplayMonth(m => m + 1); };

            const saveBackfill = () => {
                const count = parseInt(backfillCount);
                if (isNaN(count) || count < 0) return;
                saveLog({ ...log, [backfillDate]: count });
                setBackfillCount('');
            };

            const monthDays = Array.from({length: daysInMonth}, (_, i) => {
                const d = i + 1;
                const key = `${monthStr}-${String(d).padStart(2, '0')}`;
                return { day: d, key, count: log[key] || 0 };
            });
            const maxBar = Math.max(...monthDays.map(d => d.count), goal, 1);
            const monthTotal = monthDays.reduce((s, d) => s + d.count, 0);
            const recordedDays = monthDays.filter(d => d.count > 0);
            const monthAvgStr = recordedDays.length > 0 ? (monthTotal / recordedDays.length).toFixed(1) : '0';
            const overDays = monthDays.filter(d => d.count > goal && d.count > 0).length;
            const maxDay = monthDays.reduce((a, b) => b.count > a.count ? b : a, { day: 0, count: 0 });

            const prevMonthStr = displayMonth === 1
                ? `${displayYear - 1}-12`
                : `${displayYear}-${String(displayMonth - 1).padStart(2, '0')}`;
            const prevDaysCount = displayMonth === 1
                ? new Date(displayYear - 1, 12, 0).getDate()
                : new Date(displayYear, displayMonth - 1, 0).getDate();
            const prevTotal = Array.from({length: prevDaysCount}, (_, i) => {
                const k = `${prevMonthStr}-${String(i+1).padStart(2,'0')}`;
                return log[k] || 0;
            }).reduce((s, v) => s + v, 0);
            const monthDiff = monthTotal - prevTotal;

            const yearRows = Array.from({length: 12}, (_, i) => {
                const m = i + 1;
                const ms = `${displayYear}-${String(m).padStart(2, '0')}`;
                const mDayCount = new Date(displayYear, m, 0).getDate();
                const mVals = Array.from({length: mDayCount}, (_, j) => log[`${ms}-${String(j+1).padStart(2,'0')}`] || 0);
                const mRecorded = mVals.filter(v => v > 0).length;
                const mTotal = mVals.reduce((s, v) => s + v, 0);
                return { month: m, avgPerDay: mRecorded > 0 ? mTotal / mRecorded : 0 };
            });
            const maxYearAvg = Math.max(...yearRows.map(r => r.avgPerDay), 1);

            return (
                <div className="fixed inset-0 z-[95] flex items-center justify-center p-4 glass-overlay animate-fade-in" onClick={onClose}>
                    <div className="bg-white w-full max-w-lg rounded-3xl shadow-2xl animate-slide-up flex flex-col" style={{ maxHeight: '92vh' }} onClick={e => e.stopPropagation()}>
                        <div className="px-6 pt-5 pb-4 border-b border-gray-50 flex items-center justify-between flex-shrink-0">
                            <div>
                                <p className="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-0.5">🚬 抽烟记录</p>
                                <h2 className="font-black text-base text-gray-800">详细数据</h2>
                            </div>
                            <button onClick={onClose} className="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center font-bold text-gray-500 hover:bg-gray-200">×</button>
                        </div>

                        <div className="flex-1 overflow-y-auto hide-scrollbar">
                            {/* 补录入口 */}
                            <div className="px-6 py-4 border-b border-gray-50">
                                <h3 className="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-3">补录数据</h3>
                                <div className="flex gap-2 items-center">
                                    <input type="date" value={backfillDate} max={TODAY_STR}
                                        onChange={e => setBackfillDate(e.target.value)}
                                        className="flex-1 text-sm font-bold rounded-xl px-3 py-2 border border-slate-200 bg-slate-50 outline-none" />
                                    <input type="number" min="0" placeholder="根数" value={backfillCount}
                                        onChange={e => setBackfillCount(e.target.value)}
                                        onKeyDown={e => e.key === 'Enter' && saveBackfill()}
                                        className="w-20 text-sm font-bold rounded-xl px-3 py-2 border border-slate-200 bg-slate-50 outline-none text-center" />
                                    <button onClick={saveBackfill}
                                        className="px-4 py-2 rounded-xl text-sm font-black text-white flex-shrink-0"
                                        style={{ background: '#475569' }}>保存</button>
                                </div>
                            </div>

                            {/* 月度视图 */}
                            <div className="px-6 py-4 border-b border-gray-50">
                                <div className="flex items-center justify-between mb-3">
                                    <h3 className="text-[10px] font-black uppercase tracking-widest text-gray-400">月度视图</h3>
                                    <div className="flex items-center gap-2">
                                        <button onClick={goPrev} className="w-6 h-6 rounded-full bg-gray-100 font-bold text-gray-500 text-xs hover:bg-gray-200 flex items-center justify-center">←</button>
                                        <span className="text-xs font-black text-gray-700 whitespace-nowrap">{displayYear}年{displayMonth}月</span>
                                        <button onClick={goNext} className="w-6 h-6 rounded-full bg-gray-100 font-bold text-gray-500 text-xs hover:bg-gray-200 flex items-center justify-center">→</button>
                                    </div>
                                </div>
                                <div className="flex items-end gap-[1.5px]" style={{ height: '80px' }}>
                                    {monthDays.map(({ day, key, count }) => {
                                        const barH = count > 0 ? Math.max(Math.round(count / maxBar * 64), 3) : 2;
                                        const isToday = key === TODAY_STR;
                                        const color = isToday ? '#475569' : count === 0 ? '#e2e8f0' : count > goal ? '#ef4444' : '#22c55e';
                                        return (
                                            <div key={day} className="flex-1 flex flex-col items-center justify-end" style={{ gap: '2px' }}>
                                                <div className="w-full rounded-t-sm" style={{ height: `${barH}px`, background: color }} />
                                                {(day % 7 === 1 || day === daysInMonth) && (
                                                    <span style={{ fontSize: '6px', color: '#94a3b8', fontWeight: 700, lineHeight: 1 }}>{day}</span>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                                <div className="flex gap-3 mt-2">
                                    {[['#22c55e','未超标'],['#ef4444','超标'],['#e2e8f0','无记录']].map(([c, l]) => (
                                        <span key={l} className="flex items-center gap-1">
                                            <span className="w-2 h-2 rounded-sm flex-shrink-0" style={{ background: c }}></span>
                                            <span style={{ fontSize: '9px', fontWeight: 700, color: '#9ca3af' }}>{l}</span>
                                        </span>
                                    ))}
                                </div>
                            </div>

                            {/* 月度统计 */}
                            <div className="px-6 py-4 border-b border-gray-50">
                                <h3 className="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-3">月度统计</h3>
                                <div className="grid grid-cols-2 gap-2 mb-2">
                                    {[
                                        { label: '本月总计', value: `${monthTotal} 根`, color: '#334155' },
                                        { label: '日均（有记录天）', value: `${monthAvgStr} 根`, color: '#334155' },
                                        { label: '超标天数', value: `${overDays} 天`, color: overDays > 0 ? '#ef4444' : '#22c55e' },
                                        { label: '最多一天', value: maxDay.count > 0 ? `${maxDay.count}根 · ${maxDay.day}日` : '—', color: '#334155' },
                                    ].map(stat => (
                                        <div key={stat.label} className="bg-slate-50 rounded-xl p-3">
                                            <p className="text-[9px] font-black text-slate-400 mb-1">{stat.label}</p>
                                            <p className="text-base font-black leading-tight" style={{ color: stat.color }}>{stat.value}</p>
                                        </div>
                                    ))}
                                </div>
                                <div className="bg-slate-50 rounded-xl p-3 flex items-center justify-between">
                                    <p className="text-[10px] font-black text-slate-400">与上月对比</p>
                                    <p className="text-sm font-black" style={{ color: monthDiff > 0 ? '#ef4444' : monthDiff < 0 ? '#22c55e' : '#94a3b8' }}>
                                        {monthDiff > 0 ? `↑ ${monthDiff}` : monthDiff < 0 ? `↓ ${Math.abs(monthDiff)}` : '持平'} 根
                                    </p>
                                </div>
                            </div>

                            {/* 年度趋势 */}
                            <div className="px-6 py-4">
                                <h3 className="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-3">{displayYear} 年度趋势 · 日均根数</h3>
                                <div className="flex items-end gap-1" style={{ height: '70px' }}>
                                    {yearRows.map((m) => {
                                        const barH = m.avgPerDay > 0 ? Math.max(Math.round(m.avgPerDay / maxYearAvg * 54), 3) : 2;
                                        const isCur = m.month === displayMonth;
                                        return (
                                            <div key={m.month} className="flex-1 flex flex-col items-center justify-end" style={{ gap: '2px' }}>
                                                <div className="w-full rounded-t-sm" style={{ height: `${barH}px`, background: isCur ? '#475569' : '#cbd5e1' }} />
                                                <span style={{ fontSize: '7px', fontWeight: 700, color: isCur ? '#475569' : '#94a3b8' }}>{m.month}</span>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const PeriodWidget = () => {
            const normalize = (entries) => entries.map(e => {
                if (e.endDate) return e;
                const s = new Date(e.startDate + 'T00:00:00');
                const en = new Date(s);
                en.setDate(en.getDate() + (e.duration || 5) - 1);
                return { startDate: e.startDate, endDate: en.toISOString().split('T')[0] };
            });

            const [log, setLog] = useState(() => {
                try {
                    const d = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}');
                    return normalize(d.periodLog || []);
                } catch { return []; }
            });
            const [showDetail, setShowDetail] = useState(false);

            const today = new Date(); today.setHours(0,0,0,0);
            const todayStr = today.toISOString().split('T')[0];

            const saveLog = (next) => {
                setLog(next);
                try {
                    const d = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}');
                    d.periodLog = next;
                    localStorage.setItem('visualLifeOS_data', JSON.stringify(d));
                } catch {}
                syncToCloud();
            };

            const sorted = [...log].sort((a, b) => a.startDate.localeCompare(b.startDate));
            const last = sorted[sorted.length - 1];

            let statusText = '暂无记录';
            let statusColor = '#94a3b8';
            let isInPeriod = false;

            if (last) {
                const startD = new Date(last.startDate + 'T00:00:00'); startD.setHours(0,0,0,0);
                const endD   = new Date(last.endDate   + 'T00:00:00'); endD.setHours(0,0,0,0);

                if (today >= startD && today <= endD) {
                    statusText = `第 ${Math.floor((today - startD) / 86400000) + 1} 天`;
                    statusColor = '#e11d48';
                    isInPeriod = true;
                } else {
                    let avgCycle = 28;
                    if (sorted.length >= 2) {
                        const ivs = [];
                        for (let i = sorted.length - 1; i > Math.max(0, sorted.length - 4); i--) {
                            ivs.push(Math.floor((new Date(sorted[i].startDate + 'T00:00:00') - new Date(sorted[i-1].startDate + 'T00:00:00')) / 86400000));
                        }
                        if (ivs.length) avgCycle = Math.round(ivs.reduce((s,v)=>s+v,0) / ivs.length);
                    }
                    const daysSinceStart = Math.floor((today - startD) / 86400000);
                    const daysToNext = avgCycle - daysSinceStart;
                    const daysSinceEnd = Math.floor((today - endD) / 86400000);
                    if (daysToNext > 0 && daysToNext <= 7) {
                        statusText = `预计还有 ${daysToNext} 天`;
                        statusColor = '#ec4899';
                    } else {
                        statusText = `距上次 ${daysSinceEnd} 天`;
                        statusColor = '#94a3b8';
                    }
                }
            }

            const handleStart = () => {
                if (isInPeriod || log.some(e => e.startDate === todayStr)) return;
                saveLog([...log, { startDate: todayStr, endDate: todayStr }]);
            };
            const handleEnd = () => {
                if (!isInPeriod || !last) return;
                saveLog(log.map(e => e.startDate === last.startDate ? { ...e, endDate: todayStr } : e));
            };

            const recent6 = sorted.slice(-6);
            const maxDur = Math.max(...recent6.map(e => {
                return Math.floor((new Date(e.endDate+'T00:00:00') - new Date(e.startDate+'T00:00:00')) / 86400000) + 1;
            }), 1);

            return (
                <div className="h-full flex flex-col p-4 rounded-os-xl" style={{ background: '#FDF2F8', border: '1.5px solid #f0d8ea' }}>
                    <div className="flex items-center justify-between mb-2 flex-shrink-0">
                        <div className="flex items-center gap-1.5">
                            <span style={{ fontSize: '13px' }}>🌸</span>
                            <h3 className="font-black text-[10px] uppercase tracking-widest" style={{ color: '#9d174d' }}>经期记录</h3>
                        </div>
                        <button onClick={() => setShowDetail(true)} className="text-[9px] font-black px-2 py-0.5 rounded-full" style={{ background: '#fce7f3', color: '#e11d48' }}>详情</button>
                    </div>
                    <p className="text-xl font-black mb-2 flex-shrink-0 leading-none" style={{ color: statusColor }}>{statusText}</p>
                    <div className="flex items-end gap-1.5 flex-1 mb-2 overflow-hidden">
                        {recent6.map((e, idx) => {
                            const sD = new Date(e.startDate+'T00:00:00');
                            const dur = Math.floor((new Date(e.endDate+'T00:00:00') - sD) / 86400000) + 1;
                            const barH = Math.max(Math.round(dur / maxDur * 28), 10);
                            const isLatest = idx === recent6.length - 1;
                            return (
                                <div key={e.startDate} className="flex-1 flex flex-col items-center gap-0.5 min-w-0">
                                    <div className="w-full rounded-sm flex items-center justify-center"
                                        style={{ height: `${barH}px`, background: isLatest && isInPeriod ? '#e11d48' : '#f9a8d4' }}>
                                        <span className="text-[7px] font-black text-white leading-none">{dur}d</span>
                                    </div>
                                    <span className="text-[8px] font-bold leading-none" style={{ color: '#f472b6' }}>{sD.getMonth()+1}/{sD.getDate()}</span>
                                </div>
                            );
                        })}
                    </div>
                    <div className="flex gap-2 flex-shrink-0">
                        <button onClick={handleStart} disabled={isInPeriod}
                            className="flex-1 py-1.5 rounded-xl text-[11px] font-black text-white transition-opacity disabled:opacity-30"
                            style={{ background: '#f472b6' }}>开始记录</button>
                        <button onClick={handleEnd} disabled={!isInPeriod}
                            className="flex-1 py-1.5 rounded-xl text-[11px] font-black transition-opacity disabled:opacity-30"
                            style={{ background: isInPeriod ? '#fce7f3' : '#f3f4f6', color: isInPeriod ? '#e11d48' : '#9ca3af' }}>结束记录</button>
                    </div>
                    {showDetail && <PeriodDetailModal isOpen={showDetail} onClose={() => setShowDetail(false)} log={log} saveLog={saveLog} />}
                </div>
            );
        };

        const SmokingWidget = () => {
            const todayStr = new Date().toISOString().split('T')[0];

            const [log, setLog] = useState(() => {
                try { const d = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}'); return d.smokingLog || {}; }
                catch { return {}; }
            });
            const [goal, setGoal] = useState(() => {
                try { const d = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}'); return d.smokingGoal || 20; }
                catch { return 20; }
            });
            const [editingGoal, setEditingGoal] = useState(false);
            const [goalInput, setGoalInput] = useState('');
            const [showDetail, setShowDetail] = useState(false);

            const saveLog = (next) => {
                setLog(next);
                try { const d = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}'); d.smokingLog = next; localStorage.setItem('visualLifeOS_data', JSON.stringify(d)); } catch {}
            };
            const saveGoal = (g) => {
                setGoal(g);
                try { const d = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}'); d.smokingGoal = g; localStorage.setItem('visualLifeOS_data', JSON.stringify(d)); } catch {}
            };

            const todayCount = log[todayStr] || 0;
            const change = (delta) => saveLog({ ...log, [todayStr]: Math.max(0, todayCount + delta) });

            const last7 = Array.from({ length: 7 }, (_, i) => {
                const d = new Date(); d.setDate(d.getDate() - 6 + i);
                const key = d.toISOString().split('T')[0];
                return { key, label: `${d.getMonth()+1}/${d.getDate()}`, count: log[key] || 0, isToday: key === todayStr };
            });
            const maxBar = Math.max(...last7.map(d => d.count), goal, 1);

            const now = new Date();
            const mPrefix = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
            const mEntries = Object.entries(log).filter(([k]) => k.startsWith(mPrefix));
            const monthAvg = mEntries.length > 0 ? (mEntries.reduce((s,[,v])=>s+v,0) / mEntries.length).toFixed(1) : '0';

            return (
                <div className="h-full flex flex-col p-3 rounded-os-xl" style={{ background: '#F1F5F9' }}>
                    <div className="flex items-center justify-between mb-1.5 flex-shrink-0">
                        <div className="flex items-center gap-1.5">
                            <span style={{ fontSize: '13px' }}>🚬</span>
                            <h3 className="font-black text-[9px] uppercase tracking-widest text-slate-500">爸爸的抽烟记录</h3>
                        </div>
                        <div className="flex items-center gap-1">
                            {editingGoal ? (
                                <div className="flex items-center gap-1">
                                    <input type="number" value={goalInput} onChange={e => setGoalInput(e.target.value)}
                                        className="w-10 text-[11px] font-bold text-center bg-white rounded-lg px-1 py-0.5 border border-gray-200 outline-none" />
                                    <button onClick={() => { saveGoal(parseInt(goalInput)||20); setEditingGoal(false); }}
                                        className="text-[11px] font-black text-green-600">✓</button>
                                </div>
                            ) : (
                                <button onClick={() => { setGoalInput(String(goal)); setEditingGoal(true); }}
                                    className="text-[9px] font-black px-2 py-0.5 rounded-full bg-white text-slate-400 border border-slate-200">
                                    目标{goal}根
                                </button>
                            )}
                            {!editingGoal && (
                                <button onClick={() => setShowDetail(true)}
                                    className="text-[9px] font-black px-2 py-0.5 rounded-full bg-slate-200 text-slate-600">
                                    详情
                                </button>
                            )}
                        </div>
                    </div>
                    <div className="flex items-center justify-center gap-3 mb-2 flex-shrink-0">
                        <button onClick={() => change(-1)} className="w-7 h-7 rounded-full bg-white shadow-sm font-black text-slate-500 flex items-center justify-center text-base hover:bg-gray-100 transition-colors">−</button>
                        <div className="text-center">
                            <span className="font-black leading-none" style={{ fontSize: '36px', color: todayCount > goal ? '#ef4444' : '#334155' }}>{todayCount}</span>
                            <p className="text-[9px] text-slate-400 font-bold">今日</p>
                        </div>
                        <button onClick={() => change(1)} className="w-7 h-7 rounded-full bg-white shadow-sm font-black text-slate-500 flex items-center justify-center text-base hover:bg-gray-100 transition-colors">+</button>
                    </div>
                    <div className="flex items-end gap-0.5 flex-1 mb-1.5">
                        {last7.map(day => {
                            const barH = day.count > 0 ? Math.max(Math.round(day.count / maxBar * 40), 3) : 2;
                            const color = day.count > goal ? '#ef4444' : day.isToday ? '#475569' : '#cbd5e1';
                            return (
                                <div key={day.key} className="flex-1 flex flex-col items-center justify-end gap-0.5">
                                    <div className="w-full rounded-t-sm" style={{ height: `${barH}px`, background: color }} />
                                    <span className="text-[7px] font-bold text-slate-400">{day.label}</span>
                                </div>
                            );
                        })}
                    </div>
                    <p className="text-[9px] text-slate-400 font-bold text-center flex-shrink-0">本月日均 <span className="font-black text-slate-600">{monthAvg}</span> 根</p>
                    {showDetail && <SmokingDetailModal isOpen={showDetail} onClose={() => setShowDetail(false)} log={log} saveLog={saveLog} goal={goal} />}
                </div>
            );
        };

        // ── 天气 Widget ──
        const WC_ICON = (code) => {
            if (code === 0) return '☀️';
            if (code <= 2) return '⛅';
            if (code === 3) return '☁️';
            if (code === 45 || code === 48) return '🌫️';
            if (code >= 51 && code <= 67) return '🌧️';
            if (code >= 71 && code <= 77) return '❄️';
            if (code >= 80 && code <= 82) return '🌦️';
            if (code === 95) return '⛈️';
            return '🌈';
        };
        const WC_DESC = (code) => {
