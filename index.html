<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visual Life OS</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Life OS">
    <meta name="theme-color" content="#E6B422">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'],
                        serif: ['"Noto Serif SC"', 'serif'] // 用于AI报告的杂志排版感
                    },
                    colors: {
                        'os-bg': '#FFFBEB',       // 全局底色
                        'os-yellow': '#FEF3C7',   // 暖黄
                        'os-purple': '#E9D5FF',   // 紫罗兰
                        'os-pink': '#FDF2F8',     // 浅粉
                        'os-green': '#ECFDF5',    // 薄荷绿
                        'os-blue': '#DBEAFE',     // 婴儿蓝
                        'os-text': '#475569',     // 深灰文本
                    },
                    borderRadius: { 'os-xl': '1.5rem' }, // 24px 平滑圆角
                    animation: {
                        'fade-in': 'fadeIn 0.2s ease-out',
                        'slide-up': 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
                        'slide-left': 'slideLeft 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
                        'wiggle': 'wiggle 0.3s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        slideLeft: { '0%': { opacity: '0', transform: 'translateX(-24px)' }, '100%': { opacity: '1', transform: 'translateX(0)' } },
                        wiggle: { '0%, 100%': { transform: 'rotate(-1deg)' }, '50%': { transform: 'rotate(1deg)' } },
                    }
                }
            }
        }
    </script>
    <style>
        :root { --theme-bg: #FFFBEB; --theme-accent: #E6B422; --theme-text: #475569; --accent: #E6B422; --finance-bg: #FFFBF0; --finance-border: #e6dcc0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--theme-bg); -webkit-tap-highlight-color: transparent; transition: background-color 0.3s; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        .glass-panel { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.8); }
        .glass-overlay { background: rgba(0, 0, 0, 0.25); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
        .dragging { opacity: 0.5; transform: scale(1.05); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
        @keyframes musicBar { 0%,100%{transform:scaleY(0.25)} 50%{transform:scaleY(1)} }
        .music-bar { display:inline-block; width:3px; border-radius:2px; background:#a78bfa; transform-origin:bottom; animation:musicBar 0.7s ease-in-out infinite; }
        .music-bar:nth-child(2){ animation-delay:0.2s; }
        .music-bar:nth-child(3){ animation-delay:0.4s; }
        @keyframes viewIn { 0%{opacity:0;transform:translateY(12px)} 100%{opacity:1;transform:translateY(0)} }
        .animate-view-in { animation: viewIn 0.25s cubic-bezier(0.22,1,0.36,1); }
        /* fadeInUp：视图切换 + 一般淡入均加 Y 轴滑动 */
        @keyframes fadeInUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
        .animate-fade-in { animation: fadeInUp 0.22s cubic-bezier(0.22,1,0.36,1) !important; }
        /* scaleIn：弹窗内容面板 */
        @keyframes scaleIn { from{opacity:0;transform:scale(0.95)} to{opacity:1;transform:scale(1)} }
        .animate-scale-in { animation: scaleIn 0.18s cubic-bezier(0.22,1,0.36,1); }
        /* 顶部同步进度条 */
        @keyframes syncSlide { 0%{left:-60%;width:60%} 100%{left:110%;width:60%} }
        .sync-bar { position:fixed;top:0;left:0;right:0;height:2px;z-index:300;overflow:hidden; }
        .sync-bar::after { content:'';position:absolute;top:0;height:100%;background:var(--accent);border-radius:2px;
                           animation:syncSlide 1s ease-in-out infinite; }
        /* 按钮按下反馈 */
        button:not(:disabled) { transition: transform 0.1s ease, opacity 0.1s ease; }
        button:not(:disabled):active { transform: scale(0.95) !important; opacity: 0.85; }
        @keyframes voiceWave { 0%,100%{transform:scaleY(0.3)} 50%{transform:scaleY(1)} }
        .voice-bar { display:inline-block; width:3px; border-radius:2px; background:#ef4444; transform-origin:center; animation:voiceWave 0.6s ease-in-out infinite; }
        .voice-bar:nth-child(2){animation-delay:0.1s;height:16px;} .voice-bar:nth-child(3){animation-delay:0.2s;height:20px;} .voice-bar:nth-child(4){animation-delay:0.1s;height:16px;} .voice-bar:nth-child(5){animation-delay:0s;height:12px;}
        @keyframes widgetDragging { 0%,100%{transform:scale(1.05) rotate(-0.5deg)} 50%{transform:scale(1.05) rotate(0.5deg)} }
        .widget-dragging { animation: widgetDragging 0.4s ease-in-out infinite; box-shadow: 0 20px 40px rgba(0,0,0,0.25); z-index:50; }
        /* 深夜主题 CSS 变量 */
        :root {
            --card-bg: #ffffff; --card-border: #f1f5f9;
            --text-primary: inherit; --text-secondary: #64748b;
            --input-bg: #f8fafc; --modal-bg: #ffffff;

            --text-primary: #f1f5f9; --text-secondary: #94a3b8;
            --input-bg: #0f172a; --modal-bg: #0f172a;
            --border-color: #334155; --bg-secondary: #162032;
        }
        /* 深夜主题覆盖 */
        [data-theme="dark"] .bg-white { background-color: var(--card-bg) !important; }
        [data-theme="dark"] .bg-gray-50 { background-color: var(--bg-secondary) !important; }
        [data-theme="dark"] .bg-gray-100 { background-color: var(--card-bg) !important; }
        [data-theme="dark"] .bg-gray-200 { background-color: #334155 !important; }
        [data-theme="dark"] .bg-white\/60, [data-theme="dark"] .bg-white\/90 { background-color: rgba(30,41,59,0.85) !important; }
        [data-theme="dark"] .glass-panel { background: rgba(15,23,42,0.92) !important; border-color: var(--border-color) !important; }
        [data-theme="dark"] .glass-overlay { background: rgba(0,0,0,0.65) !important; }
        [data-theme="dark"] .text-gray-700, [data-theme="dark"] .text-gray-800, [data-theme="dark"] .text-gray-900 { color: var(--text-primary) !important; }
        [data-theme="dark"] .text-gray-400, [data-theme="dark"] .text-gray-500, [data-theme="dark"] .text-gray-600 { color: var(--text-secondary) !important; }
        [data-theme="dark"] .text-gray-300 { color: #64748b !important; }
        [data-theme="dark"] .border-gray-50, [data-theme="dark"] .border-gray-100, [data-theme="dark"] .border-gray-200 { border-color: var(--border-color) !important; }
        [data-theme="dark"] .divide-gray-50 > * + *, [data-theme="dark"] .divide-gray-100 > * + * { border-color: var(--border-color) !important; }
        [data-theme="dark"] .shadow-sm, [data-theme="dark"] .shadow-md, [data-theme="dark"] .shadow-lg { box-shadow: 0 2px 8px rgba(0,0,0,0.6) !important; }
        [data-theme="dark"] .bg-os-bg { background-color: #0f172a !important; }
        /* 输入框深色适配 */
        [data-theme="dark"] input:not([type=range]):not([type=checkbox]):not([type=radio]),
        [data-theme="dark"] select,
        [data-theme="dark"] textarea {
            background-color: var(--input-bg) !important;
            color: var(--text-primary) !important;
            border-color: var(--border-color) !important;
        }
        [data-theme="dark"] input::placeholder, [data-theme="dark"] textarea::placeholder { color: #475569 !important; }
        /* 弹窗背景适配 */
        [data-theme="dark"] .rounded-3xl:not([class*="bg-"]):not([class*="glass"]),
        [data-theme="dark"] .rounded-\[2rem\]:not([class*="bg-"]):not([class*="glass"]) {
            background-color: var(--modal-bg);
        }
        [data-theme="dark"] .rounded-3xl.shadow-2xl, [data-theme="dark"] .rounded-\[2rem\].shadow-2xl,
        [data-theme="dark"] .rounded-3xl.bg-white, [data-theme="dark"] .rounded-\[2rem\].bg-white {
            background-color: var(--modal-bg) !important;
            border: 1px solid var(--border-color);
        }
        /* 分隔线 */
        [data-theme="dark"] .border-b, [data-theme="dark"] .border-t { border-color: var(--border-color) !important; }
        /* Finance Widget 深色金边 */
        [data-theme="dark"] .border-\[var\(--finance-border\)\] { border-color: #60a5fa !important; }
        /* 白色文字保护 */
        [data-theme="dark"] .text-white { color: #ffffff !important; }
        [data-theme="dark"] .text-os-text { color: var(--text-primary) !important; }
        /* 骨架屏 */
        @keyframes shimmer { from{background-position:-200px 0} to{background-position:200px 0} }
        .skeleton { background:linear-gradient(90deg,#e2e8f0 25%,#f1f5f9 50%,#e2e8f0 75%);
                    background-size:400px 100%;animation:shimmer 1.2s ease-in-out infinite;border-radius:8px; }
        [data-theme="dark"] .skeleton { background:linear-gradient(90deg,#1e293b 25%,#334155 50%,#1e293b 75%);
                    background-size:400px 100%;animation:shimmer 1.2s ease-in-out infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // ── Supabase 初始化 ──
        const SUPABASE_URL = 'https://aiyflmkzzuiwmamvoils.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFpeWZsbWt6enVpd21hbXZvaWxzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMzQ0OTksImV4cCI6MjA5NDYxMDQ5OX0.1L59zixF4zg1yCahqo44h41kOiBfrWvtAGYvhGpRKAs';
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 当前登录用户 ID（登录后由 auth 设置）
        let CURRENT_USER_ID = null;

        // ── localStorage 读取（每次调用返回最新数据，不缓存）──
        const getFinanceStorage = () => {
            try { return JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}'); }
            catch { return {}; }
        };

        // 触感反馈（Android 支持，iOS 静默忽略）
        const haptic = (ms = 50) => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch {} };

        // ── 默认记账分类 ──
        const _DEFAULT_FINANCE_CATS = ['一日三餐','吃饭','购物/超市','购物/日用品','购物/化妆护肤品','购物/周边','购物/吃的','购物/衣服','购物/玩的','氪金','机票','交通','礼物','医疗','会员','课程'];

        // ── 云同步函数（全局，供所有 Widget 直接调用）──
        const syncToCloud = async () => {
            if (!CURRENT_USER_ID) {
                try {
                    const { data: { session } } = await _supabase.auth.getSession();
                    CURRENT_USER_ID = session?.user?.id ?? null;
                } catch {}
            }
            if (!CURRENT_USER_ID) return false;
            try {
                const local = getFinanceStorage();
                console.log('[sync] uploading for user:', CURRENT_USER_ID);
                const { error } = await _supabase.from('lifeos_data').upsert({
                    id:                   CURRENT_USER_ID,
                    transactions:         local.transactions        || [],
                    categories:           local.categories          || [],
                    fixed_items_by_month: local.fixedItemsByMonth   || {},
                    wishlist:             local.wishlist            || [],
                    todos:                local.allTodos            || {},
                    habits:               local.habits              || {},
                    period_log:           local.periodLog           || [],
                    countdowns:           local.countdowns          || { name: '回国 🛫', date: '2026-08-31' },
                    now_playing:          local.nowPlaying          || {},
                    exchange_rate:        local.exchangeRate        || 0.048,
                    monthly_rates:        local.monthlyRates        || {},
                    theme:                local.theme               || 'cream',
                    smoking_log:          local.smokingLog          || {},
                    smoking_goal:         local.smokingGoal         || 20,
                    all_meals:            local.allMeals            || {},
                    vault:                local.vault               || { items: [] },
                    life_events:          local.lifeEvents           || [],
                    diary:                local.diary               || {},
                    projects:             local.projects             || [],
                    anime_orders:         local.animeOrders          || [],
                    anime_goods:          local.animeGoods           || [],
                    anime_display:        local.animeDisplay         || [],
                    updated_at:           new Date().toISOString(),
                });
                if (error) console.error('[sync] error:', JSON.stringify(error));
                else console.log('[sync] success');
                return !error;
            } catch(e) { console.error('[sync] exception:', e.message); return false; }
        };

        const syncFromCloud = async () => {
            if (!CURRENT_USER_ID) return null;
            try {
                const { data, error } = await _supabase
                    .from('lifeos_data').select('*').eq('id', CURRENT_USER_ID).single();
                if (error || !data) return null;
                const local = getFinanceStorage();
                const mergeArr = (cloud, loc) => {
                    const c = Array.isArray(cloud) ? cloud : [];
                    const l = Array.isArray(loc)   ? loc   : [];
                    if (c.length === 0) return l;
                    if (l.length === 0) return c;
                    const cloudIds = new Set(c.map(i => i.id));
                    const localOnly = l.filter(i => !cloudIds.has(i.id));
                    return [...c, ...localOnly];
                };
                const mergeObj = (cloud, loc) => {
                    const c = (cloud && typeof cloud === 'object' && !Array.isArray(cloud)) ? cloud : {};
                    const l = (loc   && typeof loc   === 'object' && !Array.isArray(loc))   ? loc   : {};
                    return { ...l, ...c };
                };
                const merged = {
                    ...local,
                    transactions:      mergeArr(data.transactions,         local.transactions),
                    categories:        mergeArr(data.categories,           local.categories),
                    fixedItemsByMonth: mergeObj(data.fixed_items_by_month, local.fixedItemsByMonth),
                    wishlist:          mergeArr(data.wishlist,              local.wishlist),
                    allTodos:          (() => {
                        const c = (data.todos && typeof data.todos === 'object') ? data.todos : {};
                        const l = (local.allTodos && typeof local.allTodos === 'object') ? local.allTodos : {};
                        const merged = { ...c };
                        // 每个周的 todos：本地有就用本地（保留刚改的），本地没有才用云端
                        Object.keys(l).forEach(k => { merged[k] = l[k]; });
                        return merged;
                    })(),
                    habits:            mergeObj(data.habits,                local.habits),
                    periodLog:         mergeArr(data.period_log,            local.periodLog),
                    countdowns:        data.countdowns || local.countdowns || { name: '回国 🛫', date: '2026-08-31' },
                    nowPlaying:        data.now_playing         || local.nowPlaying   || {},
                    exchangeRate:      data.exchange_rate       || local.exchangeRate || 0.048,
                    monthlyRates:      mergeObj(data.monthly_rates,         local.monthlyRates),
                    theme:             local.theme              || data.theme         || 'cream',
                    smokingLog:        mergeObj(data.smoking_log,           local.smokingLog),
                    smokingGoal:       data.smoking_goal        || local.smokingGoal  || 20,
                    allMeals:          (() => {
                        const c = (data.all_meals && typeof data.all_meals === 'object') ? data.all_meals : {};
                        const l = (local.allMeals && typeof local.allMeals === 'object') ? local.allMeals : {};
                        const merged = { ...c };
                        Object.keys(l).forEach(k => { merged[k] = l[k]; });
                        return merged;
                    })(),
                    vault:             { items: mergeArr(data.vault?.items || [], local.vault?.items || []) },
                    lifeEvents:        mergeArr(data.life_events,            local.lifeEvents),
                    diary:             mergeObj(data.diary,                 local.diary),
                    projects:          mergeArr(data.projects,              local.projects),
                    animeOrders:       mergeArr(data.anime_orders,          local.animeOrders),
                    animeGoods:        mergeArr(data.anime_goods,           local.animeGoods),
                    animeDisplay:      mergeArr(data.anime_display,         local.animeDisplay),
                };
                localStorage.setItem('visualLifeOS_data', JSON.stringify(merged));
                return merged;
            } catch(e) {
                console.log('sync from cloud failed:', e);
                return null;
            }
        };

        // 获取当前周的日期数组 (周日到周六)
        // 统一用东京时区算今天日期
        const getTodayStr = () => {
            return new Intl.DateTimeFormat('ja-JP', {
                timeZone: 'Asia/Tokyo',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            }).format(new Date()).replace(/\//g, '-');
        };

        const getWeekDates = (date = new Date()) => {
            // 用东京时间算星期几
            const tokyoStr = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Tokyo' }).format(date);
            const d = new Date(tokyoStr + 'T00:00:00');
            const day = d.getDay(); // 0=Sun, 1=Mon, ..., 6=Sat
            const sunday = new Date(d);
            sunday.setDate(d.getDate() - day);
            return Array.from({length: 7}, (_, i) => {
                const nd = new Date(sunday);
                nd.setDate(sunday.getDate() + i);
                const y = nd.getFullYear();
                const m = String(nd.getMonth()+1).padStart(2,'0');
                const dd = String(nd.getDate()).padStart(2,'0');
                return `${y}-${m}-${dd}`;
            });
        };

        const TODAY_STR = getTodayStr();
        const CURRENT_WEEK_DATES = getWeekDates(new Date());

        const getWeek = (date) => {
            const d = new Date(date);
            d.setHours(0, 0, 0, 0);
            d.setDate(d.getDate() + 4 - (d.getDay() || 7));
            const yearStart = new Date(d.getFullYear(), 0, 1);
            const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
            return `${d.getFullYear()}-w${weekNo}`;
        };

        const CATEGORIES = [
            { id: 'sport', icon: '🩰', label: '运动', color: 'bg-pink-400' },
            { id: 'food', icon: '🥩', label: '饮食', color: 'bg-yellow-400' },
            { id: 'movie', icon: '🎬', label: '影视', color: 'bg-purple-400' },
            { id: 'create', icon: '🎨', label: '创作', color: 'bg-blue-400' },
            { id: 'game', icon: '🎮', label: '游戏', color: 'bg-green-400' },
            { id: 'location', icon: '📍', label: '足迹', color: 'bg-orange-400' }
        ];

        const INITIAL_EVENTS = [];
        const INITIAL_TODOS  = [];

        const INITIAL_WIDGETS = [
            { id: 'weekly',    size: '2x1'   },  // 2x1
            { id: 'clock',     size: '1x1'   },  // 1x1
            { id: 'countdown', size: '1x1'   },  // 1x1
            { id: 'weather',   size: '2x1'   },  // 2x1
            { id: 'habits',    size: 'large' },  // 2x2
            { id: 'health',    size: 'medium'},  // 2x1
            { id: 'deadline',  size: 'medium'},  // 2x1
            { id: 'meals',     size: 'large' },  // 2x2
            { id: 'period',    size: '2x1'   },  // 2x1
            { id: 'smoking',   size: '2x1'   },  // 2x1
            { id: 'finance',   size: 'medium'},  // 2x1
            { id: 'shopping',  size: '2x1'   },  // 2x1
        ];

        // transactions 格式：{ id, date, name, amount, currency, category }
        const MOCK_TRANSACTIONS = getFinanceStorage().transactions || [];

        // 分类颜色映射（关键词匹配，越长越具体的放前面）
        const FINANCE_CAT_COLOR_MAP = [
            { keys: ['一日三餐','吃饭','外卖','烤肉','咖啡','饮料','食堂','餐饮'], color: '#e07a5f' },
            { keys: ['超市','日用品','日用'],                                        color: '#E6B422' },
            { keys: ['化妆','护肤','美容','美妆','衣服','服饰','芭蕾'],              color: '#f472b6' },
            { keys: ['氪金','会员','订阅'],                                          color: '#60a5fa' },
            { keys: ['周边','玩的','游戏','娱乐','景点'],                             color: '#a78bfa' },
            { keys: ['机票','交通','电车','地铁','出行'],                             color: '#34d399' },
            { keys: ['医疗','课程','学费','学习','教育'],                             color: '#94a3b8' },
            { keys: ['礼物','送礼'],                                                  color: '#fb7185' },
        ];
        const getCatColor = (cat) => {
            if (!cat) return '#d1d5db';
            for (const { keys, color } of FINANCE_CAT_COLOR_MAP) {
                if (keys.some(k => cat.includes(k))) return color;
            }
            return '#d1d5db';
        };

        // ── 抽烟提醒调度（模块级，可递归调用）──
        const scheduleSmokingReminder = () => {
            const settings = (getFinanceStorage().notifySettings) || {};
            if (!settings.smokingEnabled) return;
            const [h, m] = (settings.smokingTime || '21:00').split(':').map(Number);
            const now = new Date();
            const next = new Date();
            next.setHours(h, m, 0, 0);
            if (next <= now) next.setDate(next.getDate() + 1);
            const ms = next - now;
            setTimeout(() => {
                const log = (getFinanceStorage().smokingLog) || {};

                const ctx = canvas.getContext('2d');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;

                const particles = Array.from({ length: 25 }, () => ({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 10 + 5,
                    speedY: Math.random() * 1.2 + 0.3,
                    speedX: Math.random() * 0.6 - 0.3,
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.03,
                    opacity: Math.random() * 0.4 + 0.1,
                }));

                const EMOJIS = { sakura: '🌸', star: '✦', bubble: '○' };
                const emoji = EMOJIS[type] || '🌸';

                let animId;
                const draw = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    particles.forEach(p => {
                        ctx.save();
                        ctx.globalAlpha = p.opacity;
                        ctx.translate(p.x, p.y);
                        ctx.rotate(p.rotation);
                        if (type === 'star') {
                            ctx.fillStyle = accentColor;
                            ctx.font = `${p.size}px serif`;
                            ctx.fillText('✦', -p.size/2, p.size/2);
                        } else if (type === 'bubble') {
                            ctx.strokeStyle = accentColor;
                            ctx.lineWidth = 1.5;
                            ctx.beginPath();
                            ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
                            ctx.stroke();
                        } else {
                            ctx.font = `${p.size}px serif`;
                            ctx.fillText(emoji, -p.size/2, p.size/2);
                        }
                        ctx.restore();
                        p.y += p.speedY;
                        p.x += p.speedX;
                        p.rotation += p.rotSpeed;
                        if (p.y > canvas.height + 20) {
                            p.y = -20;
                            p.x = Math.random() * canvas.width;
                        }
                    });
                    animId = requestAnimationFrame(draw);
                };
                draw();

                const onResize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
                window.addEventListener('resize', onResize);
                return () => { cancelAnimationFrame(animId); window.removeEventListener('resize', onResize); };

                    const all = [report, ...(d.aiReports || [])].slice(0, 20);
                    d.aiReports = all;
                    localStorage.setItem('visualLifeOS_data', JSON.stringify(d));
                    syncToCloud();
                    setHistory(all.filter(r => r.type === type));
                    setResult(null);
                } catch {}
            };

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 glass-overlay animate-fade-in" onClick={onClose}>
                    <div className="bg-white w-full max-w-lg rounded-3xl shadow-2xl animate-slide-up flex flex-col max-h-[85vh]" onClick={e => e.stopPropagation()}>
                        <div className="px-6 pt-6 pb-4 border-b border-gray-50 flex items-center justify-between flex-shrink-0">
                            <div>
                                <p className="text-[10px] font-black tracking-widest text-gray-400 uppercase mb-1">✨ Gemini AI</p>
                                <h2 className="font-black text-base text-gray-800">{title}</h2>
                            </div>
                            <button onClick={onClose} className="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center font-bold text-gray-500 hover:bg-gray-200 flex-shrink-0 ml-4">×</button>

                        <div className="flex-1 overflow-y-auto hide-scrollbar px-6 py-5 space-y-4">
                            <button
                                onClick={generate}
                                disabled={loading}
                                className="w-full py-4 rounded-2xl font-black text-sm flex items-center justify-center gap-2 transition-all disabled:opacity-60"
                                style={{ background: loading ? '#f1f5f9' : '#1e293b', color: loading ? '#94a3b8' : '#fff' }}>
                                {loading ? (
                                    <><span className="animate-spin inline-block">⟳</span> 生成中，请稍候…</>
                                ) : (
                                    <><span>✨</span> {result ? '重新生成' : '生成报告'}</>
                                )}
                            </button>

                            {loading && (
                                <div className="space-y-3 animate-fade-in">
                                    {[80, 60, 90, 50, 70].map((w, i) => (
                                        <div key={i} className="h-3 bg-gray-100 rounded-full animate-pulse" style={{ width: `${w}%` }} />
                                    ))}
                                </div>
                            )}

                            {error && (
                                <div className="bg-red-50 border border-red-100 rounded-2xl p-4 text-sm font-bold text-red-600">
                                    {error}
                                </div>
                            )}

                            {result && (
                                <div className="bg-amber-50 border border-amber-100 rounded-2xl p-5 space-y-3 animate-fade-in">
                                    <p className="text-sm leading-relaxed text-gray-700 whitespace-pre-wrap">{result}</p>
                                    <button onClick={saveReport}
                                        className="w-full py-2.5 rounded-xl font-bold text-sm text-white flex items-center justify-center gap-2"
                                        style={{ background: '#22c55e' }}>
                                        💾 保存到历史
                                    </button>
                                </div>
                            )}

                            <div>
                                <h3 className="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-3">历史报告</h3>
                                {history.length === 0 ? (
                                    <div className="flex flex-col items-center justify-center py-8 text-center">
                                        <span className="text-3xl mb-3">📭</span>
                                        <p className="text-sm font-bold text-gray-400">暂无历史报告</p>
                                        <p className="text-xs text-gray-300 mt-1">点击上方「生成报告」创建第一份</p>
                                    </div>
                                ) : (
                                    <div className="space-y-2">
                                        {history.map((r, i) => (
                                            <div key={i} className="border border-gray-100 rounded-2xl overflow-hidden">
                                                <button
                                                    onClick={() => setExpandedIdx(expandedIdx === i ? null : i)}
                                                    className="w-full px-4 py-3 flex items-center justify-between text-left hover:bg-gray-50 transition-colors">
                                                    <div>
                                                        <p className="text-xs font-black text-gray-700">{r.period}</p>
                                                        <p className="text-[10px] text-gray-400">{new Date(r.createdAt).toLocaleDateString('zh-CN')}</p>
                                                    </div>
                                                    <span className="text-gray-400 text-xs">{expandedIdx === i ? '▲' : '▼'}</span>
                                                </button>
                                                {expandedIdx === i && (
                                                    <div className="px-4 pb-4 pt-2 border-t border-gray-50">
                                                        <p className="text-xs leading-relaxed text-gray-600 whitespace-pre-wrap">{r.content}</p>
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 分类筛选器条
        const FilterBar = ({ activeFilter, setActiveFilter, right }) => (
            <div className="flex items-center gap-2 py-2 min-w-0">
                <div className="flex gap-2 overflow-x-auto hide-scrollbar flex-1 min-w-0">
                    <button
                        onClick={() => setActiveFilter('all')}
                        className={`px-4 py-1.5 rounded-full text-sm font-bold transition-all whitespace-nowrap ${activeFilter === 'all' ? 'bg-os-text text-white shadow-md' : 'bg-white text-gray-400 hover:bg-gray-50'}`}
                    >
                        全部
                    </button>
                    {CATEGORIES.map(cat => (
                        <button
                            key={cat.id} onClick={() => setActiveFilter(cat.id)}
                            className={`px-4 py-1.5 rounded-full text-sm font-bold transition-all whitespace-nowrap flex items-center gap-1 ${activeFilter === cat.id ? `${cat.color} text-white shadow-md` : 'bg-white text-gray-400 hover:bg-gray-50'}`}
                        >
                            <span>{cat.icon}</span> {cat.label}
                        </button>
                    ))}
                </div>
                {right && <div className="flex items-center gap-2 flex-shrink-0">{right}</div>}
            </div>
        );

        // 核心组件：周历 (交互式)
        const WeeklyWidget = ({ events, onOpenReport }) => {
            const days = ['日', '一', '二', '三', '四', '五', '六'];
            const [weekOffset, setWeekOffset] = useState(0);
            const [selectedDayIdx, setSelectedDayIdx] = useState(() => {
                const tokyoStr = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Tokyo' }).format(new Date());
                return new Date(tokyoStr + 'T12:00:00').getDay();
            });
            const [newTodoText, setNewTodoText] = useState('');
            const [editingDue, setEditingDue] = useState(null);
            const [showAiModal, setShowAiModal] = useState(false);
            const [aiLoading, setAiLoading] = useState(false);
            const [aiResult, setAiResult] = useState(null);
            const [aiError, setAiError] = useState(null);

            // 计算偏移周的7天日期
            const OFFSET_WEEK_DATES = (() => {
                const d = new Date();
                d.setDate(d.getDate() + weekOffset * 7);
                return getWeekDates(d);
            })();
            const weekKey = getWeek(new Date(OFFSET_WEEK_DATES[1] || TODAY_STR));
            const weekLabel = weekOffset === 0 ? '本周 Todo'
                : `${OFFSET_WEEK_DATES[0].slice(5).replace('-', '/')}—${OFFSET_WEEK_DATES[6].slice(5).replace('-', '/')}`;

            const [weekTodos, setWeekTodos] = useState(() => {
                try {
                    const stored = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}');
                    return stored.allTodos?.[getWeek(new Date(TODAY_STR))] || [];
                } catch { return []; }
            });

            // 切换周时重新加载对应周的 todos
            useEffect(() => {
                try {
                    const stored = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}');
                    setWeekTodos(stored.allTodos?.[weekKey] || []);
                } catch {}
            }, [weekKey]);

            // 云同步完成后重新从 localStorage 读取最新 todos
            useEffect(() => {
                const handler = () => {
                    try {
                        const stored = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}');
                        setWeekTodos(stored.allTodos?.[weekKey] || []);
                    } catch {}
                };
                window.addEventListener('lifeos:synced', handler);
                return () => window.removeEventListener('lifeos:synced', handler);
            }, [weekKey]);

            const historicalTodos = (getFinanceStorage().urgentTodos || []).map(t => ({ ...t, historical: true }));

            const saveTodos = (todos) => {
                setWeekTodos(todos);
                haptic(40);
                try {
                    const stored = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}');
                    if (!stored.allTodos) stored.allTodos = {};
                    stored.allTodos[weekKey] = todos;
                    localStorage.setItem('visualLifeOS_data', JSON.stringify(stored));
                } catch {}
                syncToCloud();
            };

            const selectedDate = OFFSET_WEEK_DATES[selectedDayIdx];
            const dayEvents = events.filter(e => e.date === selectedDate);
            const dayNewTodos = weekTodos.filter(t => (t.dueDate || t.date) === selectedDate);
            const dayHistTodos = historicalTodos.filter(t => (t.dueDate || t.date) === selectedDate);
            const allDayTodos = [...dayHistTodos, ...dayNewTodos];

            const addTodo = () => {
                if (!newTodoText.trim()) return;
                saveTodos([...weekTodos, { id: Date.now(), title: newTodoText.trim(), date: selectedDate, dueDate: selectedDate, done: false }]);
                setNewTodoText('');
            };
            const toggleTodo = (id) => saveTodos(weekTodos.map(t => t.id === id ? { ...t, done: !t.done } : t));
            const deleteTodo = (id) => saveTodos(weekTodos.filter(t => t.id !== id));
            const postponeTodo = (todo, currentDate) => {
                const stored = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}');
                if (!stored.allTodos) stored.allTodos = {};

                // 从当前周数组删除
                stored.allTodos[weekKey] = (stored.allTodos[weekKey] || []).filter(t => t.id !== todo.id);

                // 计算第二天日期
                const nextDate = new Date(currentDate + 'T00:00:00');
                nextDate.setDate(nextDate.getDate() + 1);
                const nextDateStr = `${nextDate.getFullYear()}-${String(nextDate.getMonth()+1).padStart(2,'0')}-${String(nextDate.getDate()).padStart(2,'0')}`;
                const nextWeekKey = getWeek(nextDate);

                // 加入目标周数组（跨周也正确）
                stored.allTodos[nextWeekKey] = [...(stored.allTodos[nextWeekKey] || []), { ...todo, date: nextDateStr, dueDate: nextDateStr }];

                localStorage.setItem('visualLifeOS_data', JSON.stringify(stored));
                syncToCloud();

                // 刷新当前周的显示
                setWeekTodos(stored.allTodos[weekKey] || []);

                // 自动跳转到下一天
                const nextIdx = OFFSET_WEEK_DATES.indexOf(nextDateStr);
                if (nextIdx >= 0) {
                    setSelectedDayIdx(nextIdx);
                } else {
                    // 下一天在下一周，切换到下一周
                    setWeekOffset(wo => wo + 1);
                    setSelectedDayIdx(0);
                }
            };
            const changeDueDate = (id, newDate) => {
                if (newDate) saveTodos(weekTodos.map(t => t.id === id ? { ...t, dueDate: newDate } : t));
                setEditingDue(null);
            };

            const callGeminiAI = () => {
                const key = localStorage.getItem('lifeos_gemini_key');
                if (!key) { setAiError('请先在设置里填入 Gemini API Key'); setAiResult(null); setShowAiModal(true); return; }
                setAiError(null); setAiResult(null); setAiLoading(true); setShowAiModal(true);
                const todos = weekTodos.map(t => ({ title: t.title, done: t.done, date: t.dueDate || t.date }));
                fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent?key=${key}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: `根据我本周的待办和完成情况，帮我建议3个下周应该做的事情，简洁一点。以JSON数组格式返回，每项只有"title"字段，例如[{"title":"..."},{"title":"..."},{"title":"..."}]。\n本周待办：${JSON.stringify(todos)}` }] }] })
                }).then(r => r.json()).then(d => {
                    const text = d.candidates?.[0]?.content?.parts?.[0]?.text || '';
                    const match = text.match(/\[[\s\S]*?\]/);
                    try { setAiResult(JSON.parse(match[0])); } catch { setAiResult([{ title: text.trim() }]); }
                }).catch(e => setAiError(e.message)).finally(() => setAiLoading(false));
            };

            return (
                <div className="bg-white p-5 rounded-os-xl shadow-sm h-full flex flex-col gap-3 relative group overflow-hidden">
                    {/* ✨ Gemini AI 建议按钮 */}
                    <button onClick={callGeminiAI} className="absolute top-4 right-4 text-xl opacity-40 hover:opacity-100 hover:scale-110 transition-all" title="AI 生成下周建议">✨</button>

                    {/* AI 建议弹窗（覆盖在 widget 上） */}
                    {showAiModal && (
                        <div className="absolute inset-0 z-20 bg-white/96 rounded-os-xl p-4 flex flex-col gap-3 animate-fade-in">
                            <div className="flex items-center justify-between flex-shrink-0">
                                <span className="text-xs font-black text-gray-700">✨ AI 下周建议</span>
                                <button onClick={() => setShowAiModal(false)} className="w-6 h-6 bg-gray-100 rounded-full text-sm font-bold text-gray-500 flex items-center justify-center">×</button>
                            </div>
                            {aiLoading && <p className="text-xs text-gray-400 text-center py-4 animate-pulse">生成中…</p>}
                            {aiError && <p className="text-xs text-red-400 text-center py-2">{aiError}</p>}
                            {aiResult && (
                                <div className="flex-1 overflow-y-auto space-y-2">
                                    {aiResult.map((item, i) => (
                                        <div key={i} className="flex items-center gap-2 bg-gray-50 rounded-xl px-3 py-2">
                                            <span className="flex-1 text-xs font-bold text-gray-700 min-w-0">{item.title}</span>
                                            <button onClick={() => {
                                                const nextDate = OFFSET_WEEK_DATES[1] || TODAY_STR;
                                                saveTodos([...weekTodos, { id: Date.now() + i, title: item.title, date: nextDate, dueDate: nextDate, done: false }]);
                                                setShowAiModal(false);
                                            }} className="text-[10px] font-black px-2 py-1 bg-os-text text-white rounded-lg flex-shrink-0 hover:opacity-80 transition-opacity">+添加</button>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}

                    {/* 标题 + 前后周导航 */}
                    <div className="flex items-center gap-1 flex-shrink-0 pr-7">
                        <button onClick={() => { setWeekOffset(o => o - 1); const ts = new Intl.DateTimeFormat('sv-SE', {timeZone:'Asia/Tokyo'}).format(new Date()); setSelectedDayIdx(new Date(ts+'T12:00:00').getDay()); }}
                            className="w-5 h-5 flex items-center justify-center text-gray-400 hover:text-gray-600 font-black text-sm flex-shrink-0 transition-colors">←</button>
                        <h3 className="font-black text-xs text-gray-400 uppercase tracking-widest flex-1 text-center truncate">{weekLabel}</h3>
                        <button onClick={() => { setWeekOffset(o => o + 1); const ts = new Intl.DateTimeFormat('sv-SE', {timeZone:'Asia/Tokyo'}).format(new Date()); setSelectedDayIdx(new Date(ts+'T12:00:00').getDay()); }}
                            className="w-5 h-5 flex items-center justify-center text-gray-400 hover:text-gray-600 font-black text-sm flex-shrink-0 transition-colors">→</button>
                    </div>

                    {/* 星期选择器 */}
                    <div className="flex justify-between flex-shrink-0">
                        {OFFSET_WEEK_DATES.map((dStr, idx) => {
                            const isSelected = selectedDayIdx === idx;
                            const hasE = events.some(e => e.date === dStr);
                            const hasT = weekTodos.some(t => (t.dueDate || t.date) === dStr && !t.done) || historicalTodos.some(t => (t.dueDate || t.date) === dStr && !t.done);
                            const dayLabel = ['日','一','二','三','四','五','六'][new Date(dStr + 'T12:00:00').getDay()];
                            return (
                                <div key={dStr} onClick={() => setSelectedDayIdx(idx)} className="flex flex-col items-center gap-1 cursor-pointer">
                                    <div className="flex gap-0.5 h-1.5">
                                        {hasE && <span className="w-1.5 h-1.5 rounded-full bg-os-purple"></span>}
                                        {hasT && <span className="w-1.5 h-1.5 rounded-full bg-orange-400"></span>}
                                    </div>
                                    <div className={`w-9 h-10 rounded-xl flex flex-col items-center justify-center gap-0.5 transition-all ${isSelected ? 'bg-os-text text-white shadow-md' : 'bg-gray-50 text-gray-400 hover:bg-gray-100'}`}>
                                        <span className="text-[9px] font-bold leading-none">{dayLabel}</span>
                                        <span className="text-[11px] font-black leading-none">{dStr.slice(8)}</span>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {/* Todo 列表 */}
                    <div className="flex-1 overflow-y-auto hide-scrollbar space-y-1.5">
                        {allDayTodos.length === 0 && dayEvents.length === 0 && (
                            <p className="text-xs text-gray-400 italic py-2">这一天还没有记录...</p>
                        )}
                        {dayEvents.map((item, idx) => (
                            <div key={`e-${idx}`} className="flex items-center gap-2 text-xs py-1">
                                <span>{CATEGORIES.find(c => c.id === item.catId)?.icon}</span>
                                <span className="truncate flex-1 font-bold text-gray-700">{item.title}</span>
                            </div>
                        ))}
                        {allDayTodos.map(t => {
                            const due = t.dueDate || t.date;
                            const isOverdue = !t.done && due < TODAY_STR;
                            return (
                                <div key={t.id} className="flex items-center gap-1.5 text-xs py-1 group/item">
                                    <button onClick={() => !t.historical && toggleTodo(t.id)}
                                        className={`w-4 h-4 rounded border flex-shrink-0 flex items-center justify-center text-[9px] transition-colors
                                            ${t.done ? 'bg-green-400 border-green-400 text-white' : 'border-gray-300 hover:border-green-300'}`}>
                                        {t.done && '✓'}
                                    </button>
                                    <span className={`flex-1 min-w-0 truncate ${t.done ? 'line-through text-gray-400' : 'text-gray-700 font-bold'}`}>{t.title}</span>
                                    {!t.historical && !t.done && (
                                        <>
                                            {editingDue === t.id ? (
                                                <input type="date" autoFocus defaultValue={due}
                                                    className="text-[9px] bg-gray-50 rounded border border-gray-200 outline-none flex-shrink-0"
                                                    style={{ width: '100px', padding: '1px 3px', colorScheme: 'light' }}
                                                    onBlur={e => changeDueDate(t.id, e.target.value)}
                                                    onKeyDown={e => { if (e.key === 'Enter') changeDueDate(t.id, e.target.value); if (e.key === 'Escape') setEditingDue(null); }} />
                                            ) : (
                                                <button onClick={() => setEditingDue(t.id)}
                                                    className={`text-[9px] font-bold flex-shrink-0 px-1 py-0.5 rounded leading-none transition-colors ${isOverdue ? 'bg-red-50 text-red-500' : 'text-gray-300 hover:text-gray-500'}`}>
                                                    {due.slice(5)}
                                                </button>
                                            )}
                                            <button onClick={() => postponeTodo(t, selectedDate)}
                                                className="text-[9px] font-black text-gray-300 hover:text-blue-400 flex-shrink-0 opacity-0 group-hover/item:opacity-100 transition-all leading-none whitespace-nowrap">
                                                →+1
                                            </button>
                                        </>
                                    )}
                                    {!t.historical && (
                                        <button onClick={() => deleteTodo(t.id)}
                                            className="text-gray-300 hover:text-red-400 transition-all text-sm leading-none flex-shrink-0 opacity-0 group-hover/item:opacity-100">×</button>
                                    )}
                                </div>
                            );
                        })}
                    </div>

                    {/* 添加输入框 */}
                    <div className="flex gap-2 flex-shrink-0 pt-1 border-t border-gray-50">
                        <input
                            value={newTodoText}
                            onChange={e => setNewTodoText(e.target.value)}
                            onKeyDown={e => e.key === 'Enter' && addTodo()}
                            placeholder="添加待办…"
                            className="flex-1 text-xs bg-gray-50 rounded-xl px-3 py-2 outline-none border border-transparent focus:border-gray-200 transition-colors placeholder-gray-300 font-medium"
                        />
                        <button onClick={addTodo}
                            className="w-8 h-8 rounded-xl bg-os-text text-white text-lg font-black flex items-center justify-center hover:opacity-80 transition-opacity flex-shrink-0">
                            +
                        </button>
                    </div>
                </div>
            );
        };

        const ShoppingWidget = () => {
            const [activeTab, setActiveTab] = useState('life');
            const [newText, setNewText] = useState('');

            const [items, setItems] = useState(() => {
                try {
                    const stored = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}');
                    const wl = stored.wishlist || [];
                    return wl.map(i => {
                        let tab = i.tab || 'small';
                        if (tab === 'need') tab = 'life';
                        if (tab === 'want') tab = 'small';
                        return { ...i, tab, done: i.purchased || false };
                    });
                } catch { return []; }
            });

            const saveItems = (next) => {
                setItems(next);
                try {
                    const stored = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}');
                    stored.wishlist = next.map(i => ({ ...i, purchased: i.done }));
                    localStorage.setItem('visualLifeOS_data', JSON.stringify(stored));
                } catch {}
                syncToCloud();
            };

            const addItem = () => {
                if (!newText.trim()) return;
                saveItems([...items, { id: Date.now(), name: newText.trim(), price: '', currency: 'JPY', category: '', purchased: false, done: false, tab: activeTab }]);
                setNewText('');
            };
            const toggleItem = (id) => saveItems(items.map(i => i.id === id ? { ...i, done: !i.done, purchased: !i.done } : i));
            const deleteItem = (id) => saveItems(items.filter(i => i.id !== id));

            const [newPrice, setNewPrice] = useState('');
            const [newAnimeType, setNewAnimeType] = useState('现货');
            const [newPlatform, setNewPlatform] = useState('');
            const [newPaid, setNewPaid] = useState(false);

            const rawTabItems = items.filter(i => i.tab === activeTab);
            // done items go to bottom
            const tabItems = [...rawTabItems.filter(i => !i.done), ...rawTabItems.filter(i => i.done)];
            const tabCfg = {
                life:   { label: '必须买',  color: 'text-green-700',  activeBg: 'bg-green-500',   dot: 'bg-green-400',   check: 'bg-green-400 border-green-400'   },
                big:    { label: '大件',    color: 'text-blue-700',   activeBg: 'bg-blue-500',    dot: 'bg-blue-400',    check: 'bg-blue-400 border-blue-400'     },
                small:  { label: '小东西',  color: 'text-purple-700', activeBg: 'bg-purple-500',  dot: 'bg-purple-400',  check: 'bg-purple-400 border-purple-400' },
                food:   { label: '吃的',    color: 'text-orange-700', activeBg: 'bg-orange-500',  dot: 'bg-orange-400',  check: 'bg-orange-400 border-orange-400' },
                anime:  { label: '二次元',  color: 'text-pink-700',   activeBg: 'bg-pink-500',    dot: 'bg-pink-400',    check: 'bg-pink-400 border-pink-400'     },
            };
            const tabCounts = Object.fromEntries(Object.keys(tabCfg).map(k => [k, items.filter(i => i.tab === k && !i.done).length]));
            const cfg = tabCfg[activeTab];

            const addItemWithPrice = () => {

                                </button>
                                <div><label className={labelCls}>备注</label><input value={oNote} onChange={e=>setONote(e.target.value)} placeholder="备注（可选）" className={inputCls} /></div>
                            </>)}
                            {tab === 'goods' && (<>
                                <div><label className={labelCls}>谷子名称 *</label><input value={gName} onChange={e=>setGName(e.target.value)} placeholder="谷子名称" className={inputCls} autoFocus /></div>
                                <div><label className={labelCls}>所属作品</label><input value={gWork} onChange={e=>setGWork(e.target.value)} placeholder="作品名" className={inputCls} /></div>
                                <div className="grid grid-cols-2 gap-2">
                                    <div><label className={labelCls}>类型</label>
                                        <select value={gType} onChange={e=>setGType(e.target.value)} className={inputCls}>
                                            {goodsTypes.map(t=><option key={t}>{t}</option>)}
                                        </select>
                                    </div>
                                    <div><label className={labelCls}>数量</label><input value={gQty} onChange={e=>setGQty(e.target.value)} type="number" min="1" className={inputCls} /></div>
                                </div>
                                <div className="grid grid-cols-2 gap-2">
                                    <div><label className={labelCls}>购买年份</label><input value={gYear} onChange={e=>setGYear(e.target.value)} placeholder={thisYear} className={inputCls} /></div>
                                    <div><label className={labelCls}>封面图URL</label><input value={gCover} onChange={e=>setGCover(e.target.value)} placeholder="图片链接" className={inputCls} /></div>
                                </div>
                                <div><label className={labelCls}>备注</label><input value={gNote} onChange={e=>setGNote(e.target.value)} placeholder="备注（可选）" className={inputCls} /></div>
                            </>)}
                            {tab === 'displays' && (<>
                                <div><label className={labelCls}>谷美名称 *</label><input value={dName} onChange={e=>setDName(e.target.value)} placeholder="谷美名称" className={inputCls} autoFocus /></div>
                                <div className="grid grid-cols-2 gap-2">
                                    <div><label className={labelCls}>类型</label>
                                        <select value={dType} onChange={e=>setDType(e.target.value)} className={inputCls}>
                                            {displayTypes.map(t=><option key={t}>{t}</option>)}
                                        </select>
                                    </div>
                                    <div><label className={labelCls}>容量</label><input value={dCapacity} onChange={e=>setDCapacity(e.target.value)} placeholder="如：56枚" className={inputCls} /></div>
                                </div>
                                <div><label className={labelCls}>购买年份</label><input value={dYear} onChange={e=>setDYear(e.target.value)} placeholder={thisYear} className={inputCls} /></div>
                                <div>
                                    <label className={labelCls}>关联谷子（可多选）</label>
                                    <div className="max-h-32 overflow-y-auto bg-gray-50 rounded-xl p-2 space-y-1">
                                        {goods.length === 0 && <p className="text-[10px] text-gray-400 text-center py-2">还没有谷子记录</p>}
                                        {goods.map(g => (
                                            <button key={g.id} onClick={()=>toggleGoodsLink(g.id)}
                                                className={`w-full flex items-center gap-2 px-2 py-1.5 rounded-lg text-left transition-colors ${dGoodsIds.includes(g.id)?'bg-pink-100 text-pink-700':'hover:bg-white text-gray-600'}`}>
                                                <span className={`w-4 h-4 rounded border-2 flex-shrink-0 flex items-center justify-center text-[8px] font-black ${dGoodsIds.includes(g.id)?'bg-pink-500 border-pink-500 text-white':'border-gray-300'}`}>
                                                    {dGoodsIds.includes(g.id)?'✓':''}
                                                </span>
                                                <span className="text-xs font-bold truncate">{g.name}</span>
                                                {g.work && <span className="text-[9px] text-gray-400 truncate">《{g.work}》</span>}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div><label className={labelCls}>备注</label><input value={dNote} onChange={e=>setDNote(e.target.value)} placeholder="备注（可选）" className={inputCls} /></div>
                            </>)}
                        </div>
                        <button onClick={handleSave}
                            className="w-full mt-4 py-3 rounded-2xl text-white font-black text-sm hover:opacity-90 transition-opacity"
                            style={{ background: '#ec4899' }}>
                            {editItem ? '保存修改' : '确认添加'}
                        </button>
                    </div>
                </div>
            );
        };

        const AnimeView = () => {
            const [tab, setTab] = React.useState('orders');
            const [orders, setOrders] = React.useState(() => {
                try { return JSON.parse(localStorage.getItem('visualLifeOS_data')||'{}').animeOrders || []; } catch { return []; }
            });
            const [goods, setGoods] = React.useState(() => {
                try { return JSON.parse(localStorage.getItem('visualLifeOS_data')||'{}').animeGoods || []; } catch { return []; }
            });
            const [displays, setDisplays] = React.useState(() => {
                try { return JSON.parse(localStorage.getItem('visualLifeOS_data')||'{}').animeDisplay || []; } catch { return []; }
            });
            const saveOrders = (next) => {
                setOrders(next);
                try { const d = JSON.parse(localStorage.getItem('visualLifeOS_data')||'{}'); d.animeOrders = next; localStorage.setItem('visualLifeOS_data', JSON.stringify(d)); } catch {}
                syncToCloud();
            };
            const saveGoods = (next) => {
                setGoods(next);
                try { const d = JSON.parse(localStorage.getItem('visualLifeOS_data')||'{}'); d.animeGoods = next; localStorage.setItem('visualLifeOS_data', JSON.stringify(d)); } catch {}
                syncToCloud();
            };
            const saveDisplays = (next) => {
                setDisplays(next);
                try { const d = JSON.parse(localStorage.getItem('visualLifeOS_data')||'{}'); d.animeDisplay = next; localStorage.setItem('visualLifeOS_data', JSON.stringify(d)); } catch {}
                syncToCloud();
            };
            const thisYear = new Date().getFullYear().toString();
            const [filterYear, setFilterYear] = React.useState('全部');
            const [showAddModal, setShowAddModal] = React.useState(false);
            const [editItem, setEditItem] = React.useState(null);
            const allYears = ['全部', ...Array.from(new Set([
                ...orders.map(o => o.year),
                ...goods.map(g => g.year),
            ].filter(Boolean))).sort((a,b) => b-a)];
            const filteredOrders = orders.filter(o => filterYear === '全部' || o.year === filterYear);
            const filteredGoods = goods.filter(g => filterYear === '全部' || g.year === filterYear);
            const totalPaid = filteredOrders.filter(o => o.paid).reduce((s,o) => s + (parseFloat(o.price)||0) * (o.currency==='RMB'?15:1), 0);
            const totalUnpaid = filteredOrders.filter(o => !o.paid).reduce((s,o) => s + (parseFloat(o.price)||0) * (o.currency==='RMB'?15:1), 0);
            const GOODS_TYPES = ['徽章','立牌','亚克力','手办','抱枕','卡片','色纸','其他'];
            const DISPLAY_TYPES = ['谷子袋','展示架','收纳盒','相册','展示盒','其他'];
            const PLATFORMS = ['Animate','Melonbooks','Toranoana','Gamers','淘宝','微店','Yahoo拍卖','二手'];
            return (
                <div className="animate-fade-in">
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
                        {[
                            { label: '已付总额(JPY)', value: `¥${Math.round(totalPaid).toLocaleString()}`, color: '#ec4899', sub: filterYear === '全部' ? '全部时间' : filterYear+'年' },
                            { label: '待付款', value: `¥${Math.round(totalUnpaid).toLocaleString()}`, color: orders.filter(o=>!o.paid).length > 0 ? '#f97316' : '#94a3b8', sub: `${orders.filter(o=>!o.paid).length}笔订单` },
                            { label: '谷子总数', value: goods.reduce((s,g)=>s+(parseInt(g.quantity)||1),0), color: '#8b5cf6', sub: `${goods.length}种` },
                            { label: '预售中', value: orders.filter(o=>o.type==='预售'&&!o.paid).length, color: '#3b82f6', sub: '等待发货' },
                        ].map(s => (
                            <div key={s.label} className="bg-white rounded-2xl p-4 shadow-sm border border-gray-50">
                                <p className="text-2xl font-black" style={{ color: s.color }}>{s.value}</p>
                                <p className="text-xs font-black text-gray-500 mt-0.5">{s.label}</p>
                                <p className="text-[10px] text-gray-400">{s.sub}</p>
                            </div>
                        ))}
                    </div>
                    <div className="flex items-center gap-3 mb-4 flex-wrap">
                        <div className="flex gap-1 bg-white rounded-2xl p-1 shadow-sm border border-gray-100">
                            {[['orders','📦 订单'],['goods','🌸 谷子'],['displays','🎒 谷美']].map(([key,label]) => (
                                <button key={key} onClick={() => setTab(key)}
                                    className={`px-3 py-1.5 rounded-xl text-xs font-black transition-all ${tab===key ? 'bg-pink-500 text-white shadow-sm' : 'text-gray-400 hover:text-gray-600'}`}>
                                    {label}
                                </button>
                            ))}
                        </div>
                        <select value={filterYear} onChange={e => setFilterYear(e.target.value)}
                            className="ml-auto text-xs font-bold bg-white border border-gray-100 rounded-xl px-3 py-2 outline-none shadow-sm">
                            {allYears.map(y => <option key={y}>{y}</option>)}
                        </select>
                        <button onClick={() => { setEditItem(null); setShowAddModal(true); }}
                            className="w-9 h-9 rounded-xl text-white text-xl font-black flex items-center justify-center flex-shrink-0 hover:opacity-90"
                            style={{ background: '#ec4899' }}>+</button>
                    </div>
                    {tab === 'orders' && (
                        <div className="bg-white rounded-2xl shadow-sm border border-gray-50 overflow-hidden">
                            {filteredOrders.length === 0 && (
                                <div className="py-16 text-center">
                                    <p className="text-3xl mb-2">📦</p>
                                    <p className="text-sm font-bold text-gray-400">还没有订单记录</p>
                                </div>
                            )}
                            {[...filteredOrders].sort((a,b)=>b.id-a.id).map(o => (
                                <div key={o.id} className="flex items-center gap-3 px-4 py-3 border-b border-gray-50 last:border-0 hover:bg-gray-50 transition-colors group">
                                    <div className="flex flex-col gap-1 flex-shrink-0">
                                        <span className={`text-[9px] font-black px-1.5 py-0.5 rounded-full text-center ${o.type==='预售'?'bg-orange-100 text-orange-600':'bg-green-100 text-green-600'}`}>{o.type}</span>
                                        <button onClick={() => saveOrders(orders.map(x => x.id===o.id ? {...x, paid:!x.paid} : x))}
                                            className={`text-[9px] font-black px-1.5 py-0.5 rounded-full text-center transition-colors ${o.paid?'bg-green-100 text-green-600':'bg-red-50 text-red-400 hover:bg-red-100'}`}>
                                            {o.paid?'✓已付':'✗未付'}
                                        </button>
                                    </div>
                                    <div className="flex-1 min-w-0">
                                        <p className="text-sm font-black text-gray-800 truncate">{o.name}</p>
                                        <p className="text-[10px] text-gray-400 font-medium">{o.work && `《${o.work}》`}{o.platform && ` · ${o.platform}`}{o.year && ` · ${o.year}年`}</p>
                                    </div>
                                    <div className="flex-shrink-0 text-right">
                                        <p className="text-sm font-black text-gray-700">¥{o.price}<span className="text-[9px] text-gray-400 ml-0.5">{o.currency}</span></p>
                                    </div>
                                    <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity flex-shrink-0">
                                        <button onClick={() => { setEditItem(o); setShowAddModal(true); }}
                                            className="text-[10px] font-black px-2 py-1 rounded-lg bg-gray-100 text-gray-500 hover:bg-gray-200">编辑</button>
                                        <button onClick={() => { if(window.confirm(`删除「${o.name}」？`)) saveOrders(orders.filter(x=>x.id!==o.id)); }}
                                            className="text-[10px] font-black px-2 py-1 rounded-lg bg-red-50 text-red-400 hover:bg-red-100">删除</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                    {tab === 'goods' && (
                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                            {filteredGoods.length === 0 && (
                                <div className="col-span-4 py-16 text-center bg-white rounded-2xl">
                                    <p className="text-3xl mb-2">🌸</p>
                                    <p className="text-sm font-bold text-gray-400">还没有谷子记录</p>
                                </div>
                            )}
                            {filteredGoods.map(g => (
                                <div key={g.id} className="bg-white rounded-2xl p-3 shadow-sm border border-gray-50 group relative hover:shadow-md transition-shadow">
                                    {g.coverUrl && <img src={g.coverUrl} className="w-full h-24 object-cover rounded-xl mb-2" onError={e=>e.target.style.display='none'} alt="" />}
                                    {!g.coverUrl && <div className="w-full h-16 bg-pink-50 rounded-xl mb-2 flex items-center justify-center text-2xl">🌸</div>}
                                    <p className="text-xs font-black text-gray-800 truncate">{g.name}</p>
                                    {g.work && <p className="text-[9px] text-gray-400 font-medium truncate">《{g.work}》</p>}
                                    <div className="flex items-center justify-between mt-1">
                                        <span className="text-[8px] font-black px-1.5 py-0.5 rounded-full bg-pink-100 text-pink-600">{g.type||'其他'}</span>
                                        <span className="text-[9px] font-bold text-gray-500">×{g.quantity||1}</span>
                                    </div>
                                    <div className="flex gap-1 absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                        <button onClick={() => { setEditItem(g); setShowAddModal(true); }}
                                            className="w-6 h-6 rounded-lg bg-white shadow text-gray-400 text-xs flex items-center justify-center hover:bg-gray-100">✏️</button>
                                        <button onClick={() => { if(window.confirm(`删除「${g.name}」？`)) saveGoods(goods.filter(x=>x.id!==g.id)); }}
                                            className="w-6 h-6 rounded-lg bg-white shadow text-red-400 text-xs flex items-center justify-center hover:bg-red-50">×</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                    {tab === 'displays' && (
                        <div className="flex flex-col gap-3">
                            {displays.length === 0 && (
                                <div className="py-16 text-center bg-white rounded-2xl">
                                    <p className="text-3xl mb-2">🎒</p>
                                    <p className="text-sm font-bold text-gray-400">还没有谷美记录</p>
                                </div>
                            )}
                            {displays.map(disp => {
                                const linkedGoods = goods.filter(g => disp.goodsIds?.includes(g.id));
                                return (
                                    <div key={disp.id} className="bg-white rounded-2xl p-4 shadow-sm border border-gray-50 group hover:shadow-md transition-shadow">
                                        <div className="flex items-start justify-between gap-3 mb-3">
                                            <div className="flex-1 min-w-0">
                                                <div className="flex items-center gap-2 mb-1">
                                                    <span className="text-[9px] font-black px-1.5 py-0.5 rounded-full bg-purple-100 text-purple-600">{disp.type||'其他'}</span>
                                                    {disp.capacity && <span className="text-[9px] text-gray-400">容量 {disp.capacity}</span>}
                                                    {disp.year && <span className="text-[9px] text-gray-400">{disp.year}年</span>}
                                                </div>
                                                <p className="font-black text-sm text-gray-800">{disp.name}</p>
                                                {disp.note && <p className="text-[10px] text-gray-400 mt-0.5">{disp.note}</p>}
                                            </div>
                                            <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity flex-shrink-0">
                                                <button onClick={() => { setEditItem(disp); setShowAddModal(true); }}
                                                    className="text-[10px] font-black px-2 py-1 rounded-lg bg-gray-100 text-gray-500 hover:bg-gray-200">编辑</button>
                                                <button onClick={() => { if(window.confirm(`删除「${disp.name}」？`)) saveDisplays(displays.filter(x=>x.id!==disp.id)); }}
                                                    className="text-[10px] font-black px-2 py-1 rounded-lg bg-red-50 text-red-400 hover:bg-red-100">删除</button>
                                            </div>
                                        </div>
                                        {linkedGoods.length > 0 && (
                                            <div>
                                                <p className="text-[9px] font-black text-gray-400 mb-1.5">📌 已装入谷子</p>
                                                <div className="flex flex-wrap gap-1.5">
                                                    {linkedGoods.map(g => (
                                                        <span key={g.id} className="text-[9px] font-bold px-2 py-0.5 rounded-full bg-pink-50 text-pink-600 border border-pink-100">{g.name}</span>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                        {linkedGoods.length === 0 && (
                                            <p className="text-[9px] text-gray-300 font-medium">暂无关联谷子，编辑可添加</p>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    )}
                    {showAddModal && (
                        <AnimeAddModal
                            tab={tab}
                            editItem={editItem}
                            goods={goods}
                            goodsTypes={GOODS_TYPES}
                            displayTypes={DISPLAY_TYPES}
                            platforms={PLATFORMS}
                            onClose={() => { setShowAddModal(false); setEditItem(null); }}
                            onSave={(item) => {
                                if (tab === 'orders') saveOrders(editItem ? orders.map(x=>x.id===item.id?item:x) : [item,...orders]);
                                if (tab === 'goods') saveGoods(editItem ? goods.map(x=>x.id===item.id?item:x) : [item,...goods]);
                                if (tab === 'displays') saveDisplays(editItem ? displays.map(x=>x.id===item.id?item:x) : [item,...displays]);
                                setShowAddModal(false); setEditItem(null);
                            }}
                        />
                    )}
                </div>
            );
        };

        const HealthWidget = () => {
            const todayStr = (() => { const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; })();
            const [heatLevel, setHeatLevel] = useState(() => {
                try {
                    const d = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}');
                    return d.healthData?.[todayStr]?.heatLevel ?? null;
                } catch { return null; }
            });

            const saveHeat = (v) => {
                setHeatLevel(v);
                try {
                    const d = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}');
                    if (!d.healthData) d.healthData = {};
                    d.healthData[todayStr] = { heatLevel: v };
                    localStorage.setItem('visualLifeOS_data', JSON.stringify(d));
                } catch {}
            };

            return (
                <div className="bg-os-pink p-5 rounded-os-xl h-full flex flex-col justify-between">
                    <div className="flex justify-between items-start mb-2">
                        <h3 className="font-black text-sm text-pink-900">体感监测</h3>
                        <span className="text-2xl">🩰</span>
                    </div>
                    <div className="bg-white/60 p-3 rounded-xl">
                        <p className="text-[10px] font-bold text-pink-700 mb-1">
                            今日发热评估 {heatLevel != null ? `· Lv.${heatLevel}` : '(未记录)'}
                        </p>
                        <input type="range" min="1" max="10"
                            value={heatLevel ?? 1}
                            onChange={e => saveHeat(parseInt(e.target.value))}
                            className="w-full accent-pink-500 h-1.5 bg-pink-200 rounded-full appearance-none" />
                    </div>
                </div>
            );
        };

        const DeadlineWidget = () => {
            const urgentTodo = (() => {
                try {
                    const d = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}');
                    const allTodos = d.allTodos || {};
                    const flat = Object.values(allTodos).flat().filter(t => !t.done && t.date >= TODAY_STR);
                    flat.sort((a, b) => a.date.localeCompare(b.date));
                    return flat[0] || null;
                } catch { return null; }
            })();

            if (!urgentTodo) return (
                <div className="bg-os-yellow p-5 rounded-os-xl border border-orange-100 flex flex-col items-center justify-center h-full relative overflow-hidden">
                    <div className="absolute -right-2 -bottom-4 text-6xl opacity-10 font-black">DDL</div>
                    <span className="text-3xl mb-2 opacity-30">⏰</span>
                    <p className="text-xs font-bold text-orange-300 text-center z-10">暂无待办事项</p>
                </div>
            );

            const days = Math.ceil((new Date(urgentTodo.date + 'T00:00:00') - new Date(TODAY_STR + 'T00:00:00')) / 86400000);
            return (
                <div className="bg-os-yellow p-5 rounded-os-xl border border-orange-100 flex flex-col justify-between h-full relative overflow-hidden">
                    <div className="absolute -right-2 -bottom-4 text-6xl opacity-10 font-black">DDL</div>
                    <div className="flex gap-2 items-center mb-2 z-10">
                        <span className="w-2 h-2 bg-orange-500 rounded-full animate-pulse"></span>
                        <span className="text-[10px] font-black uppercase text-orange-500 tracking-wider">High Priority</span>
                    </div>
