                                    <span className="text-xs font-bold truncate flex-1" style={{ color: '#78350f' }}>
                                        {t.name}
                                    </span>
                                    <span className="text-[10px] font-medium text-gray-400 flex-shrink-0">
                                        {t.date.slice(5)}
                                    </span>
                                    <span className="text-sm font-black flex-shrink-0" style={{ color: '#ea580c' }}>
                                        ¥{parseFloat(t.amount).toLocaleString()} {t.currency}
                                    </span>
                                </div>
                            );
                        }) : (
                            <p className="text-xs text-center text-amber-400 font-bold py-2">本月暂无记录</p>
                        )}
                    </div>

                    {/* ③ 底部分类色条 */}
                    {wCats.length > 0 && (
                        <div className="z-10">
                            <div className="flex h-2 rounded-full overflow-hidden mb-2">
                                {wCats.map(cat => (
                                    <div key={cat.name} style={{ width: `${(cat.total / wTotal * 100).toFixed(1)}%`, background: cat.color }} />
                                ))}
                            </div>
                            <div className="flex flex-wrap gap-x-3 gap-y-1">
                                {wCats.slice(0, 6).map(cat => (
                                    <span key={cat.name} className="flex items-center gap-1">
                                        <span className="w-1.5 h-1.5 rounded-full flex-shrink-0" style={{ background: cat.color }}></span>
                                        <span className="text-[9px] font-bold text-gray-500">{cat.name}</span>
                                    </span>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* ⑤ 快速记账弹窗 */}
                    {showAdd && (
                        <div className="fixed inset-0 z-[90] flex items-end md:items-center justify-center p-4 glass-overlay animate-fade-in" onClick={() => setShowAdd(false)}>
                            <div className="bg-white w-full max-w-sm rounded-3xl shadow-2xl animate-slide-up p-6" onClick={e => e.stopPropagation()}>
                                <div className="flex items-center justify-between mb-5">
                                    <h2 className="font-black text-base text-gray-800">记一笔</h2>
                                    <span className="text-xs font-bold text-gray-400">{TODAY_STR}</span>
                                </div>

                                {/* 金额（70%）+ 货币（30%）同一行 */}
                                <div className="flex gap-2 mb-3">
                                    <input
                                        type="number" inputMode="decimal" placeholder="金额"
                                        value={addForm.amount}
                                        onChange={e => setAddForm(f => ({ ...f, amount: e.target.value }))}
                                        className="bg-gray-50 rounded-2xl px-4 py-3 text-lg font-black outline-none border-2 border-transparent focus:border-yellow-400 transition-colors"
                                        style={{ flex: '7' }}
                                        autoFocus
                                    />
                                    <select
                                        value={addForm.currency}
                                        onChange={e => setAddForm(f => ({ ...f, currency: e.target.value }))}
                                        className="bg-gray-50 rounded-2xl px-3 py-3 text-sm font-bold outline-none border-2 border-transparent focus:border-yellow-400 transition-colors text-center"
                                        style={{ flex: '3', minWidth: '72px' }}>
                                        <option>JPY</option>
                                        <option>RMB</option>
                                    </select>
                                </div>

                                {/* 分类 */}
                                <select
                                    value={addForm.category}
                                    onChange={e => setAddForm(f => ({ ...f, category: e.target.value }))}
                                    className="w-full bg-gray-50 rounded-2xl px-4 py-3 text-sm font-bold outline-none border-2 border-transparent focus:border-yellow-400 transition-colors mb-3">
                                    <option value="">选择分类…</option>
                                    {wCategories.map(c => (
                                        <option key={c.id || c.name} value={c.name}>{c.name}</option>
                                    ))}
                                    {wCategories.length === 0 && ['餐饮','日用','交通','娱乐','美容','其他'].map(c => (
                                        <option key={c} value={c}>{c}</option>
                                    ))}
                                </select>

                                {/* 备注 */}
                                <input
                                    type="text" placeholder="备注（可选）"
                                    value={addForm.name}
                                    onChange={e => setAddForm(f => ({ ...f, name: e.target.value }))}
                                    onKeyDown={e => e.key === 'Enter' && saveNewTx()}
                                    className="w-full bg-gray-50 rounded-2xl px-4 py-3 text-sm font-medium outline-none border-2 border-transparent focus:border-yellow-400 transition-colors mb-4"
                                />

                                {/* 确认按钮 */}
                                <button onClick={saveNewTx}
                                    disabled={!addForm.amount}
                                    className="w-full py-4 rounded-2xl font-black text-base transition-all disabled:opacity-40"
                                    style={{ background: 'var(--accent)', color: '#fff' }}>
                                    确认记账
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // Finance 完整视图
        const FinanceView = () => {
            const [tab, setTab] = useState('month');
            const [displayMonth, setDisplayMonth] = useState(new Date().getMonth() + 1);
            const [displayYear, setDisplayYear] = useState(new Date().getFullYear());
            const [selectedDay, setSelectedDay] = useState(null);     // 日历选中日
            const [displayCurrency, setDisplayCurrency] = useState('JPY'); // 列表货币切换
            const [detailCurrency, setDetailCurrency] = useState('JPY'); // 当日明细货币切换
            const [searchTx, setSearchTx] = useState('');             // 记录搜索词

            // 从 localStorage 读取的可编辑状态
            const [fixedData, setFixedData] = useState(() => ({ ...(_financeStorage.fixedItemsByMonth || {}) }));
            const [ratesData, setRatesData] = useState(() => ({
                default: _financeStorage.exchangeRate ?? 0.048,
                monthly: { ...(_financeStorage.monthlyRates || {}) },
            }));

            // 弹窗状态
            const [editingFixed, setEditingFixed] = useState(null);
            const [showRateModal, setShowRateModal] = useState(false);
            const [rateInputDefault, setRateInputDefault] = useState('');
            const [rateInputMonthly, setRateInputMonthly] = useState('');
            const [aiPanel, setAIPanel] = useState({ isOpen: false, title: '', type: '', data: null });

            // localStorage 持久化
            const saveToStorage = (updates) => {
                try {
                    const stored = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}');
                    Object.assign(stored, updates);
                    localStorage.setItem('visualLifeOS_data', JSON.stringify(stored));
                } catch {}
                syncToCloud();
            };

            // key 格式：fixedItemsByMonth 用 "2026-4"（月份-1），monthlyRates 用 "2026-05"
            const fixedKey = `${displayYear}-${displayMonth - 1}`;
            const rateKey  = `${displayYear}-${String(displayMonth).padStart(2, '0')}`;

            // 当月汇率：优先月度覆盖，否则用默认
            const currentRate = Number(ratesData.monthly[rateKey]) || Number(ratesData.default) || 0.048;

            // 货币换算辅助
            const isRMBCur = displayCurrency === 'RMB';
            const toJPY = (amt, cur) => cur === 'RMB' || cur === 'CNY' ? amt / currentRate : amt;
            const toRMB = (amt, cur) => cur === 'RMB' || cur === 'CNY' ? amt : amt * currentRate;
            const fmtJPY = (n) => '¥' + Math.round(n).toLocaleString() + ' JPY';
            const fmtRMB = (n) => '¥' + (n).toFixed(2) + ' RMB';
            const fmtAmt = (amt, cur) => isRMBCur ? fmtRMB(toRMB(amt, cur)) : fmtJPY(toJPY(amt, cur));

            // 计算当月固定支出合计（JPY）
            const fixedItems = fixedData[fixedKey] || [];
            const fixedTotal = fixedItems
                .filter(item => item.type === 'expense')
                .reduce((sum, item) => {
                    const amt = parseFloat(item.amount) || 0;
                    return sum + (item.currency === 'RMB' ? amt / currentRate : amt);
                }, 0);

            // 月份导航
            const goPrevMonth = () => {
                setSelectedDay(null);
                if (displayMonth === 1) { setDisplayMonth(12); setDisplayYear(y => y - 1); }
                else setDisplayMonth(m => m - 1);
            };
            const goNextMonth = () => {
                setSelectedDay(null);
                if (displayMonth === 12) { setDisplayMonth(1); setDisplayYear(y => y + 1); }
                else setDisplayMonth(m => m + 1);
            };

            // 月度数据（动态计算）
            const MONTH_NAMES = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
            const monthStr    = `${displayYear}-${String(displayMonth).padStart(2, '0')}`;
            const monthTx     = MOCK_TRANSACTIONS.filter(t => t.date && t.date.startsWith(monthStr));
            const monthTotal  = monthTx.reduce((s, t) => s + toJPY(parseFloat(t.amount) || 0, t.currency), 0);

            // 按分类聚合
            const catMap = {};
            monthTx.forEach(t => {
                const cat = t.category || '其他';
                const jpy = toJPY(parseFloat(t.amount) || 0, t.currency);
                catMap[cat] = (catMap[cat] || 0) + jpy;
            });
            const monthCats = Object.entries(catMap)
                .map(([name, total]) => ({ name, total, color: getCatColor(name) }))
                .sort((a, b) => b.total - a.total);
            // 分类占比只显示流水支出，固定支出单独在顶部显示
            const allMonthCats = monthCats;
            const allMonthTotal = monthCats.reduce((s, c) => s + c.total, 0) || 1;
            const monthCatsTotal = allMonthTotal;
            const maxMonthCat = Math.max(...allMonthCats.map(c => c.total), 1);

            const daysInMonth = new Date(displayYear, displayMonth, 0).getDate();
            const firstDay    = new Date(displayYear, displayMonth - 1, 1).getDay();
            const datesWithTx = new Set(monthTx.map(t => t.date));

            // 当日明细
            const selectedDayTx    = selectedDay ? MOCK_TRANSACTIONS.filter(t => t.date === selectedDay) : [];
            const selectedDayTotal = selectedDayTx.reduce((s, t) => s + toJPY(parseFloat(t.amount) || 0, t.currency), 0);

            // 年度数据（动态计算，含固定支出）
            // fixedData key 格式："2026-0"（0 = 1月，即 monthIndex = month - 1）
            const yearRows = Array.from({ length: 12 }, (_, i) => {
                const m = i + 1;
                const ms = `${displayYear}-${String(m).padStart(2, '0')}`;
                const txs = MOCK_TRANSACTIONS.filter(t => t.date && t.date.startsWith(ms));
                const txTotal = txs.reduce((s, t) => s + toJPY(parseFloat(t.amount) || 0, t.currency), 0);
                const fItems = (fixedData[`${displayYear}-${i}`] || []).filter(f => f.type === 'expense');
                const fixedMonthTotal = fItems.reduce((s, f) => {
                    const amt = parseFloat(f.amount) || 0;
                    return s + (f.currency === 'RMB' || f.currency === 'CNY' ? amt / currentRate : amt);
                }, 0);
                return { month: m, txTotal: Math.round(txTotal), fixedTotal: Math.round(fixedMonthTotal), total: Math.round(txTotal + fixedMonthTotal) };
            });
            const yearTxTotal    = yearRows.reduce((s, m) => s + m.txTotal, 0);
            const yearFixedTotal = yearRows.reduce((s, m) => s + m.fixedTotal, 0);
            const yearTotal      = yearTxTotal + yearFixedTotal;
            const activeMs       = yearRows.filter(m => m.total > 0);
            const yearAvg        = activeMs.length > 0 ? Math.round(yearTotal / activeMs.length) : 0;
            const yearCount      = MOCK_TRANSACTIONS.filter(t => t.date && t.date.startsWith(`${displayYear}-`)).length;
            const maxMonthTotal  = Math.max(...yearRows.map(m => m.total), 1);

            // 年度分类 top5（仅 transactions，固定支出不计入分类）
            const yearCatMap = {};
            MOCK_TRANSACTIONS.filter(t => t.date && t.date.startsWith(`${displayYear}-`)).forEach(t => {
                const cat = t.category || '其他';
                const jpy = toJPY(parseFloat(t.amount) || 0, t.currency);
                yearCatMap[cat] = (yearCatMap[cat] || 0) + jpy;
            });
            const top5 = Object.entries(yearCatMap)
                .map(([name, total]) => ({ name, total: Math.round(total), color: getCatColor(name) }))
                .sort((a, b) => b.total - a.total)
                .slice(0, 5);
            const maxCatTotal = top5[0]?.total || 1;

            const goldBg = { background: 'var(--finance-bg)', border: '1.5px solid var(--finance-border)' };

            // ── 固定项目弹窗 ──
            const openFixedModal = () => setEditingFixed((fixedData[fixedKey] || []).map(i => ({ ...i })));
            const closeFixedModal = () => setEditingFixed(null);
            const saveFixedModal = () => {
                const next = { ...fixedData, [fixedKey]: editingFixed };
                setFixedData(next);
                saveToStorage({ fixedItemsByMonth: next });
                setEditingFixed(null);
            };
            const updateItem = (idx, field, value) =>
                setEditingFixed(items => items.map((item, i) => i === idx ? { ...item, [field]: value } : item));
            const addItem = () =>
                setEditingFixed(items => [...items, { name: '', amount: '', currency: 'JPY', type: 'expense' }]);
            const removeItem = (idx) =>
                setEditingFixed(items => items.filter((_, i) => i !== idx));

            // 弹窗内实时预览合计
            const editingTotal = (editingFixed || [])
                .filter(i => i.type === 'expense')
                .reduce((s, i) => {
                    const amt = parseFloat(i.amount) || 0;
                    return s + (i.currency === 'RMB' ? amt / currentRate : amt);
                }, 0);

            // ── 汇率弹窗 ──
            const openRateModal = () => {
                setRateInputDefault(String(ratesData.default));
                setRateInputMonthly(String(ratesData.monthly[rateKey] || ''));
                setShowRateModal(true);
            };
            const saveRateModal = () => {
                const def = parseFloat(rateInputDefault) || 0.048;
                const monthly = { ...ratesData.monthly };
                const mv = parseFloat(rateInputMonthly);
                if (mv > 0) monthly[rateKey] = mv; else delete monthly[rateKey];
                const next = { default: def, monthly };
                setRatesData(next);
                saveToStorage({ exchangeRate: def, monthlyRates: monthly });
                setShowRateModal(false);
            };

            return (
                <div className="animate-fade-in flex flex-col">

                    {/* ── Tab 切换 ── */}
                    <div className="flex gap-2 mb-4">
                        {['month', 'year'].map(t => (
                            <button key={t} onClick={() => setTab(t)}
                                className={`px-5 py-2 rounded-full text-sm font-bold transition-all ${tab === t ? 'text-white shadow-sm' : 'bg-white text-gray-400 hover:bg-gray-50'}`}
                                style={tab === t ? { background: 'var(--accent)' } : {}}>
                                {t === 'month' ? '月度' : '年度'}
                            </button>
                        ))}
                    </div>

                    <div className="pb-8">

                        {/* ══ 月度 Tab ══ */}
                        {tab === 'month' && (
                            <div className="flex flex-col gap-4 animate-fade-in">

                                <div className="flex flex-col gap-2">
                                    {/* 第一行：← 年月 → 两端对齐 ¥JPY⇄ 汇率 */}
                                    <div className="flex items-center justify-between">
                                        <div className="flex items-center gap-2">
                                            <button onClick={goPrevMonth} className="w-8 h-8 rounded-full bg-white shadow-sm font-bold text-gray-500 hover:bg-gray-50 transition-colors">←</button>
                                            <span className="font-black text-lg min-w-[90px] text-center">{displayYear}年{displayMonth}月</span>
                                            <button onClick={goNextMonth} className="w-8 h-8 rounded-full bg-white shadow-sm font-bold text-gray-500 hover:bg-gray-50 transition-colors">→</button>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <button onClick={() => setDisplayCurrency(isRMBCur ? 'JPY' : 'RMB')}
                                                className="text-[10px] font-black px-2.5 py-1 rounded-full bg-white shadow-sm border border-gray-100 hover:bg-gray-50 transition-colors"
                                                style={{ color: isRMBCur ? '#c2410c' : '#1e293b' }}>
                                                ¥{isRMBCur ? 'RMB' : 'JPY'} ⇄
                                            </button>
                                            <button onClick={openRateModal}
                                                className="text-[10px] font-black px-2.5 py-1 rounded-full bg-white shadow-sm border border-gray-100 text-gray-500 hover:bg-gray-50 transition-colors">
                                                汇率 {currentRate}
                                            </button>
                                        </div>
                                    </div>
                                    {/* 第二行：总支出 | 固定支出 | 合计 */}
                                    <div className="flex items-end gap-4 flex-wrap">
                                        <div>
                                            <p className="text-[10px] font-black uppercase tracking-widest" style={{ color: 'var(--accent)' }}>本月支出</p>
                                            <p className="text-2xl font-black" style={{ color: '#c2410c' }}>
                                                {isRMBCur ? `¥${(monthTotal * currentRate).toFixed(0)} RMB` : `¥${Math.round(monthTotal).toLocaleString()} JPY`}
                                            </p>
                                        </div>
                                        <div className="w-px h-8 bg-gray-200 self-center" />
                                        <div>
                                            <p className="text-[10px] font-black uppercase tracking-widest" style={{ color: 'var(--accent)' }}>固定支出</p>
                                            <p className="text-xl font-black" style={{ color: '#92400e' }}>
                                                {isRMBCur ? `¥${(fixedTotal * currentRate).toFixed(0)} RMB` : `¥${Math.round(fixedTotal).toLocaleString()} JPY`}
                                            </p>
                                        </div>
                                        <div className="w-px h-8 bg-gray-200 self-center" />
                                        <div>
                                            <p className="text-[10px] font-black uppercase tracking-widest" style={{ color: 'var(--accent)' }}>合计</p>
                                            <p className="text-xl font-black" style={{ color: '#475569' }}>
                                                {isRMBCur ? `¥${((monthTotal + fixedTotal) * currentRate).toFixed(0)} RMB` : `¥${Math.round(monthTotal + fixedTotal).toLocaleString()} JPY`}
                                            </p>
                                        </div>
                                        <button onClick={openFixedModal} className="text-[10px] font-black underline transition-colors ml-1 self-end mb-1 hover:opacity-70" style={{ color: 'var(--accent)' }}>管理</button>
                                    </div>
                                </div>

                                {/* 双卡片：6:4，左边固定高度可滚动，右边日历配合 */}
                                <div className="flex flex-col md:flex-row gap-4" style={{alignItems:'stretch'}}>

                                    {/* 左：分类占比 60%，固定高度可滚动 */}
                                    <div className="w-full md:w-[60%] rounded-2xl flex flex-col" style={goldBg}>
                                        <div className="px-5 pt-5 pb-2 flex-shrink-0">
                                            <h3 className="font-black text-sm tracking-widest" style={{ color: 'var(--accent)' }}>分类占比</h3>
                                        </div>
                                        <div className="px-5 pb-5 flex-1">
                                        {allMonthCats.length > 0 ? (
                                            <div className="space-y-3">
                                                {allMonthCats.map(cat => {
                                                    const pct = (cat.total / monthCatsTotal * 100);
                                                    const barPct = Math.max((cat.total / maxMonthCat * 100), 2);
                                                    const amtLabel = isRMBCur
                                                        ? '¥' + (cat.total * currentRate).toFixed(0)
                                                        : '¥' + Math.round(cat.total).toLocaleString();
                                                    const shortName = cat.name.length > 7 ? cat.name.slice(0, 7) + '…' : cat.name;
                                                    return (
                                                        <div key={cat.name} className="flex items-center gap-3">
                                                            <div className="flex items-center gap-2 flex-shrink-0" style={{ width: '88px' }}>
                                                                <span className="w-3 h-3 rounded-full flex-shrink-0" style={{ background: cat.color }}></span>
                                                                <span className="text-sm font-bold text-gray-700 truncate">{shortName}</span>
                                                            </div>
                                                            <div className="flex-1 h-2 rounded-full" style={{ background: '#f5ece0' }}>
                                                                <div style={{ width: `${barPct}%`, height: '100%', borderRadius: '999px', background: cat.color }} />
                                                            </div>
                                                            <div className="flex items-center gap-1.5 flex-shrink-0" style={{ minWidth: '90px', justifyContent: 'flex-end' }}>
                                                                <span className="text-sm font-bold text-gray-700">{amtLabel}</span>
                                                                <span className="text-xs text-gray-400">{pct.toFixed(0)}%</span>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        ) : (
                                            <p className="text-sm text-gray-400 text-center py-8">暂无数据</p>
                                        )}
                                        </div>
                                    </div>

                                    {/* 右：日历 + 当日明细 40%，配合左边高度 */}
                                    <div className="w-full md:w-[40%] flex flex-col gap-3" style={{justifyContent:'flex-start'}}>

                                        {/* 迷你日历 */}
                                        <div className="bg-white p-4 rounded-2xl shadow-sm flex-shrink-0">
                                            <h3 className="font-black text-xs uppercase tracking-widest text-gray-400 mb-2">{displayMonth} 月日历</h3>
                                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: '3px' }}>
                                                {['日','一','二','三','四','五','六'].map(d => (
                                                    <div key={d} style={{ height: '24px', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '8px', fontWeight: 700, color: '#9ca3af' }}>{d}</div>
                                                ))}
                                                {Array.from({ length: firstDay }).map((_, i) => (
                                                    <div key={`e-${i}`} style={{ height: '36px' }} />
                                                ))}
                                                {Array.from({ length: daysInMonth }, (_, i) => i + 1).map(d => {
                                                    const ds = `${displayYear}-${String(displayMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                                                    const hasTx = datesWithTx.has(ds);
                                                    const isToday = ds === TODAY_STR;
                                                    const isSelected = ds === selectedDay;
                                                    const dayTxs = MOCK_TRANSACTIONS.filter(t => t.date === ds);
                                                    const dotColor = dayTxs.length > 0 ? getCatColor(dayTxs[0].category) : null;
                                                    return (
                                                        <div key={d}
                                                            onClick={() => hasTx && setSelectedDay(isSelected ? null : ds)}
                                                            style={{
                                                                height: '36px',
                                                                display: 'flex',
                                                                flexDirection: 'column',
                                                                alignItems: 'center',
                                                                justifyContent: 'center',
                                                                borderRadius: '6px',
                                                                fontSize: '10px',
                                                                fontWeight: 700,
                                                                cursor: hasTx ? 'pointer' : 'default',
                                                                outline: isSelected ? '2px solid #fbbf24' : 'none',
                                                                background: isToday ? '#475569' : hasTx ? (isSelected ? '#fde68a' : '#fef3c7') : 'transparent',
                                                                color: isToday ? '#fff' : hasTx ? '#78350f' : '#d1d5db',
                                                            }}>
                                                            {d}
                                                            {hasTx && !isToday && <span style={{ width: '3px', height: '3px', borderRadius: '50%', background: dotColor, display: 'block', marginTop: '1px' }} />}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>

                                        {/* 当日明细：紧跟日历下方，最高160px可滚动 */}
                                        {selectedDay && (
                                            <div className="rounded-2xl overflow-hidden animate-fade-in" style={{ border: '1.5px solid var(--finance-border)', background: 'var(--finance-bg)' }}>
                                                <div className="px-3 py-2 flex items-center justify-between flex-shrink-0" style={{ borderBottom: '1px solid var(--finance-border)' }}>
                                                    <div>
                                                        <span className="font-black text-xs text-amber-900">{selectedDay.slice(5)} 明细</span>
                                                        <span className="ml-1.5 text-[10px] text-amber-600 font-bold">{selectedDayTx.length} 笔</span>

        // ── 云同步函数 ──
        const syncFromCloud = async () => {
            if (!CURRENT_USER_ID) return null;
            try {
                const { data, error } = await _supabase
                    .from('lifeos_data')
                    .select('*')
                    .eq('id', CURRENT_USER_ID)
                    .single();
                if (error || !data) return null;
                const local = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}');
                // 合并策略：哪边数据多用哪边，不用空数组覆盖有数据的本地
                const mergeArr = (cloud, loc) => {
                    if (!cloud || cloud.length === 0) return loc || [];
                    if (!loc || loc.length === 0) return cloud;
                    return cloud.length >= loc.length ? cloud : loc;
                };
                const mergeObj = (cloud, loc) => {
                    if (!cloud || Object.keys(cloud).length === 0) return loc || {};
                    if (!loc || Object.keys(loc).length === 0) return cloud;
                    return Object.keys(cloud).length >= Object.keys(loc).length ? cloud : loc;
                };
                const merged = {
                    ...local,
                    transactions:      mergeArr(data.transactions,         local.transactions),
                    categories:        mergeArr(data.categories,           local.categories),
                    fixedItemsByMonth: mergeObj(data.fixed_items_by_month, local.fixedItemsByMonth),
                    wishlist:          mergeArr(data.wishlist,              local.wishlist),
                    allTodos:          mergeObj(data.todos,                 local.allTodos),
                    habits:            mergeObj(data.habits,                local.habits),
                    periodLog:         mergeArr(data.period_log,            local.periodLog),
                    countdowns:        mergeArr(data.countdowns,            local.countdowns),
                    nowPlaying:        data.now_playing         || local.nowPlaying          || {},
                    exchangeRate:      data.exchange_rate       || local.exchangeRate        || 0.048,
                    monthlyRates:      mergeObj(data.monthly_rates,         local.monthlyRates),
                    theme:             data.theme               || local.theme               || 'cream',
                    smokingLog:        mergeObj(data.smoking_log,           local.smokingLog),
                    smokingGoal:       data.smoking_goal        || local.smokingGoal         || 20,
                };
                localStorage.setItem('visualLifeOS_data', JSON.stringify(merged));
                // 立即把合并后的数据推回云端
                await syncToCloud();
                return merged;
            } catch(e) {
                console.log('sync from cloud failed:', e);
                return null;
            }
        };

        const syncToCloud = async () => {
            if (!CURRENT_USER_ID) {
                const { data: { session } } = await _supabase.auth.getSession();

            if (!CURRENT_USER_ID) return false;
            try {
                const local = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}');
                const { error } = await _supabase
                    .from('lifeos_data')
                    .upsert({
                        id:                    CURRENT_USER_ID,
                        transactions:          local.transactions        || [],
                        categories:            local.categories          || [],

                    const d = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}');
                    d.theme = themeId;
                    localStorage.setItem('visualLifeOS_data', JSON.stringify(d));
                } catch {}
            }, [themeId]);

            // widgets 持久化
            useEffect(() => {
                try {
                    const d = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}');
                    d.widgetConfig = widgets;
                    localStorage.setItem('visualLifeOS_data', JSON.stringify(d));
                } catch {}
            }, [widgets]);

            // Auth 状态监听
            useEffect(() => {
                _supabase.auth.getSession().then(({ data: { session } }) => {
                    const u = session?.user ?? null;
                    setUser(u);
                    CURRENT_USER_ID = u?.id ?? null;
                    setAuthChecked(true);
                });
                const { data: { subscription } } = _supabase.auth.onAuthStateChange((_event, session) => {
                    const u = session?.user ?? null;
                    setUser(u);
                    CURRENT_USER_ID = u?.id ?? null;
                });
                return () => subscription.unsubscribe();
            }, []);

            // 登录后从云端拉取
            useEffect(() => {
                if (!user) return;
                setSyncStatus('syncing');
                syncFromCloud().then(data => {
                    if (data) {
                        if (data.theme) setThemeId(data.theme);
                        setSyncStatus('done');
                        setTimeout(() => setSyncStatus('idle'), 3000);
                    } else {
                        setSyncStatus('idle');
                    }
                });
            }, [user]);

            // 同步状态指示器文本/样式
            const syncIndicator = syncStatus === 'syncing'
                ? { text: '⟳ 同步中…', color: '#94a3b8' }
                : syncStatus === 'done'
                ? { text: '✓ 已同步',  color: '#22c55e' }
                : syncStatus === 'error'
                ? { text: '✗ 同步失败', color: '#ef4444' }
                : null;


            // 拖拽逻辑
            const moveWidget = (fromIdx, toIdx) => {
                const newW = [...widgets];
                const [moved] = newW.splice(fromIdx, 1);
                newW.splice(toIdx, 0, moved);
                setWidgets(newW);
            };

            // 调整大小逻辑
            const cycleWidgetSize = (index) => {
                const newW = [...widgets];
                const sizes = ['small', 'medium', 'large'];
                newW[index].size = sizes[(sizes.indexOf(newW[index].size) + 1) % sizes.length];
                setWidgets(newW);
            };

            // 本地 JSON 导入逻辑
            const handleImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                e.target.value = '';
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    try {
                        const raw = JSON.parse(ev.target.result);
                        const transactions      = raw.transactions      || [];
                        const categories        = raw.categories        || [];
                        const fixedItemsByMonth = raw.fixedItemsByMonth || {};
                        const wishlist          = raw.wishlist          || [];
                        const exchangeRate      = raw.exchangeRate      || 0.048;
                        const monthlyRates      = raw.monthlyRates      || {};

                        const existing = (() => {
                            try { return JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}'); } catch { return {}; }
                        })();
                        const merged = {
                            ...existing,
                            transactions, categories, fixedItemsByMonth,
                            wishlist, exchangeRate, monthlyRates,
                            migratedAt: new Date().toISOString(),
                        };
                        localStorage.setItem('visualLifeOS_data', JSON.stringify(merged));

                        // 确保拿到登录用户再上传
                        const { data: { session } } = await _supabase.auth.getSession();
                        const uid = session?.user?.id;
                        if (uid) {
                            CURRENT_USER_ID = uid;
                            const ok = await syncToCloud();
                            setToast({ ok: true, msg: `✅ 导入完成！共 ${transactions.length} 条记录，${ok ? '已同步到云端' : '本地保存成功（云端同步失败）'}` });
                        } else {
                            setToast({ ok: true, msg: `✅ 导入完成！共 ${transactions.length} 条记录（请登录后数据会自动同步到云端）` });
                        }
                        setTimeout(() => window.location.reload(), 3000);
                    } catch (err) {
                        setToast({ ok: false, msg: `❌ 导入失败：${err.message}` });
                        setTimeout(() => setToast(null), 4000);
                    }
                };
                reader.onerror = () => {
                    setToast({ ok: false, msg: '❌ 文件读取失败，请重试' });
                    setTimeout(() => setToast(null), 4000);
                };
                reader.readAsText(file, 'utf-8');
            };

            // 收集本周数据并打开 AI 周报面板
            const openWeeklyAI = () => {
                const stored = (() => { try { return JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}'); } catch { return {}; } })();
                const weekDates = CURRENT_WEEK_DATES;
                const weekEvents = events.filter(e => weekDates.includes(e.date))
                    .map(({ title, catId, date }) => ({ title, catId, date }));
                const weekTx = MOCK_TRANSACTIONS.filter(t => weekDates.includes(t.date))
                    .map(({ name, amount, currency, category, date }) => ({ name, amount, currency, category, date }));
                const weekKey = getWeek(new Date(TODAY_STR));
                const weekTodos = stored.allTodos?.[weekKey] || [];
                const completedTodos = weekTodos.filter(t => t.done).length;
                const totalTodos = weekTodos.length;
                const habitsData = stored.habits || {};
                const weekHabits = {};
                weekDates.forEach(d => { if (habitsData[d]?.length) weekHabits[d] = habitsData[d]; });
                const now = new Date();
                const weekNum = Math.ceil(now.getDate() / 7);
                const period = `${now.getFullYear()}年${now.getMonth() + 1}月第${weekNum}周`;
                setAIPanel({
                    isOpen: true,
                    title: `AI 周报 · ${period}`,
                    type: 'weekly',
                    data: { weekEvents, weekTx, completedTodos, totalTodos, weekHabits, period }
                });
            };

            if (!authChecked) return (
                <div className="fixed inset-0 flex items-center justify-center" style={{ background: 'var(--theme-bg)' }}>
                    <div className="text-3xl animate-spin" style={{ color: 'var(--accent)' }}>⟳</div>
                </div>
            );
            if (!user) return <LoginForm />;

            return (
                <div className="flex h-screen font-sans" style={{ background: 'var(--theme-bg)', color: 'var(--theme-text)' }}>
                    
                    {/* 左侧边栏 - 大屏显示 */}
                    <aside className="hidden md:flex w-72 flex-col glass-panel border-r border-white/50 p-6 z-40 relative shadow-xl">
                        <div className="mb-8 flex items-center gap-3">
                            <div className="w-10 h-10 bg-os-text text-white rounded-xl flex items-center justify-center font-bold">( •̀ ω •́ )</div>
                            <h1 className="font-black text-xl tracking-tight">Visual OS.</h1>
                        </div>

                        {/* 搜索框 */}
                        <div className="mb-8 relative group">
                            <span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-os-purple transition-colors">🔍</span>
                            <input type="text" placeholder="Search insights..." className="w-full bg-white/60 rounded-full py-2.5 pl-10 pr-4 text-sm font-medium outline-none border border-white focus:border-os-purple focus:bg-white transition-all shadow-sm" />
                        </div>

                        {/* 导航 */}
                        <nav className="flex-1 space-y-2">
                            {navItems.map(item => (
                                <button key={item.id} onClick={() => setCurrentView(item.id)} className={`w-full flex items-center gap-3 px-4 py-3 rounded-2xl transition-all ${currentView === item.id ? 'bg-white shadow-sm font-bold text-os-text' : 'text-gray-500 hover:bg-white/50 font-medium'}`}>
                                    <span className="text-xl">{item.icon}</span> <span>{item.label}</span>
                                </button>
                            ))}
                        </nav>

                        {/* 主题切换按钮 */}
                        <button onClick={() => setShowThemePicker(true)}
                            className="mt-auto w-full bg-white/60 py-3 rounded-2xl font-bold text-sm text-gray-600 hover:bg-white/90 transition-colors flex items-center justify-center gap-2 border border-white/80 shadow-sm mb-2">
                            🎨 主题
                        </button>

                        {/* 设置按钮 */}
                        <button onClick={() => setShowSettings(true)}
                            className="w-full bg-white/60 py-3 rounded-2xl font-bold text-sm text-gray-600 hover:bg-white/90 transition-colors flex items-center justify-center gap-2 border border-white/80 shadow-sm mb-2">
                            ⚙️ 设置
                        </button>

                        {/* 用户信息 + 退出 */}
                        <div className="mb-2 bg-white/60 rounded-2xl px-3 py-2 border border-white/80 shadow-sm">
                            <p className="text-[10px] text-gray-400 truncate mb-1">{user?.email}</p>
                            <button onClick={() => _supabase.auth.signOut()}
                                className="w-full py-1.5 rounded-xl font-bold text-xs text-gray-500 hover:bg-white/90 transition-colors">
                                退出登录
                            </button>
                        </div>

                        {/* 大屏居中悬浮添加按钮 */}
                        <button onClick={() => setShowAddCenter(true)} className="w-full bg-os-text text-white py-4 rounded-2xl font-bold shadow-lg hover:bg-gray-800 transition-colors flex items-center justify-center gap-2">
                            <span className="text-xl">+</span> Quick Log
                        </button>
                    </aside>

                    {/* 主内容区 */}
                    <main className="flex-1 overflow-y-auto p-4 md:p-8 relative w-full hide-scrollbar">
                        
                        {/* 顶部过滤区 & 动作栏 */}
                        <header className="mb-6 flex flex-col md:flex-row md:items-end justify-between gap-4">
                            <div>
                                <h1 className="text-3xl font-black capitalize tracking-tight mb-2">{currentView}.</h1>
                                {(currentView === 'calendar' || currentView === 'year' || currentView === 'vault') && (
                                    <FilterBar activeFilter={activeFilter} setActiveFilter={setActiveFilter} />
                                )}
                            </div>
                            
                            <div className="flex gap-2 self-end md:self-auto items-center">
                                {syncIndicator && (
                                    <span className="text-[11px] font-bold transition-all" style={{ color: syncIndicator.color }}>
                                        {syncIndicator.text}
                                    </span>
                                )}
                                <button className="md:hidden w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm text-xl border border-gray-100">🔍</button>
                                {currentView === 'home' && (<>
                                    <button onClick={openWeeklyAI}
                                        className="px-4 h-10 rounded-full flex items-center justify-center shadow-sm text-sm font-bold border border-gray-100 bg-white hover:bg-gray-50 transition-colors gap-1.5">
                                        ✨ AI 周报
                                    </button>
                                    <button onClick={() => setShowWidgetLib(true)}
                                        className="px-4 h-10 rounded-full flex items-center justify-center shadow-sm text-sm font-bold border border-gray-100 bg-white hover:bg-gray-50 transition-colors gap-1">
                                        + Widget
                                    </button>
                                    <button onClick={() => setIsEditMode(!isEditMode)} className={`px-4 h-10 rounded-full flex items-center justify-center shadow-sm text-sm font-bold border border-gray-100 transition-colors ${isEditMode ? 'bg-os-text text-white' : 'bg-white hover:bg-gray-50'}`}>
                                        {isEditMode ? 'Done' : 'Edit Layout'}
                                    </button>
                                    <div className="relative group">
                                        <button onClick={() => importFileRef.current?.click()}
                                            className="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm border border-gray-100 hover:bg-gray-50 transition-colors text-base">
                                            📂
                                        </button>
                                        <span className="absolute bottom-full mb-2 left-1/2 -translate-x-1/2 whitespace-nowrap text-[10px] font-bold bg-gray-800 text-white px-2.5 py-1 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none">
                                            导入历史数据
                                        </span>
                                    </div>
                                </>)}
                                {currentView === 'finance' && (
                                    <button onClick={() => setCurrentView('home')} className="px-4 h-10 rounded-full flex items-center justify-center shadow-sm text-sm font-bold border border-gray-100 bg-white hover:bg-gray-50 transition-colors gap-1">
                                        ← Dashboard
                                    </button>
                                )}
                            </div>
                        </header>

                        {/* 视图路由 */}
                        <div>
                            {currentView === 'home' && (
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 auto-rows-[160px] pb-32 md:pb-8" style={{ gridAutoFlow: 'dense' }}>
                                    {widgets.map((widget, index) => (
                                        <WidgetWrapper key={widget.id} size={widget.size} isEditMode={isEditMode} index={index} onMove={moveWidget} onCycleSize={() => cycleWidgetSize(index)}>
                                            {widget.id === 'weekly' && <WeeklyWidget events={events} onOpenReport={(type)=>setReportConfig({isOpen:true, type, period:'2026年5月第2周'})} />}
                                            {widget.id === 'clock' && <ClockWidget />}
                                            {widget.id === 'countdown' && <CountdownWidget />}
                                            {widget.id === 'weather' && <WeatherWidget />}
                                            {widget.id === 'habits' && <HabitsWidget />}
                                            {widget.id === 'quote' && <QuoteWidget />}
                                            {widget.id === 'music' && <MusicWidget />}
                                            {widget.id === 'photo' && <PhotoWidget />}
                                            {widget.id === 'shopping' && <ShoppingWidget />}
                                            {widget.id === 'health' && <HealthWidget />}
                                            {widget.id === 'deadline' && <DeadlineWidget />}
                                            {widget.id === 'period' && <PeriodWidget />}
                                            {widget.id === 'smoking' && <SmokingWidget />}
                                            {widget.id === 'finance' && <FinanceWidget onOpen={() => setCurrentView('finance')} />}
                                        </WidgetWrapper>
                                    ))}
                                </div>
                            )}
                            
                            {currentView === 'finance' && <FinanceView />}
                            {currentView === 'calendar' && <CalendarView events={events} todos={todos} activeFilter={activeFilter} onOpenReport={(type)=>setReportConfig({isOpen:true, type, period:'2026年 5月'})} />}
                            {currentView === 'year' && <YearlyView events={events} activeFilter={activeFilter} onOpenReport={(type)=>setReportConfig({isOpen:true, type, period:'2026 年度'})} />}
                            {currentView === 'vault' && (
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 pb-24">
                                    {(activeFilter==='all'?events:events.filter(e=>e.catId===activeFilter)).map(e => (
                                        <div key={e.id} className="bg-white p-5 rounded-2xl shadow-sm border border-gray-50">
                                            <span className="text-3xl block mb-2">{CATEGORIES.find(c=>c.id===e.catId)?.icon}</span>
                                            <h4 className="font-bold text-sm truncate">{e.title}</h4>
                                            <p className="text-[10px] text-gray-400 font-bold mt-1">{e.date}</p>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </main>

                    {/* 手机端底部导航 */}
                    <nav className="md:hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-white/80 backdrop-blur-xl h-16 rounded-full flex justify-between items-center shadow-2xl px-6 w-[90%] max-w-sm border border-white z-50">
                        {mobileNavItems.slice(0, 2).map(item => <button key={item.id} onClick={() => setCurrentView(item.id)} className={`text-2xl transition-transform ${currentView === item.id ? 'scale-110 drop-shadow-md' : 'opacity-40 grayscale'}`}>{item.icon}</button>)}
                        <button onClick={() => setShowAddCenter(true)} className="w-14 h-14 bg-os-text text-white rounded-full flex items-center justify-center text-3xl mb-8 shadow-xl hover:scale-105 active:scale-95 transition-transform border-4 border-os-bg">+</button>
                        {mobileNavItems.slice(2).map(item => <button key={item.id} onClick={() => setCurrentView(item.id)} className={`text-2xl transition-transform ${currentView === item.id ? 'scale-110 drop-shadow-md' : 'opacity-40 grayscale'}`}>{item.icon}</button>)}
                    </nav>

                    {/* 中央悬浮添加控制台 (Center Add Modal) */}
                    {showAddCenter && (
                        <div className="fixed inset-0 z-50 flex items-end md:items-center justify-center glass-overlay animate-fade-in" onClick={() => setShowAddCenter(false)}>
                            <div className="bg-white/90 backdrop-blur-2xl w-full max-w-lg rounded-t-[2rem] md:rounded-[2rem] p-6 shadow-2xl border border-white animate-slide-up" onClick={e => e.stopPropagation()}>
                                <div className="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-6 md:hidden"></div>
                                <h3 className="text-center font-black text-sm text-gray-400 tracking-widest uppercase mb-6">What's on your mind?</h3>
                                
                                <div className="grid grid-cols-3 gap-3">
                                    {CATEGORIES.map(cat => (
                                        <button 
                                            key={cat.id} 
                                            onClick={() => { setShowAddCenter(false); setAddingCategory(cat); }}
                                            className="bg-white border border-gray-100 rounded-2xl p-4 flex flex-col items-center hover:shadow-md hover:-translate-y-1 transition-all"
                                        >
                                            <span className="text-3xl mb-2">{cat.icon}</span>
                                            <span className="font-bold text-xs text-os-text">{cat.label}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 深层表单 & AI报告层 */}
                    <DeepLogModal category={addingCategory} onClose={() => setAddingCategory(null)} onSave={(newEvent) => {
                        const next = [newEvent, ...events];
                        setEvents(next);
                        try {
                            const d = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}');
                            d.lifeEvents = next;
                            localStorage.setItem('visualLifeOS_data', JSON.stringify(d));
                        } catch {}
                        syncToCloud();
                    }} />
                    <AIReportModal {...reportConfig} onClose={() => setReportConfig({...reportConfig, isOpen: false})} />
                    <AIGeneratePanel isOpen={aiPanel.isOpen} title={aiPanel.title} type={aiPanel.type} data={aiPanel.data} onClose={() => setAIPanel(p => ({ ...p, isOpen: false }))} />
                    <SettingsModal isOpen={showSettings} onClose={() => setShowSettings(false)} />

                    {/* ── 主题选择器 ── */}
                    {showThemePicker && (
                        <div className="fixed inset-0 z-[110] flex items-center justify-center p-4 glass-overlay animate-fade-in" onClick={() => setShowThemePicker(false)}>
                            <div className="bg-white w-full max-w-xs rounded-3xl shadow-2xl p-6 animate-slide-up" onClick={e => e.stopPropagation()}>
                                <div className="flex items-center justify-between mb-5">
                                    <h2 className="font-black text-base text-gray-800">🎨 选择主题</h2>
                                    <button onClick={() => setShowThemePicker(false)} className="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center font-bold text-gray-500 hover:bg-gray-200">×</button>
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    {THEMES.map(t => (
                                        <button key={t.id} onClick={() => { setThemeId(t.id); setShowThemePicker(false); }}
                                            className="flex flex-col items-center gap-2 p-4 rounded-2xl border-2 transition-all hover:scale-105"
                                            style={{ borderColor: themeId === t.id ? t.accent : '#e5e7eb', background: t.bg }}>
                                            <div className="w-8 h-8 rounded-full" style={{ background: t.accent }} />
                                            <span className="text-xs font-black" style={{ color: t.text }}>{t.name}</span>
                                            {themeId === t.id && <span className="text-[9px] font-bold" style={{ color: t.accent }}>✓ 当前</span>}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ── Widget 库 ── */}
                    {showWidgetLib && (
                        <div className="fixed inset-0 z-[110] flex items-center justify-center p-4 glass-overlay animate-fade-in" onClick={() => setShowWidgetLib(false)}>
                            <div className="bg-white w-full max-w-sm rounded-3xl shadow-2xl animate-slide-up flex flex-col max-h-[80vh]" onClick={e => e.stopPropagation()}>
                                <div className="px-5 pt-5 pb-4 border-b border-gray-50 flex items-center justify-between flex-shrink-0">
                                    <h2 className="font-black text-base text-gray-800">+ Widget 库</h2>
                                    <button onClick={() => setShowWidgetLib(false)} className="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center font-bold text-gray-500 hover:bg-gray-200">×</button>
                                </div>
                                <div className="flex-1 overflow-y-auto hide-scrollbar p-4">
                                    <div className="grid grid-cols-3 sm:grid-cols-4 gap-2.5">
                                        {ALL_WIDGETS_DEF.map(def => {
                                            const isOn = widgets.some(w => w.id === def.id);
                                            return (
                                                <button key={def.id}
                                                    onClick={() => {
                                                        if (isOn) setWidgets(ws => ws.filter(w => w.id !== def.id));
                                                        else setWidgets(ws => [...ws, { id: def.id, size: def.defaultSize }]);
                                                    }}
                                                    className="relative flex flex-col items-center justify-center rounded-2xl p-2.5 transition-all"
                                                    style={{ height: '90px', background: isOn ? '#f0f0f0' : '#fff', border: `1.5px solid ${isOn ? '#d1d5db' : '#f3f4f6'}` }}>
                                                    <span className="absolute top-2 right-2 w-3 h-3 rounded-full"
                                                        style={{ background: isOn ? '#22c55e' : '#d1d5db' }} />
                                                    <span style={{ fontSize: '28px', lineHeight: 1 }}>{def.icon}</span>
                                                    <span className="text-[12px] font-bold text-gray-700 mt-1.5 leading-tight text-center">{def.label}</span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                                <div className="px-5 pb-5 pt-3 border-t border-gray-50 flex-shrink-0">
                                    <button onClick={() => setShowWidgetLib(false)} className="w-full py-3 rounded-2xl font-bold text-white text-sm" style={{ background: '#475569' }}>完成</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 隐藏文件 input（导入用） */}
                    <input ref={importFileRef} type="file" accept=".json,application/json" className="hidden" onChange={handleImport} />

                    {/* Toast 提示 */}
                    {toast && (
                        <div className="fixed bottom-24 md:bottom-8 left-1/2 -translate-x-1/2 z-[200] px-5 py-3 rounded-2xl shadow-2xl text-sm font-bold text-white animate-slide-up whitespace-nowrap"
                            style={{ background: toast.ok ? '#1e293b' : '#ef4444' }}>
                            {toast.msg}
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(r => console.log('SW registered:', r.scope))
                    .catch(e => console.log('SW failed:', e));
            });
        }
    </script>
</body>
</html>
