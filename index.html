                    <h4 className="text-sm font-black leading-tight text-orange-900 z-10">{urgentTodo.title}</h4>
                    <div className="text-right mt-2 z-10">
                        <span className="text-2xl font-black text-orange-500 drop-shadow-sm">
                            {days <= 0 ? '今天' : days}{days > 0 && <span className="text-xs"> D Left</span>}
                        </span>
                    </div>
                </div>
            );
        };

        const ClockWidget = () => {
            const [now, setNow] = useState(new Date());
            useEffect(() => {
                const timer = setInterval(() => setNow(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);
            const weekDays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${weekDays[now.getDay()]}`;
            const hour = now.getHours();
            const greeting = hour >= 5 && hour < 11 ? '早上好 🌸'
                : hour >= 11 && hour < 14 ? '午安 ☀️'
                : hour >= 14 && hour < 18 ? '下午好 🍵'
                : hour >= 18 && hour < 22 ? '晚上好 🌙'
                : '夜深了 ⭐';
            return (
                <div className="h-full flex flex-col items-center justify-center rounded-os-xl" style={{ background: '#475569' }}>
                    <span className="text-[11px] font-bold mb-1" style={{ color: '#cbd5e1' }}>{greeting}</span>
                    <span className="font-black text-white leading-none tracking-tight" style={{ fontSize: 'clamp(2rem, 5vw, 2.5rem)' }}>{hh}:{mm}</span>
                    <span className="text-[10px] font-medium mt-2 text-center px-2" style={{ color: '#94a3b8' }}>{dateStr}</span>
                </div>
            );
        };


        const PeriodDetailModal = ({ isOpen, onClose, log, saveLog }) => {
            const [startDate, setStartDate] = useState(TODAY_STR);
            const [endDate, setEndDate] = useState(TODAY_STR);

            if (!isOpen) return null;

            const sorted = [...log].sort((a, b) => b.startDate.localeCompare(a.startDate));
            const year = new Date().getFullYear();

            const handleStart = () => {
                const newEntry = { startDate, endDate: null };
                saveLog([...log, newEntry]);
            };
            const handleEnd = () => {
                // find last entry with null endDate or set endDate on latest
                const latest = [...log].sort((a, b) => b.startDate.localeCompare(a.startDate))[0];
                if (!latest) return;
                saveLog(log.map(e => e.startDate === latest.startDate ? { ...e, endDate } : e));
            };
            const deleteEntry = (startD) => {
                saveLog(log.filter(e => e.startDate !== startD));
            };

            const durOf = (e) => e.endDate
                ? Math.floor((new Date(e.endDate + 'T00:00:00') - new Date(e.startDate + 'T00:00:00')) / 86400000) + 1
                : null;
            const allSorted = [...log].sort((a, b) => a.startDate.localeCompare(b.startDate));
            let avgCycle = null, avgDuration = null;
            if (allSorted.length >= 2) {
                const ivs = [];
                for (let i = 1; i < allSorted.length; i++)
                    ivs.push(Math.floor((new Date(allSorted[i].startDate + 'T00:00:00') - new Date(allSorted[i-1].startDate + 'T00:00:00')) / 86400000));
                avgCycle = Math.round(ivs.reduce((s,v) => s+v, 0) / ivs.length);
            }
            const completedEntries = allSorted.filter(e => e.endDate);
            if (completedEntries.length > 0) {
                const durs = completedEntries.map(e => durOf(e));
                avgDuration = Math.round(durs.reduce((s,v) => s+v, 0) / durs.length);
            }
            const thisYearCount = log.filter(e => e.startDate.startsWith(`${year}`)).length;

            return (
                <div className="fixed inset-0 z-[100] flex items-end md:items-center justify-center glass-overlay animate-fade-in" onClick={onClose}>
                    <div className="bg-white w-full max-w-md rounded-t-3xl md:rounded-3xl shadow-2xl animate-slide-up flex flex-col" style={{maxHeight: '80vh'}} onClick={e => e.stopPropagation()}>
                        <div className="px-5 pt-5 pb-4 border-b border-gray-50 flex items-center justify-between flex-shrink-0">
                            <h2 className="font-black text-base" style={{ color: '#9d174d' }}>🌸 经期详情</h2>
                            <button onClick={onClose} className="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center font-bold text-gray-500 hover:bg-gray-200">×</button>
                        </div>

                        <div className="flex-1 overflow-y-auto hide-scrollbar">
                            {/* 补录入口 */}
                            <div className="px-5 py-4 border-b border-gray-50">
                                <h3 className="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-3">补录 / 修改</h3>
                                <div className="flex flex-col gap-2">
                                    <div className="flex gap-2 items-center">
                                        <input type="date" value={startDate} max={TODAY_STR}
                                            onChange={e => setStartDate(e.target.value)}
                                            className="flex-1 text-sm font-bold rounded-xl px-3 py-2 border outline-none"
                                            style={{ background: '#fdf2f8', borderColor: '#f0d8ea', color: '#9d174d' }} />
                                        <button onClick={handleStart}
                                            className="px-4 py-2 rounded-xl text-sm font-black text-white flex-shrink-0"
                                            style={{ background: '#f472b6' }}>🔴 记录开始</button>
                                    </div>
                                    <div className="flex gap-2 items-center">
                                        <input type="date" value={endDate} max={TODAY_STR}
                                            onChange={e => setEndDate(e.target.value)}
                                            className="flex-1 text-sm font-bold rounded-xl px-3 py-2 border outline-none"
                                            style={{ background: '#fdf2f8', borderColor: '#f0d8ea', color: '#9d174d' }} />
                                        <button onClick={handleEnd}
                                            className="px-4 py-2 rounded-xl text-sm font-black flex-shrink-0"
                                            style={{ background: '#fce7f3', color: '#e11d48' }}>⬜ 记录结束</button>
                                    </div>
                                </div>
                            </div>

                            {/* 历史记录列表 */}
                            <div className="px-5 py-4 border-b border-gray-50">
                                <h3 className="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-3">历史记录</h3>
                                {sorted.length === 0 ? (
                                    <p className="text-sm text-gray-400 text-center py-4">暂无记录</p>
                                ) : (
                                    <div className="space-y-2">
                                        {sorted.map((e, i) => {
                                            const dur = durOf(e);
                                            return (
                                                <div key={e.startDate} className="flex items-center justify-between rounded-xl px-3 py-2.5"
                                                    style={{ background: i === 0 ? '#fdf2f8' : '#f9fafb' }}>
                                                    <div>
                                                        <span className="text-sm font-black" style={{ color: i === 0 ? '#e11d48' : '#374151' }}>
                                                            {e.startDate.slice(5).replace('-','/')}
                                                            {e.endDate && e.endDate !== e.startDate ? ` → ${e.endDate.slice(5).replace('-','/')}` : ''}
                                                        </span>
                                                        <span className="text-[11px] font-bold ml-2" style={{ color: '#f472b6' }}>
                                                            {dur ? `${dur}天` : e.endDate ? '1天' : '进行中…'}
                                                        </span>
                                                    </div>
                                                    <button onClick={() => deleteEntry(e.startDate)}
                                                        className="w-6 h-6 rounded-full bg-gray-100 hover:bg-red-50 flex items-center justify-center text-[10px] text-gray-400 hover:text-red-400 transition-colors">×</button>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>

                            {/* 底部统计 */}
                            <div className="px-5 py-4">
                                <h3 className="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-3">统计</h3>
                                <div className="grid grid-cols-3 gap-2">
                                    {[
                                        { label: '平均周期', value: avgCycle != null ? `${avgCycle}天` : '—' },
                                        { label: '平均经期', value: avgDuration != null ? `${avgDuration}天` : '—' },
                                        { label: `${year}年次数`, value: `${thisYearCount}次` },
                                    ].map(s => (
                                        <div key={s.label} className="rounded-xl p-3 text-center" style={{ background: '#fdf2f8' }}>
                                            <p className="text-[9px] font-black tracking-wide mb-1" style={{ color: '#f472b6' }}>{s.label}</p>
                                            <p className="text-lg font-black leading-none" style={{ color: '#e11d48' }}>{s.value}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const SmokingDetailModal = ({ isOpen, onClose, log, saveLog, goal }) => {
            const now = new Date();
            const [displayYear, setDisplayYear] = useState(now.getFullYear());
            const [displayMonth, setDisplayMonth] = useState(now.getMonth() + 1);
            const [backfillDate, setBackfillDate] = useState(TODAY_STR);
            const [backfillCount, setBackfillCount] = useState('');

            if (!isOpen) return null;

            const monthStr = `${displayYear}-${String(displayMonth).padStart(2, '0')}`;
            const daysInMonth = new Date(displayYear, displayMonth, 0).getDate();

            const goPrev = () => { if (displayMonth === 1) { setDisplayMonth(12); setDisplayYear(y => y - 1); } else setDisplayMonth(m => m - 1); };
            const goNext = () => { if (displayMonth === 12) { setDisplayMonth(1); setDisplayYear(y => y + 1); } else setDisplayMonth(m => m + 1); };

            const saveBackfill = () => {
                const count = parseInt(backfillCount);
                if (isNaN(count) || count < 0) return;
                saveLog({ ...log, [backfillDate]: count });
                setBackfillCount('');
            };

            const monthDays = Array.from({length: daysInMonth}, (_, i) => {
                const d = i + 1;
                const key = `${monthStr}-${String(d).padStart(2, '0')}`;
                return { day: d, key, count: log[key] || 0 };
            });
            const maxBar = Math.max(...monthDays.map(d => d.count), goal, 1);
            const monthTotal = monthDays.reduce((s, d) => s + d.count, 0);
            const recordedDays = monthDays.filter(d => d.count > 0);
            const monthAvgStr = recordedDays.length > 0 ? (monthTotal / recordedDays.length).toFixed(1) : '0';
            const overDays = monthDays.filter(d => d.count > goal && d.count > 0).length;
            const maxDay = monthDays.reduce((a, b) => b.count > a.count ? b : a, { day: 0, count: 0 });

            const prevMonthStr = displayMonth === 1
                ? `${displayYear - 1}-12`
                : `${displayYear}-${String(displayMonth - 1).padStart(2, '0')}`;
            const prevDaysCount = displayMonth === 1
                ? new Date(displayYear - 1, 12, 0).getDate()
                : new Date(displayYear, displayMonth - 1, 0).getDate();
            const prevTotal = Array.from({length: prevDaysCount}, (_, i) => {
                const k = `${prevMonthStr}-${String(i+1).padStart(2,'0')}`;
                return log[k] || 0;
            }).reduce((s, v) => s + v, 0);
            const monthDiff = monthTotal - prevTotal;

            const yearRows = Array.from({length: 12}, (_, i) => {
                const m = i + 1;
                const ms = `${displayYear}-${String(m).padStart(2, '0')}`;
                const mDayCount = new Date(displayYear, m, 0).getDate();
                const mVals = Array.from({length: mDayCount}, (_, j) => log[`${ms}-${String(j+1).padStart(2,'0')}`] || 0);
                const mRecorded = mVals.filter(v => v > 0).length;
                const mTotal = mVals.reduce((s, v) => s + v, 0);
                return { month: m, avgPerDay: mRecorded > 0 ? mTotal / mRecorded : 0 };
            });
            const maxYearAvg = Math.max(...yearRows.map(r => r.avgPerDay), 1);

            return (
                <div className="fixed inset-0 z-[100] flex items-end md:items-center justify-center glass-overlay animate-fade-in" onClick={onClose}>
                    <div className="bg-white w-full max-w-lg rounded-t-3xl md:rounded-3xl shadow-2xl animate-slide-up flex flex-col" style={{ maxHeight: '80vh' }} onClick={e => e.stopPropagation()}>
                        <div className="px-6 pt-5 pb-4 border-b border-gray-50 flex items-center justify-between flex-shrink-0">
                            <div>
                                <p className="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-0.5">🚬 抽烟记录</p>
                                <h2 className="font-black text-base text-gray-800">详细数据</h2>
                            </div>
                            <button onClick={onClose} className="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center font-bold text-gray-500 hover:bg-gray-200">×</button>
                        </div>

                        <div className="flex-1 overflow-y-auto hide-scrollbar">
                            {/* 补录入口 */}
                            <div className="px-6 py-4 border-b border-gray-50">
                                <h3 className="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-3">补录数据</h3>
                                <div className="flex gap-2 items-center">
                                    <input type="date" value={backfillDate} max={TODAY_STR}
                                        onChange={e => setBackfillDate(e.target.value)}
                                        className="flex-1 text-sm font-bold rounded-xl px-3 py-2 border border-slate-200 bg-slate-50 outline-none" />
                                    <input type="number" min="0" placeholder="根数" value={backfillCount}
                                        onChange={e => setBackfillCount(e.target.value)}
                                        onKeyDown={e => e.key === 'Enter' && saveBackfill()}
                                        className="w-20 text-sm font-bold rounded-xl px-3 py-2 border border-slate-200 bg-slate-50 outline-none text-center" />
                                    <button onClick={saveBackfill}
                                        className="px-4 py-2 rounded-xl text-sm font-black text-white flex-shrink-0"
                                        style={{ background: '#475569' }}>保存</button>
                                </div>
                            </div>

                            {/* 月度视图 */}
                            <div className="px-6 py-4 border-b border-gray-50">
                                <div className="flex items-center justify-between mb-3">
                                    <h3 className="text-[10px] font-black uppercase tracking-widest text-gray-400">月度视图</h3>
                                    <div className="flex items-center gap-2">
                                        <button onClick={goPrev} className="w-6 h-6 rounded-full bg-gray-100 font-bold text-gray-500 text-xs hover:bg-gray-200 flex items-center justify-center">←</button>
                                        <span className="text-xs font-black text-gray-700 whitespace-nowrap">{displayYear}年{displayMonth}月</span>
                                        <button onClick={goNext} className="w-6 h-6 rounded-full bg-gray-100 font-bold text-gray-500 text-xs hover:bg-gray-200 flex items-center justify-center">→</button>
                                    </div>
                                </div>
                                <div className="flex items-end gap-[1.5px]" style={{ height: '80px' }}>
                                    {monthDays.map(({ day, key, count }) => {
                                        const barH = count > 0 ? Math.max(Math.round(count / maxBar * 64), 3) : 2;
                                        const isToday = key === TODAY_STR;
                                        const color = isToday ? '#475569' : count === 0 ? '#e2e8f0' : count > goal ? '#ef4444' : '#22c55e';
                                        return (
                                            <div key={day} className="flex-1 flex flex-col items-center justify-end" style={{ gap: '2px' }}>
                                                <div className="w-full rounded-t-sm" style={{ height: `${barH}px`, background: color }} />
                                                {(day % 7 === 1 || day === daysInMonth) && (
                                                    <span style={{ fontSize: '6px', color: '#94a3b8', fontWeight: 700, lineHeight: 1 }}>{day}</span>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                                <div className="flex gap-3 mt-2">
                                    {[['#22c55e','未超标'],['#ef4444','超标'],['#e2e8f0','无记录']].map(([c, l]) => (
                                        <span key={l} className="flex items-center gap-1">
                                            <span className="w-2 h-2 rounded-sm flex-shrink-0" style={{ background: c }}></span>
                                            <span style={{ fontSize: '9px', fontWeight: 700, color: '#9ca3af' }}>{l}</span>
                                        </span>
                                    ))}
                                </div>
                            </div>

                            {/* 月度统计 */}
                            <div className="px-6 py-4 border-b border-gray-50">
                                <h3 className="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-3">月度统计</h3>
                                <div className="grid grid-cols-2 gap-2 mb-2">
                                    {[
                                        { label: '本月总计', value: `${monthTotal} 根`, color: '#334155' },
                                        { label: '日均（有记录天）', value: `${monthAvgStr} 根`, color: '#334155' },
                                        { label: '超标天数', value: `${overDays} 天`, color: overDays > 0 ? '#ef4444' : '#22c55e' },
                                        { label: '最多一天', value: maxDay.count > 0 ? `${maxDay.count}根 · ${maxDay.day}日` : '—', color: '#334155' },
                                    ].map(stat => (
                                        <div key={stat.label} className="bg-slate-50 rounded-xl p-3">
                                            <p className="text-[9px] font-black text-slate-400 mb-1">{stat.label}</p>
                                            <p className="text-base font-black leading-tight" style={{ color: stat.color }}>{stat.value}</p>
                                        </div>
                                    ))}
                                </div>
                                <div className="bg-slate-50 rounded-xl p-3 flex items-center justify-between">
                                    <p className="text-[10px] font-black text-slate-400">与上月对比</p>
                                    <p className="text-sm font-black" style={{ color: monthDiff > 0 ? '#ef4444' : monthDiff < 0 ? '#22c55e' : '#94a3b8' }}>
                                        {monthDiff > 0 ? `↑ ${monthDiff}` : monthDiff < 0 ? `↓ ${Math.abs(monthDiff)}` : '持平'} 根
                                    </p>
                                </div>
                            </div>

                            {/* 年度趋势 */}
                            <div className="px-6 py-4">
                                <h3 className="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-3">{displayYear} 年度趋势 · 日均根数</h3>
                                <div className="flex items-end gap-1" style={{ height: '70px' }}>
                                    {yearRows.map((m) => {
                                        const barH = m.avgPerDay > 0 ? Math.max(Math.round(m.avgPerDay / maxYearAvg * 54), 3) : 2;
                                        const isCur = m.month === displayMonth;
                                        return (
                                            <div key={m.month} className="flex-1 flex flex-col items-center justify-end" style={{ gap: '2px' }}>
                                                <div className="w-full rounded-t-sm" style={{ height: `${barH}px`, background: isCur ? '#475569' : '#cbd5e1' }} />
                                                <span style={{ fontSize: '7px', fontWeight: 700, color: isCur ? '#475569' : '#94a3b8' }}>{m.month}</span>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const PeriodWidget = () => {
            const todayStr = (() => { const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; })();
            const today = new Date(todayStr + 'T00:00:00');

            const [log, setLog] = useState(() => {
                try { return JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}').periodLog || []; }
                catch { return []; }
            });
            const [startDate, setStartDate] = useState(todayStr);
            const [endDate, setEndDate] = useState(todayStr);
            const [showDetail, setShowDetail] = useState(false);

            useEffect(() => {
                const handler = () => {
                    try {
                        const d = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}');
                        setLog(d.periodLog || []);
                    } catch {}
                };
                window.addEventListener('lifeos:reload', handler);
                return () => window.removeEventListener('lifeos:reload', handler);
            }, []);

            const saveLog = (next) => {
                setLog(next);
                try {
                    const d = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}');
                    d.periodLog = next;
                    localStorage.setItem('visualLifeOS_data', JSON.stringify(d));
                } catch {}
                syncToCloud();
            };

            // sorted newest-first for display, oldest-first for cycle calc
            const byNewest = [...log].sort((a, b) => b.startDate.localeCompare(a.startDate));
            const byOldest = [...log].sort((a, b) => a.startDate.localeCompare(b.startDate));
            const latest = byNewest[0] || null;

            // status
            let statusText = '暂无记录，点击开始记录';
            let statusColor = '#94a3b8';
            let predictText = null;
            let isInPeriod = false;

            if (latest) {
                const startD = new Date(latest.startDate + 'T00:00:00');
                const endD = latest.endDate ? new Date(latest.endDate + 'T00:00:00') : null;
                if (!endD || today <= endD) {
                    // in period (endDate null or today ≤ endDate)
                    const dayNum = Math.floor((today - startD) / 86400000) + 1;
                    statusText = `第 ${dayNum} 天`;
                    statusColor = '#e11d48';
                    isInPeriod = true;
                } else {
                    const daysSinceEnd = Math.floor((today - endD) / 86400000);
                    statusText = `距上次 ${daysSinceEnd} 天`;
                    statusColor = '#94a3b8';
                    // predict next based on avg cycle of last 3
                    if (byOldest.length >= 2) {
                        const ivs = [];
                        for (let i = Math.max(1, byOldest.length - 3); i < byOldest.length; i++)
                            ivs.push(Math.floor((new Date(byOldest[i].startDate + 'T00:00:00') - new Date(byOldest[i-1].startDate + 'T00:00:00')) / 86400000));
                        const avgCycle = Math.round(ivs.reduce((s,v) => s+v, 0) / ivs.length);
                        const daysSinceStart = Math.floor((today - startD) / 86400000);
                        const daysToNext = avgCycle - daysSinceStart;
                        if (daysToNext > 0) predictText = `预计下次 ${daysToNext} 天后`;
                        else if (daysToNext <= 0) predictText = `预计已到来`;
                    }
                }
            }

            const handleWidgetStart = () => {
                saveLog([...log, { startDate, endDate: null }]);
            };
            const handleWidgetEnd = () => {
                if (!latest) return;
                saveLog(log.map(e => e.startDate === latest.startDate ? { ...e, endDate } : e));
            };

            // recent 6 (newest first → display oldest→newest)
            const recent6 = byNewest.slice(0, 6).reverse();

            return (
                <div className="h-full flex flex-col p-3 rounded-os-xl" style={{ background: '#FDF2F8', border: '1.5px solid #f0d8ea' }}>
                    {/* header */}
                    <div className="flex items-center justify-between mb-2 flex-shrink-0">
                        <h3 className="font-black text-[10px] uppercase tracking-widest" style={{ color: '#9d174d' }}>🌸 经期记录</h3>
                        <button onClick={() => setShowDetail(true)} className="text-[9px] font-black px-2 py-0.5 rounded-full" style={{ background: '#fce7f3', color: '#e11d48' }}>详情</button>
                    </div>

                    {/* status */}
                    <div className="mb-2 flex-shrink-0">
                        <p className="text-xl font-black leading-none" style={{ color: statusColor }}>{statusText}</p>
                        {predictText && <p className="text-[10px] font-bold mt-0.5" style={{ color: '#ec4899' }}>{predictText}</p>}
                    </div>

                    {/* recent records */}
                    <div className="flex gap-1.5 flex-1 mb-2 overflow-x-auto items-end">
                        {recent6.length === 0 ? (
                            <p className="text-[10px] text-gray-300 font-bold self-center">暂无记录</p>
                        ) : recent6.map((e, idx) => {
                            const sD = new Date(e.startDate + 'T00:00:00');
                            const dur = e.endDate
                                ? Math.floor((new Date(e.endDate + 'T00:00:00') - sD) / 86400000) + 1
                                : Math.floor((today - sD) / 86400000) + 1;
                            const maxDur = Math.max(...recent6.map(r => r.endDate ? Math.floor((new Date(r.endDate+'T00:00:00') - new Date(r.startDate+'T00:00:00')) / 86400000) + 1 : 1), 1);
                            const barH = Math.max(Math.round(dur / maxDur * 32), 8);
                            const isLatest = idx === recent6.length - 1;
                            return (
                                <div key={e.startDate} className="flex-1 flex flex-col items-center gap-0.5 min-w-0" style={{ minWidth: '28px' }}>
                                    <div className="w-full rounded-sm" style={{ height: `${barH}px`, background: isLatest && isInPeriod ? '#e11d48' : '#f9a8d4' }} />
                                    <span className="text-[8px] font-bold text-center leading-tight" style={{ color: '#f472b6' }}>
                                        {sD.getMonth()+1}/{sD.getDate()}
                                    </span>
                                    <span className="text-[7px] font-bold text-center" style={{ color: '#fbb6ce' }}>{dur}天</span>
                                </div>
                            );
                        })}
                    </div>

                    {/* action buttons with date pickers */}
                    <div className="flex flex-col gap-1.5 flex-shrink-0">
                        <div className="flex gap-1.5 items-center">
                            <input type="date" value={startDate} max={todayStr}
                                onChange={e => setStartDate(e.target.value)}
                                className="flex-1 text-[10px] font-bold text-center bg-white rounded-lg px-1 py-1 border border-pink-200 outline-none min-w-0"
                                style={{ color: '#9d174d' }} />
                            <button onClick={handleWidgetStart}
                                className="px-2.5 py-1.5 rounded-xl text-[11px] font-black text-white flex-shrink-0 transition-opacity"
                                style={{ background: '#f472b6' }}>🔴 开始</button>
                        </div>
                        <div className="flex gap-1.5 items-center">
                            <input type="date" value={endDate} max={todayStr}
                                onChange={e => setEndDate(e.target.value)}
                                className="flex-1 text-[10px] font-bold text-center bg-white rounded-lg px-1 py-1 border border-pink-200 outline-none min-w-0"
                                style={{ color: '#9d174d' }} />
                            <button onClick={handleWidgetEnd} disabled={!latest}
                                className="px-2.5 py-1.5 rounded-xl text-[11px] font-black flex-shrink-0 transition-opacity disabled:opacity-30"
                                style={{ background: '#fce7f3', color: '#e11d48' }}>⬜ 结束</button>
                        </div>
                    </div>

                    {showDetail && ReactDOM.createPortal(
                        <PeriodDetailModal isOpen={showDetail} onClose={() => setShowDetail(false)} log={log} saveLog={saveLog} />,
                        document.body
                    )}
                </div>
            );
        };

        // ── 饮食规划 Widget ──
        const MealsWidget = () => {
            const getISOWeekKey = (mondayDate) => {
                const d = new Date(mondayDate);
                d.setHours(0, 0, 0, 0);
                d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
                const week1 = new Date(d.getFullYear(), 0, 4);
                const weekNum = 1 + Math.round(((d - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
                return `${d.getFullYear()}-w${weekNum}`;
            };
            const getMondayOfWeek = (offsetWeeks = 0) => {
                const d = new Date();
                const day = d.getDay();
                d.setDate(d.getDate() - (day === 0 ? 6 : day - 1) + offsetWeeks * 7);
                d.setHours(0, 0, 0, 0);
                return d;
            };

            const [weekOffset, setWeekOffset] = useState(0);
            const [allMeals, setAllMeals] = useState(() => {
                try { return JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}').allMeals || {}; }
                catch { return {}; }
            });

            // 云同步完成后重新从 localStorage 读取最新餐食数据
            useEffect(() => {
                const handler = () => {
                    try {
                        const d = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}');
                        setAllMeals(d.allMeals || {});
                    } catch {}
                };
                window.addEventListener('lifeos:synced', handler);
                return () => window.removeEventListener('lifeos:synced', handler);
            }, []);

            const [editing, setEditing] = useState(null);
            const [draft, setDraft] = useState('');

            const monday = getMondayOfWeek(weekOffset);
            const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
            const weekKey = getISOWeekKey(monday);
            const meals = allMeals[weekKey] || {};
            const todayStr = (() => { const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; })();

            // 周列定义：code 作为 meals 的 key，label 用于显示
            const DAY_CODES = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
            const weekDays = Array.from({ length: 7 }, (_, i) => {
                const d = new Date(monday); d.setDate(monday.getDate() + i);
                return { date: (() => { const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${dd}`; })(), code: DAY_CODES[i], label: ['一','二','三','四','五','六','日'][i] };
            });
            // 今天是第几列（0-6），用于整列高亮
            const todayColIdx = weekDays.findIndex(d => d.date === todayStr);

            const weekLabel = weekOffset === 0 ? '本周'
                : `${monday.getMonth()+1}月${monday.getDate()}日-${sunday.getMonth()+1}月${sunday.getDate()}日`;

            const saveMeals = (next) => {
                const nextAll = { ...allMeals, [weekKey]: next };
                setAllMeals(nextAll);
                try {
                    const d = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}');
                    d.allMeals = nextAll;
                    localStorage.setItem('visualLifeOS_data', JSON.stringify(d));
                } catch {}
                syncToCloud();
            };
            // 用 code 作为 key，避免跨周 date 串混淆
            const startEdit = (code, slot) => { setEditing({ code, slot }); setDraft(meals[code]?.[slot] || ''); };
            const commitEdit = () => {
                if (!editing) return;
                const { code, slot } = editing;
                const dayData = { ...(meals[code] || {}) };
                if (draft.trim()) dayData[slot] = draft.trim(); else delete dayData[slot];
                saveMeals({ ...meals, [code]: dayData });
                setEditing(null);
            };

            const SLOTS = [{ key: 'b', label: '早' }, { key: 'l', label: '午' }, { key: 'd', label: '晚' }];
            const SLOT_COLORS = { b: '#fef9c3', l: '#dcfce7', d: '#ede9fe' };
            const SLOT_TEXT   = { b: '#a16207', l: '#166534', d: '#6d28d9' };

            const _unused = {
                fontSize: '11px', fontWeight: 700, textAlign: 'center', lineHeight: 1.3,
                wordBreak: 'break-all', overflow: 'hidden',
                display: '-webkit-box', WebkitLineClamp: 3, WebkitBoxOrient: 'vertical',
            };

            return (
                <div className="h-full flex flex-col p-3 rounded-os-xl" style={{ background: '#F0FDF4', overflowY: 'hidden' }}>
                    {/* Header + 周切换 */}
                    <div className="flex items-center justify-between mb-2 flex-shrink-0">
                        <button onClick={() => { setWeekOffset(o => o - 1); setEditing(null); }}
                            className="w-6 h-6 rounded-full flex items-center justify-center font-black hover:bg-green-100 transition-colors flex-shrink-0"
                            style={{ color: '#16a34a', fontSize: '14px' }}>←</button>
                        <span className="text-[9px] font-black uppercase tracking-widest text-center"
                            style={{ color: weekOffset === 0 ? '#16a34a' : '#6b7280' }}>
                            🥗 {weekLabel}
                        </span>
                        <button onClick={() => { setWeekOffset(o => o + 1); setEditing(null); }}
                            className="w-6 h-6 rounded-full flex items-center justify-center font-black hover:bg-green-100 transition-colors flex-shrink-0"
                            style={{ color: '#16a34a', fontSize: '14px' }}>→</button>
                    </div>

                    {/* 横向可滚动 table 布局 */}
                    <div className="flex-1 overflow-x-auto hide-scrollbar" style={{ WebkitOverflowScrolling: 'touch' }}>
                        <table style={{ width: '100%', borderCollapse: 'separate', borderSpacing: '1px', tableLayout: 'fixed', minWidth: '280px' }}>
                            <thead>
                                <tr>
                                    {weekDays.map(({ code, label }, colIdx) => {
                                        const isToday = colIdx === todayColIdx;
                                        return (
                                            <th key={code} style={{ textAlign: 'center', padding: '2px 0', fontWeight: 900, fontSize: '11px' }}>
                                                <span style={{
                                                    background: isToday ? '#16a34a' : 'transparent',
                                                    color: isToday ? '#fff' : '#6b7280',
                                                    borderRadius: '50%', width: '20px', height: '20px',
                                                    display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                                                    boxShadow: isToday ? '0 0 0 2px #bbf7d0' : 'none',
                                                }}>
                                                    {label}
                                                </span>
                                            </th>
                                        );
                                    })}
                                </tr>
                            </thead>
                            <tbody>
                                {SLOTS.map(({ key: slot, label: slotLabel }) => (
                                    <tr key={slot}>
                                        {weekDays.map(({ code }, colIdx) => {
                                            const isToday = colIdx === todayColIdx;
                                            const val = meals[code]?.[slot] || '';
                                            const isEditing = editing?.code === code && editing?.slot === slot;
                                            return (
                                                <td key={code}
                                                    onClick={() => !isEditing && startEdit(code, slot)}
                                                    style={{
                                                        background: isToday ? SLOT_COLORS[slot] : '#f0fdf4',
                                                        border: `1.5px solid ${isToday ? '#4ade80' : '#d1fae5'}`,
                                                        borderRadius: '6px',
                                                        height: '28px',
                                                        padding: '2px 4px',
                                                        textAlign: 'center',
                                                        verticalAlign: 'middle',
                                                        fontSize: '11px',
                                                        wordBreak: 'break-all',
                                                        cursor: 'pointer',
                                                        overflow: 'hidden',
                                                    }}>
                                                    {isEditing ? (
                                                        <input autoFocus value={draft}
                                                            onChange={e => setDraft(e.target.value)}
                                                            onBlur={commitEdit}
                                                            onKeyDown={e => { if (e.key==='Enter') commitEdit(); if (e.key==='Escape') setEditing(null); }}
                                                            style={{ width:'100%', height:'100%', background:'transparent', border:'none',
                                                                     outline:'none', textAlign:'center', fontSize:'11px', fontWeight:700,
                                                                     color: SLOT_TEXT[slot] }} />
                                                    ) : val ? (
                                                        <span style={{ fontWeight:700, color: isToday ? SLOT_TEXT[slot] : '#4b7c50',
                                                                       fontSize:'11px', lineHeight:1.2, wordBreak:'break-all' }}>
                                                            {val}
                                                        </span>
                                                    ) : (
                                                        <span style={{ fontSize:'11px', fontWeight:700, opacity:0.3, color:'#16a34a' }}>
                                                            {slotLabel}
                                                        </span>
                                                    )}
                                                </td>
                                            );
                                        })}
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const SmokingWidget = () => {
            const todayStr = (() => { const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; })();

            const [log, setLog] = useState(() => {
                try { const d = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}'); return d.smokingLog || {}; }
                catch { return {}; }
            });
            const [goal, setGoal] = useState(() => {
                try { const d = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}'); return d.smokingGoal || 20; }
                catch { return 20; }
            });
            const [editingGoal, setEditingGoal] = useState(false);
            const [goalInput, setGoalInput] = useState('');
            const [showDetail, setShowDetail] = useState(false);

            useEffect(() => {
                const handler = () => {
                    try {
                        const d = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}');
                        setLog(d.smokingLog || {});
                        setGoal(d.smokingGoal || 20);
                    } catch {}
                };
                window.addEventListener('lifeos:reload', handler);
                return () => window.removeEventListener('lifeos:reload', handler);
            }, []);

            const saveLog = (next) => {
                setLog(next);
                try { const d = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}'); d.smokingLog = next; localStorage.setItem('visualLifeOS_data', JSON.stringify(d)); } catch {}
            };
            const saveGoal = (g) => {
                setGoal(g);
                try { const d = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}'); d.smokingGoal = g; localStorage.setItem('visualLifeOS_data', JSON.stringify(d)); } catch {}
            };

            const todayCount = log[todayStr] || 0;
            const yesterdayStr = (() => { const d = new Date(new Date().toLocaleString('en-US', {timeZone:'Asia/Tokyo'})); d.setDate(d.getDate()-1); const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${dd}`; })();
            const yesterdayCount = log[yesterdayStr] ?? null;
            const change = (delta) => saveLog({ ...log, [todayStr]: Math.max(0, todayCount + delta) });

            const last7 = Array.from({ length: 7 }, (_, i) => {
                const d = new Date(); d.setDate(d.getDate() - 6 + i);
                const key = (() => { const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${dd}`; })();
                return { key, label: `${d.getMonth()+1}/${d.getDate()}`, count: log[key] || 0, isToday: key === todayStr };
            });
            const maxBar = Math.max(...last7.map(d => d.count), goal, 1);

            const now = new Date();
            const mPrefix = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
            const mEntries = Object.entries(log).filter(([k]) => k.startsWith(mPrefix));
            const monthAvg = mEntries.length > 0 ? (mEntries.reduce((s,[,v])=>s+v,0) / mEntries.length).toFixed(1) : '0';

            return (
                <div className="h-full flex flex-col p-3 rounded-os-xl" style={{ background: '#F1F5F9' }}>
                    <div className="flex-shrink-0 mb-1.5">
                        <div className="flex items-center justify-between">
                            <h3 className="font-black text-[9px] uppercase tracking-widest text-slate-500">🚬 抽烟记录</h3>
                            <div className="flex items-center gap-1">
                                {editingGoal ? (
                                    <div className="flex items-center gap-1">
                                        <input type="number" value={goalInput} onChange={e => setGoalInput(e.target.value)}
                                            className="w-10 text-[11px] font-bold text-center bg-white rounded-lg px-1 py-0.5 border border-gray-200 outline-none" />
                                        <button onClick={() => { saveGoal(parseInt(goalInput)||20); setEditingGoal(false); }}
                                            className="text-[11px] font-black text-green-600">✓</button>
                                    </div>
                                ) : (
                                    <button onClick={() => { setGoalInput(String(goal)); setEditingGoal(true); }}
                                        className="text-[9px] font-black px-2 py-0.5 rounded-full bg-white text-slate-400 border border-slate-200 whitespace-nowrap">
                                        目标{goal}根
                                    </button>
                                )}
                                {!editingGoal && (
                                    <button onClick={() => setShowDetail(true)}
                                        className="text-[9px] font-black px-2 py-0.5 rounded-full bg-slate-200 text-slate-600">
                                        详情
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>
                    <div className="flex items-center justify-center gap-3 mb-2 flex-shrink-0">
                        <button onClick={() => change(-1)} className="w-7 h-7 rounded-full bg-white shadow-sm font-black text-slate-500 flex items-center justify-center text-base hover:bg-gray-100 transition-colors">−</button>
                        <div className="text-center">
                            <span className="font-black leading-none" style={{ fontSize: '36px', color: todayCount > goal ? '#ef4444' : '#334155' }}>{todayCount}</span>
                            {yesterdayCount !== null && todayCount !== yesterdayCount && (
                                <p className="text-[9px] font-black" style={{ color: todayCount < yesterdayCount ? '#16a34a' : '#ef4444' }}>
                                    {todayCount < yesterdayCount ? `↓${yesterdayCount - todayCount}根` : `↑${todayCount - yesterdayCount}根`}
                                </p>
                            )}
                            <p className="text-[9px] text-slate-400 font-bold">今日</p>
                        </div>
                        <button onClick={() => change(1)} className="w-7 h-7 rounded-full bg-white shadow-sm font-black text-slate-500 flex items-center justify-center text-base hover:bg-gray-100 transition-colors">+</button>
                    </div>
                    <div className="flex items-end gap-0.5 flex-1 mb-1.5">
                        {last7.map(day => {
                            const barH = day.count > 0 ? Math.max(Math.round(day.count / maxBar * 40), 3) : 2;
                            const color = day.count > goal ? '#ef4444' : day.isToday ? '#475569' : '#cbd5e1';
                            return (
                                <div key={day.key} className="flex-1 flex flex-col items-center justify-end gap-0.5">
                                    <div className="w-full rounded-t-sm" style={{ height: `${barH}px`, background: color }} />
                                    <span className="text-[7px] font-bold text-slate-400">{day.label}</span>
                                </div>
                            );
                        })}
                    </div>
                    <p className="text-[9px] text-slate-400 font-bold text-center flex-shrink-0">本月日均 <span className="font-black text-slate-600">{monthAvg}</span> 根</p>
                    {showDetail && ReactDOM.createPortal(
                        <SmokingDetailModal isOpen={showDetail} onClose={() => setShowDetail(false)} log={log} saveLog={saveLog} goal={goal} />,
                        document.body
                    )}
                </div>
            );
        };

        // ── 天气 Widget ──
        const WC_ICON = (code) => {
            if (code === 0) return '☀️';
            if (code <= 2) return '⛅';
            if (code === 3) return '☁️';
            if (code === 45 || code === 48) return '🌫️';
            if (code >= 51 && code <= 67) return '🌧️';
            if (code >= 71 && code <= 77) return '❄️';
            if (code >= 80 && code <= 82) return '🌦️';
            if (code === 95) return '⛈️';
            return '🌈';
        };
        const WC_DESC = (code) => {
            if (code === 0) return '晴';
            if (code <= 2) return '多云';
            if (code === 3) return '阴';
            if (code === 45 || code === 48) return '雾';
            if (code >= 51 && code <= 67) return '雨';
            if (code >= 71 && code <= 77) return '雪';
            if (code >= 80 && code <= 82) return '阵雨';
            if (code === 95) return '雷雨';
            return '—';
        };
        const WeatherWidget = () => {
            const [weather, setWeather] = useState(null);
            const [error, setError] = useState(false);
            useEffect(() => {
                fetch('https://api.open-meteo.com/v1/forecast?latitude=34.69&longitude=135.50&current=temperature_2m,weathercode,windspeed_10m&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=Asia%2FTokyo&forecast_days=4')
                    .then(r => r.json())
                    .then(d => setWeather(d))
                    .catch(() => setError(true));
            }, []);
            const dayNames = ['日','一','二','三','四','五','六'];
            return (
                <div className="h-full flex rounded-os-xl overflow-hidden" style={{ background: '#EFF6FF', border: '1.5px solid #bfdbfe' }}>
                    {/* 今日 */}
                    <div className="flex flex-col justify-center items-center px-5 gap-1" style={{ minWidth: '42%' }}>
                        <h3 className="text-[9px] font-black uppercase tracking-widest mb-1" style={{ color: '#3b82f6' }}>大阪 天气</h3>
                        {error ? (
                            <span className="text-xs text-gray-400">加载失败</span>
                        ) : !weather ? (
                            <span className="text-xs text-gray-400 animate-pulse">加载中…</span>
                        ) : (<>
                            <span style={{ fontSize: '2.2rem', lineHeight: 1 }}>{WC_ICON(weather.current.weathercode)}</span>
                            <span className="text-2xl font-black leading-none mt-1" style={{ color: '#1e40af' }}>{Math.round(weather.current.temperature_2m)}°</span>
                            <span className="text-[10px] font-bold mt-1" style={{ color: '#3b82f6' }}>{WC_DESC(weather.current.weathercode)}</span>
                            <span className="text-[9px]" style={{ color: '#93c5fd' }}>风 {Math.round(weather.current.windspeed_10m)} km/h</span>
                        </>)}
                    </div>
                    {/* 分割线 */}
                    <div style={{ width: '1px', background: '#bfdbfe', margin: '16px 0' }} />
                    {/* 未来3天 */}
                    <div className="flex-1 flex items-center justify-around px-3">
                        {!weather ? null : weather.daily.time.slice(1, 4).map((dateStr, i) => {
                            const d = new Date(dateStr + 'T00:00:00');
                            return (
                                <div key={dateStr} className="flex flex-col items-center gap-1">
                                    <span className="text-[9px] font-bold" style={{ color: '#60a5fa' }}>周{dayNames[d.getDay()]}</span>
                                    <span style={{ fontSize: '1.2rem', lineHeight: 1 }}>{WC_ICON(weather.daily.weathercode[i + 1])}</span>
                                    <span className="text-[10px] font-black" style={{ color: '#1e40af' }}>{Math.round(weather.daily.temperature_2m_max[i + 1])}°</span>
                                    <span className="text-[9px] font-medium" style={{ color: '#93c5fd' }}>{Math.round(weather.daily.temperature_2m_min[i + 1])}°</span>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // ── 习惯打卡 Widget ──
        const DEFAULT_HABITS = ['喝水💧', '运动🏃', '早睡🌙', '维生素💊'];
        const HabitsWidget = () => {
            const todayStr = (() => { const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; })();
            const [habitsData, setHabitsData] = useState(() => {
                try { return JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}').habits || {}; }
                catch { return {}; }
            });
            const [habitsList, setHabitsList] = useState(() => {
                try {
                    const d = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}');
                    return d.habitsList || DEFAULT_HABITS;
                } catch { return DEFAULT_HABITS; }
            });
            const [editMode, setEditMode] = useState(false);
            const [newHabit, setNewHabit] = useState('');
            const [editingHabit, setEditingHabit] = useState(null); // { index, value }

            const checked = habitsData[todayStr] || [];

            const getStreak = (habit) => {
                let streak = 0;
                const d = new Date();
                while (true) {
                    const key = (() => { const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${dd}`; })();
                    if (key === todayStr && !checked.includes(habit)) { d.setDate(d.getDate() - 1); continue; }
                    if (!(habitsData[key] || []).includes(habit)) break;
                    streak++;
                    d.setDate(d.getDate() - 1);
                }
                return streak;
            };

            const saveChecked = (next) => {
                const nextData = { ...habitsData, [todayStr]: next };
                setHabitsData(nextData);
                try { const d = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}'); d.habits = nextData; localStorage.setItem('visualLifeOS_data', JSON.stringify(d)); } catch {}

                syncToCloud();
            };
            const toggle = (habit) => {
                if (editMode) return;

                const next = checked.includes(habit) ? checked.filter(h => h !== habit) : [...checked, habit];
                saveChecked(next);

            const addHabit = () => {
                if (!newHabit.trim()) return;
                saveHabitsList([...habitsList, newHabit.trim()]);

                                    <span className="w-5 h-5 rounded-full border-2 flex items-center justify-center text-[10px] flex-shrink-0 transition-all"
                                        style={{ background: done ? '#22c55e' : 'transparent', borderColor: done ? '#22c55e' : '#cbd5e1', color: '#fff' }}>

                                    <span className="flex-1 text-left leading-tight truncate">{habit}</span>

                                </button>
                            );

        // ── 倒数日 Widget ──

                                style={{ background: 'rgba(255,255,255,0.1)', border: '1px solid rgba(255,255,255,0.15)' }}
                                autoFocus onKeyDown={e => e.key === 'Enter' && save()} />

                            </div>
                        </div>
                    )}

                    {/* 主内容 */}
                    <div className="flex-1 flex items-center gap-3 px-4 pt-4 pb-2">
                        {/* 专辑封面占位 */}

        // ── 每日照片 Widget ──
        const PhotoWidget = () => {
            const todayStr = (() => { const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; })();
            const fileRef = React.useRef(null);

            const getPhotos = () => {
                try { return JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}').dailyPhotos || {}; }
                catch { return {}; }
            };

            const [photoUrl, setPhotoUrl] = useState(() => getPhotos()[todayStr] || null);
            const [uploading, setUploading] = useState(false);
            const [uploadErr, setUploadErr] = useState(null);
            const [showHistory, setShowHistory] = useState(false);
            const [photos, setPhotos] = useState(getPhotos);

            const displayDate = todayStr.slice(5).replace('-', '/');

            const compressImage = (file) => new Promise(resolve => {
                const canvas = document.createElement('canvas');
                const img = new Image();
                img.onload = () => {
                    const maxW = 1080;
                    const scale = Math.min(1, maxW / img.width);
                    canvas.width = img.width * scale;
                    canvas.height = img.height * scale;
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    canvas.toBlob(resolve, 'image/jpeg', 0.7);
                };
                img.src = URL.createObjectURL(file);
            });

            const saveUrlLocally = (dateStr, url) => {
                try {
                    const d = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}');
                    if (!d.dailyPhotos) d.dailyPhotos = {};
                    d.dailyPhotos[dateStr] = url;
                    localStorage.setItem('visualLifeOS_data', JSON.stringify(d));
                    setPhotos({ ...d.dailyPhotos });
                } catch {}
            };

            const handleFile = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                e.target.value = '';
                setUploading(true);
                setUploadErr(null);
                try {
                    const blob = await compressImage(file);

                    if (CURRENT_USER_ID) {
                        // Supabase Storage upload
                        const path = `${CURRENT_USER_ID}/${todayStr}.jpg`;
                        const { error: upErr } = await _supabase.storage
                            .from('lifeos-photos')
                            .upload(path, blob, { upsert: true, contentType: 'image/jpeg' });
                        if (upErr) throw upErr;
                        const { data: signData, error: signErr } = await _supabase.storage
                            .from('lifeos-photos')
                            .createSignedUrl(path, 60 * 60 * 24 * 7);
                        if (signErr) throw signErr;
                        saveUrlLocally(todayStr, signData.signedUrl);
                        setPhotoUrl(signData.signedUrl);
                    } else {
                        // fallback: base64 in localStorage
                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            saveUrlLocally(todayStr, ev.target.result);
                            setPhotoUrl(ev.target.result);
                        };
                        reader.readAsDataURL(blob);
                    }
                } catch (err) {
                    setUploadErr(err.message || '上传失败');
                } finally {
                    setUploading(false);
                }
            };

            // History modal: last 30 days grid
            const last30 = Array.from({ length: 30 }, (_, i) => {
                const d = new Date(); d.setDate(d.getDate() - (29 - i));
                const y=d.getFullYear(),mo=String(d.getMonth()+1).padStart(2,'0'),dy=String(d.getDate()).padStart(2,'0'); return `${y}-${mo}-${dy}`;
            });

            return (
                <div className="h-full rounded-os-xl overflow-hidden relative" style={{ background: '#1e293b' }}>
                    <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={handleFile} />

                    {photoUrl ? (<>
                        <img src={photoUrl} alt="今日照片" className="w-full h-full object-cover"
                            onError={() => { setPhotoUrl(null); }} />
                        <div className="absolute inset-0 pointer-events-none" style={{ background: 'linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 55%)' }} />
                        <span className="absolute bottom-10 left-4 text-white text-xs font-black drop-shadow-md">{displayDate}</span>
                        <button onClick={() => setShowHistory(true)}
                            className="absolute bottom-2.5 left-4 text-[10px] font-bold text-white/70 hover:text-white transition-colors">查看更多 ›</button>
                        <button onClick={() => fileRef.current?.click()} disabled={uploading}
                            className="absolute bottom-2.5 right-3 w-8 h-8 rounded-full flex items-center justify-center font-black text-base shadow-lg transition-opacity hover:opacity-80 disabled:opacity-50"
                            style={{ background: 'rgba(255,255,255,0.25)', color: '#fff', backdropFilter: 'blur(4px)' }}>
                            {uploading ? <span className="animate-spin text-sm">⟳</span> : '+'}
                        </button>
                    </>) : (
                        <div className="w-full h-full flex flex-col items-center justify-center gap-2 cursor-pointer group relative" onClick={() => !uploading && fileRef.current?.click()}>
                            {uploading ? (
                                <>
                                    <span className="text-3xl animate-spin text-white/50">⟳</span>
                                    <span className="text-xs font-bold text-white/50">上传中…</span>
                                </>
                            ) : (<>
                                <span className="text-4xl opacity-30 group-hover:opacity-50 transition-opacity">📷</span>
                                <span className="text-xs font-bold text-gray-400 group-hover:text-gray-300 transition-colors">记录今天</span>
                                <span className="text-[10px] text-gray-500">{displayDate}</span>
                            </>)}
                            {uploadErr && (
                                <span className="absolute bottom-3 left-0 right-0 text-center text-[9px] font-bold text-red-400 px-2">{uploadErr}</span>
                            )}
                            <button onClick={e => { e.stopPropagation(); setShowHistory(true); }}
                                className="absolute bottom-2.5 right-3 text-[10px] font-bold text-gray-500 hover:text-gray-300 transition-colors">历史 ›</button>
                        </div>
                    )}

                    {showHistory && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 glass-overlay animate-fade-in" onClick={() => setShowHistory(false)}>
                            <div className="bg-white w-full max-w-sm rounded-3xl shadow-2xl animate-slide-up overflow-hidden" onClick={e => e.stopPropagation()}>
                                <div className="flex items-center justify-between px-5 pt-5 pb-3">
                                    <h2 className="font-black text-base text-gray-800">📷 近30天</h2>
                                    <button onClick={() => setShowHistory(false)} className="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center font-bold text-gray-500 hover:bg-gray-200">×</button>
                                </div>
                                <div className="grid grid-cols-5 gap-1 px-4 pb-5">
                                    {last30.map(dateStr => {
                                        const url = photos[dateStr];
                                        const label = dateStr.slice(5).replace('-', '/');
                                        const isToday = dateStr === todayStr;
                                        return (
                                            <div key={dateStr} className="flex flex-col gap-0.5">
                                                <div className="aspect-square rounded-lg overflow-hidden relative"
                                                    style={{ background: url ? 'transparent' : '#f1f5f9', border: isToday ? '2px solid #f59e0b' : 'none' }}>
                                                    {url
                                                        ? <img src={url} alt={label} className="w-full h-full object-cover" onError={ev => { ev.target.style.display='none'; }} />
                                                        : <div className="w-full h-full flex items-center justify-center text-gray-300 text-base">+</div>
                                                    }
                                                </div>
                                                <span className="text-[8px] font-bold text-center text-gray-400">{label}</span>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const parseVoiceInput = (text) => {
            const jpyMatch = text.match(/(\d+\.?\d*)\s*(日元|円|JPY|日币)/);
            const rmbMatch = text.match(/(\d+\.?\d*)\s*(块|元|RMB|人民币|rmb)/i);
            const amount = jpyMatch ? jpyMatch[1] : rmbMatch?.[1] || '';
            const currency = jpyMatch ? 'JPY' : 'RMB';
            const name = text.replace(/\d+\.?\d*\s*(日元|円|JPY|日币|块|元|RMB|人民币)/i, '').trim() || text;
            return { name, amount, currency };

            };

                if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {

                    return;
                }
                const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                const rec = new SpeechRec();

                rec.lang = 'zh-CN';
                rec.continuous = false;
                rec.interimResults = false;

                rec.onresult = (e) => {
                    if (timerRef.current) clearTimeout(timerRef.current);
                    const text = e.results[0][0].transcript;
                    setVoiceState('processing');
                    const parsed = parseVoiceInput(text);
                    onResult(parsed);
                    setVoiceState('done');

        const WidgetWrapper = ({ children, isEditMode, onEnterEdit, size, widgetId, onCycleSize, onMove, index }) => {
            const isFinance = widgetId === 'finance';
            const spanClass = (size === 'large' || size === '2x2')
                ? 'col-span-2 row-span-2'
                : (size === 'medium' || size === '2x1')
                    ? 'col-span-2 row-span-1'
                    : 'col-span-1 row-span-1';
            const longPressRef = React.useRef(null);
            const [isDragging, setIsDragging] = React.useState(false);
            const [isDragOver, setIsDragOver] = React.useState(false);
            const wrapperRef = React.useRef(null);

            const handlePointerDown = () => {
                if (isEditMode) return;
                longPressRef.current = setTimeout(() => { onEnterEdit && onEnterEdit(); }, 600);
            };
            const cancelLongPress = () => { clearTimeout(longPressRef.current); };

            // ── 桌面 HTML5 拖拽 ──
            const handleDragStart = (e) => {
                if (!isEditMode) return e.preventDefault();
                e.dataTransfer.setData('text/plain', String(index));
                e.dataTransfer.effectAllowed = 'move';
                setIsDragging(true);
            };
            const handleDragEnd = () => { setIsDragging(false); cancelLongPress(); };
            const handleDrop = (e) => {
                e.preventDefault();
                setIsDragOver(false);
                if (!isEditMode) return;
                const fromIndex = parseInt(e.dataTransfer.getData('text/plain'));
                if (!isNaN(fromIndex) && fromIndex !== index) onMove(fromIndex, index);
            };

            // ── 手机 Touch 拖拽 ──
            const handleTouchStart = (e) => {
                if (!isEditMode) return;
                setIsDragging(true);
            };
            const handleTouchMove = (e) => {
                if (!isEditMode || !isDragging) return;
                // touchAction:none 已阻止滚动，此处无需 preventDefault
            };
            const handleTouchEnd = (e) => {
                if (!isEditMode || !isDragging) return;
                setIsDragging(false);
                const touch = e.changedTouches[0];
                // 临时屏蔽自身，用 elementFromPoint 找落点
                const el = wrapperRef.current;
                const origPE = el.style.pointerEvents;
                el.style.pointerEvents = 'none';
                const target = document.elementFromPoint(touch.clientX, touch.clientY);
                el.style.pointerEvents = origPE;
                const targetWrapper = target?.closest('[data-widget-idx]');
                if (targetWrapper) {
                    const toIdx = parseInt(targetWrapper.getAttribute('data-widget-idx'));
                    if (!isNaN(toIdx) && toIdx !== index) onMove(index, toIdx);
                }
            };

            return (
                <div
                    ref={wrapperRef}
                    data-widget-idx={String(index)}
                    draggable={isEditMode}
                    onPointerDown={handlePointerDown}
                    onPointerUp={cancelLongPress}
                    onPointerLeave={cancelLongPress}
                    onDragStart={handleDragStart}
                    onDragEnd={handleDragEnd}
                    onDragOver={(e) => { if (isEditMode) { e.preventDefault(); setIsDragOver(true); } }}
                    onDragLeave={() => setIsDragOver(false)}
                    onDrop={handleDrop}
                    onTouchStart={handleTouchStart}
                    onTouchMove={handleTouchMove}
                    onTouchEnd={handleTouchEnd}

                        borderRadius: '1rem',
                        touchAction: isEditMode ? 'none' : 'auto',
                    }}

                    {isEditMode && (
                        <div className="absolute bottom-2 right-2 glass-panel rounded-full shadow-lg flex items-center p-1 z-20">

                            <p className="text-xs text-gray-300 mt-1">点击右上角 + 开始记录</p>
                        </div>

                    {/* 卡片网格 */}

                        {filtered.map(item => {

                                        <div className={`absolute inset-0 flex flex-col items-center justify-center ${item.coverUrl ? 'hidden' : 'flex'}`}

                                            <p className="text-xs font-bold text-gray-400 mb-1.5">打分</p>

                                                {[1,2,3,4,5].map(star => (

                    </div>
                </div>
            );
        };

        // ── 项目弹窗 ──
        const PROJECT_COLORS = ['#6366f1','#ec4899','#f97316','#22c55e','#3b82f6','#a78bfa'];
        const PROJECT_TYPES   = ['设计','开发','运营','咨询','其他'];
        const PROJECT_STATUSES = ['进行中','待启动','已完成','暂停'];
        const STATUS_COLORS = { '进行中':'#3b82f6','待启动':'#94a3b8','已完成':'#22c55e','暂停':'#f97316' };

        const ProjectModal = ({ project, onClose, onSave }) => {
            const [form, setForm] = useState({
                name: project?.name || '', client: project?.client || '',
                type: project?.type || '设计', status: project?.status || '进行中',
                stage: project?.stage || '',
                startDate: project?.startDate || TODAY_STR, endDate: project?.endDate || '',
                color: project?.color || '#6366f1', notes: project?.notes || '',
            });
            const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
            const canSave = form.name.trim() && form.endDate;
            return (
                <div className="fixed inset-0 z-[80] flex items-start justify-center pt-[5%] px-4 pb-4 glass-overlay animate-fade-in" onClick={onClose}>
                    <div className="bg-white w-full max-w-sm rounded-3xl shadow-2xl animate-slide-up p-6 max-h-[85vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                        <div className="flex items-center justify-between mb-4">
                            <h2 className="font-black text-base text-gray-800">{project ? '编辑项目' : '新建项目'}</h2>
                            <button onClick={onClose} className="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center font-bold text-gray-500 hover:bg-gray-200">×</button>
                        </div>
                        {/* 颜色选择 */}
                        <div className="flex gap-2 mb-4">
                            {PROJECT_COLORS.map(c => (
                                <button key={c} onClick={() => set('color', c)}
                                    className="w-8 h-8 rounded-full flex-shrink-0 transition-transform hover:scale-110"
                                    style={{ background: c, outline: form.color === c ? `3px solid #1e293b` : '3px solid transparent', outlineOffset: '2px' }} />
                            ))}
                        </div>
                        <div className="space-y-3">
                            <input value={form.name} onChange={e => set('name', e.target.value)} placeholder="项目名称 *" autoFocus
                                className="w-full bg-gray-50 rounded-2xl px-4 py-3 text-sm font-bold outline-none border-2 border-transparent focus:border-purple-200 transition-colors" />
                            <input value={form.client} onChange={e => set('client', e.target.value)} placeholder="客户名称"
                                className="w-full bg-gray-50 rounded-2xl px-4 py-3 text-sm outline-none border-2 border-transparent focus:border-purple-200 transition-colors" />
                            <div className="grid grid-cols-2 gap-2">
                                <select value={form.type} onChange={e => set('type', e.target.value)}
