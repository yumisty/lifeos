                                    {PROJECT_TYPES.map(t => <option key={t}>{t}</option>)}
                                </select>
                                <select value={form.status} onChange={e => set('status', e.target.value)}
                                    className="bg-gray-50 rounded-2xl px-3 py-3 text-sm outline-none border-2 border-transparent focus:border-purple-200 transition-colors">
                                    {PROJECT_STATUSES.map(s => <option key={s}>{s}</option>)}
                                </select>
                            </div>
                            <div>
                                <p className="text-[10px] font-black text-gray-400 mb-1">当前阶段</p>
                                <input
                                    value={form.stage}
                                    onChange={e => set('stage', e.target.value)}
                                    list="stage-options"
                                    placeholder="如：ラフ中、清稿中、修正中..."
                                    className="w-full bg-gray-50 rounded-2xl px-4 py-3 text-sm outline-none border-2 border-transparent focus:border-purple-200 transition-colors"
                                />
                                <datalist id="stage-options">
                                    <option value="ラフ中"/><option value="清稿中"/><option value="修正中"/>
                                    <option value="等待反馈"/><option value="完成"/><option value="待启动"/><option value="暂停"/>
                                </datalist>
                            </div>
                            <div className="grid grid-cols-2 gap-2">
                                <div>
                                    <p className="text-[10px] font-black text-gray-400 mb-1">开始日期</p>
                                    <input type="date" value={form.startDate} onChange={e => set('startDate', e.target.value)}
                                        className="w-full bg-gray-50 rounded-xl px-3 py-2 text-xs outline-none border border-gray-100" />
                                </div>
                                <div>
                                    <p className="text-[10px] font-black text-gray-400 mb-1">截止日期 *</p>
                                    <input type="date" value={form.endDate} onChange={e => set('endDate', e.target.value)}
                                        className="w-full bg-gray-50 rounded-xl px-3 py-2 text-xs outline-none border border-gray-100" />
                                </div>
                            </div>
                            <textarea value={form.notes} onChange={e => set('notes', e.target.value)}
                                placeholder="备注（可选）" rows={2}
                                className="w-full bg-gray-50 rounded-2xl px-4 py-3 text-sm outline-none border-2 border-transparent focus:border-purple-200 transition-colors resize-none" />
                        </div>
                        <div className="flex gap-2 mt-5">
                            <button onClick={onClose} className="flex-1 py-3 rounded-2xl bg-gray-100 text-gray-600 font-bold text-sm hover:bg-gray-200 transition-colors">取消</button>
                            <button onClick={() => canSave && onSave({ ...form, id: project?.id || Date.now(), name: form.name.trim() })}
                                disabled={!canSave}
                                className="flex-1 py-3 rounded-2xl text-white font-black text-sm disabled:opacity-40 transition-opacity hover:opacity-90"
                                style={{ background: form.color }}>保存</button>
                        </div>
                    </div>
                </div>
            );
        };

        const CalendarView = ({ events, todos, activeFilter, onOpenReport, diary = {}, onSaveDiary, projects = [], onSaveProject, onDeleteProject, calSearchOpen, calSearch, setCalSearch, onUpdateEvent, onDeleteEvent }) => {
            const [calTab, setCalTab] = useState('month');
            const [currentDate, setCurrentDate] = useState(new Date(new Date().getFullYear(), new Date().getMonth(), 1));
            const [selectedDate, setSelectedDate] = useState(TODAY_STR);
            const [detailEvent, setDetailEvent] = useState(null);
            const [diaryDraft, setDiaryDraft] = useState('');
            const [diarySaved, setDiarySaved] = useState(false);
            const [showProjectModal, setShowProjectModal] = useState(false);
            const [editingProject, setEditingProject] = useState(null);
            const [ganttMonth, setGanttMonth] = useState(() => new Date(new Date().getFullYear(), new Date().getMonth(), 1));

            // 切换选中日期时同步日记草稿
            useEffect(() => {
                setDiaryDraft(diary[selectedDate] || '');
                setDiarySaved(false);
            }, [selectedDate, diary]);

            const saveDiary = () => {
                if (onSaveDiary) onSaveDiary(selectedDate, diaryDraft);
                setDiarySaved(true);
                setTimeout(() => setDiarySaved(false), 2000);
            };

            const daysInMonth = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0).getDate();
            const firstDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1).getDay();
            const baseEvents = activeFilter === 'all' ? events : events.filter(e => e.catId === activeFilter);
            const filteredEvents = calSearch?.trim()
                ? baseEvents.filter(e => e.title?.toLowerCase().includes(calSearch.toLowerCase()))
                : baseEvents;
            const selectedEvents = filteredEvents.filter(e => e.date === selectedDate);
            const selectedTodos = todos.filter(t => t.date === selectedDate);

            const calYear = currentDate.getFullYear();
            const MONTH_LABELS = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];

            return (
                <div className="flex flex-col gap-4 pb-32 md:pb-0 animate-fade-in">

                    {/* Tab 切换 */}
                    <div className="flex gap-2">
                        {[['month','📅 月历'],['year','🗓 年历'],['projects','📋 项目']].map(([t, label]) => (
                            <button key={t} onClick={() => setCalTab(t)}
                                className={`flex-1 md:flex-none px-4 py-2.5 rounded-2xl font-black text-sm transition-all ${calTab === t ? 'text-white shadow-sm' : 'bg-white text-gray-400 hover:bg-gray-50'}`}
                                style={calTab === t ? { background: 'var(--theme-text, #475569)' } : {}}>
                                {label}
                            </button>
                        ))}
                    </div>

                    {/* 搜索框（移动端，由顶部🔍按钮控制） */}
                    {calSearchOpen && (
                        <div className="relative animate-fade-in md:hidden">
                            <input
                                autoFocus
                                type="text"
                                value={calSearch || ''}
                                onChange={e => setCalSearch(e.target.value)}
                                placeholder="搜索事件名称…"
                                className="w-full bg-white rounded-2xl px-4 py-2.5 pr-9 text-sm font-medium outline-none border border-gray-100 shadow-sm"
                            />
                            {calSearch && (
                                <button onClick={() => setCalSearch('')}
                                    className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 font-black text-base leading-none">×</button>
                            )}
                        </div>
                    )}

                    {/* ── 月历 tab ── */}
                    {calTab === 'month' && (
                        <div className="flex flex-col md:flex-row gap-6">
                            {/* 左侧：大型日历网格 */}
                            <div className="flex-1 bg-white p-6 rounded-[2rem] shadow-sm">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-2xl font-black">{currentDate.getFullYear()}年 {currentDate.getMonth()+1}月</h2>
                                    <div className="flex gap-2">
                                        <button onClick={()=>setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth()-1, 1))} className="w-10 h-10 rounded-full bg-gray-50 font-bold hover:bg-gray-200">←</button>
                                        <button onClick={()=>setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth()+1, 1))} className="w-10 h-10 rounded-full bg-gray-50 font-bold hover:bg-gray-200">→</button>
                                    </div>
                                </div>
                                {/* 按周渲染：每周日期行 + 该周项目条 */}
                                {(() => {
                                    const yr = currentDate.getFullYear(), mo = currentDate.getMonth();
                                    const mFirst = `${yr}-${String(mo+1).padStart(2,'0')}-01`;
                                    const mLast  = `${yr}-${String(mo+1).padStart(2,'0')}-${String(daysInMonth).padStart(2,'0')}`;
                                    const totalWeeks = Math.ceil((firstDay + daysInMonth) / 7);
                                    return (
                                        <div className="flex flex-col gap-1">
                                            {/* 星期头 */}
                                            <div className="grid grid-cols-7 gap-x-2 text-center mb-1">
                                                {['日','一','二','三','四','五','六'].map(d => <div key={d} className="text-xs font-bold text-gray-400">{d}</div>)}
                                            </div>
                                            {/* 周行 */}
                                            {Array.from({ length: totalWeeks }, (_, wk) => {
                                                const wkFirst = wk * 7 - firstDay + 1;
                                                const wkLast  = (wk + 1) * 7 - firstDay;
                                                const daysCells = Array.from({ length: 7 }, (_, ci) => {
                                                    const d = wk * 7 + ci - firstDay + 1;
                                                    if (d < 1 || d > daysInMonth) return <div key={`e-${wk}-${ci}`} />;
                                                    const dateStr = `${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                                                    const dayEvents = filteredEvents.filter(e => e.date === dateStr);
                                                    const isSelected = dateStr === selectedDate;
                                                    const hasDiary = !!diary[dateStr];
                                                    return (
                                                        <div key={d} onClick={() => setSelectedDate(dateStr)}
                                                            className={`aspect-square flex flex-col items-center justify-start pt-2 rounded-2xl cursor-pointer transition-all ${isSelected ? 'bg-os-text text-white shadow-md' : 'hover:bg-gray-50 text-gray-600'}`}>
                                                            <span className="text-sm font-bold">{d}</span>
                                                            <div className="flex gap-0.5 mt-1 flex-wrap justify-center px-1">
                                                                {hasDiary && <span className="text-[8px] leading-none">📝</span>}
                                                                {dayEvents.slice(0,3).map((e, idx) => {
                                                                    if (e.coverUrl && (e.catId==='movie'||e.catId==='game'))
                                                                        return <img key={idx} src={e.coverUrl} className="w-3 h-4 object-cover rounded-sm opacity-90" alt="" onError={el=>el.target.style.display='none'} />;
                                                                    const color = CATEGORIES.find(c=>c.id===e.catId)?.color||'bg-gray-400';
                                                                    return <span key={idx} className={`w-1.5 h-1.5 rounded-full ${color}`}></span>;
                                                                })}
                                                            </div>
                                                        </div>
                                                    );
                                                });
                                                // 当周项目条
                                                const wkPjs = (projects||[]).filter(p => {
                                                    if (p.endDate < mFirst || p.startDate > mLast) return false;
                                                    const sd = p.startDate < mFirst ? 1 : parseInt(p.startDate.slice(8));
                                                    const ed = p.endDate > mLast ? daysInMonth : parseInt(p.endDate.slice(8));
                                                    return sd <= Math.min(wkLast, daysInMonth) && ed >= Math.max(wkFirst, 1);
                                                });
                                                return (
                                                    <div key={wk} className="flex flex-col">
                                                        <div className="grid grid-cols-7 gap-x-2 text-center">{daysCells}</div>
                                                        {wkPjs.length > 0 && (
                                                            <div className="grid grid-cols-7 gap-x-2 mt-0.5" style={{ rowGap: '2px' }}>
                                                                {wkPjs.map(p => {
                                                                    const sd = p.startDate < mFirst ? 1 : parseInt(p.startDate.slice(8));
                                                                    const ed = p.endDate > mLast ? daysInMonth : parseInt(p.endDate.slice(8));
                                                                    const os = Math.max(sd, Math.max(wkFirst, 1));
                                                                    const oe = Math.min(ed, Math.min(wkLast, daysInMonth));
                                                                    if (os > oe) return null;
                                                                    const cs = (firstDay + os - 1) % 7 + 1;
                                                                    const ce = (firstDay + oe - 1) % 7 + 1;
                                                                    const isEnd = p.endDate >= mFirst && p.endDate <= mLast && ed === oe;
                                                                    return (
                                                                        <div key={p.id}
                                                                            style={{ gridColumn:`${cs}/${ce+1}`, background:p.color,
                                                                                     borderRadius:'4px', height:'18px', display:'flex',
                                                                                     alignItems:'center', paddingLeft:'4px', overflow:'hidden', opacity:0.85 }}>
                                                                            <span style={{ fontSize:'8px', fontWeight:700, color:'#fff', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
                                                                                {p.name}{isEnd?' ⚑':''}
                                                                            </span>
                                                                        </div>
                                                                    );
                                                                })}
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    );
                                })()}
                            </div>
                            {/* 右侧：详情面板 */}
                            <div className="w-full md:w-80 flex flex-col gap-3">
                                <button onClick={() => onOpenReport(currentDate.getFullYear(), currentDate.getMonth()+1)} className="w-full bg-white/60 hover:bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between transition-colors group">
                                    <span className="font-bold text-sm text-os-text">生成 {currentDate.getMonth()+1}月 洞察报告</span>
                                    <span className="text-xl group-hover:scale-125 transition-transform">✨</span>
                                </button>
                                {/* 日记区域 */}
                                <div className="bg-white p-4 rounded-[2rem] shadow-sm">
                                    <p className="text-xs font-black text-gray-400 mb-2">📝 {selectedDate} 日记</p>
                                    <textarea
                                        value={diaryDraft}
                                        onChange={e => setDiaryDraft(e.target.value)}
                                        placeholder="记录今天发生的事…"
                                        className="w-full bg-gray-50 rounded-2xl p-3 text-sm outline-none resize-none h-24 border border-gray-100 focus:border-os-purple/30 focus:ring-2 focus:ring-os-purple/10 transition-all"
                                    />
                                    <button onClick={saveDiary}
                                        className={`mt-2 w-full py-2 rounded-xl font-bold text-xs transition-all ${diarySaved ? 'bg-green-100 text-green-600' : 'bg-os-text text-white hover:opacity-90'}`}>
                                        {diarySaved ? '✓ 已保存' : '保存日记'}
                                    </button>
                                </div>
                                {/* 进行中项目快览 */}
                                <div className="bg-white p-4 rounded-[2rem] shadow-sm">
                                    <div className="flex items-center justify-between mb-3">
                                        <p className="text-xs font-black text-gray-400">📋 项目</p>
                                        <button onClick={() => setCalTab('projects')} className="text-[10px] font-bold hover:underline" style={{ color: 'var(--accent)' }}>全部 →</button>
                                    </div>
                                    {projects && projects.filter(p => p.status !== '已完成' && p.status !== '已取消').length > 0 ? (
                                        <div className="space-y-1 mb-3">
                                            {projects.filter(p => p.status !== '已完成' && p.status !== '已取消').slice(0, 3).map(p => {
                                                const daysLeft = Math.ceil((new Date(p.endDate + 'T00:00:00') - new Date(TODAY_STR + 'T00:00:00')) / 86400000);
                                                return (
                                                    <button key={p.id} onClick={() => { setEditingProject(p); setShowProjectModal(true); }}
                                                        className="w-full flex items-center gap-2 py-1.5 border-b border-gray-50 last:border-0 hover:bg-gray-50 rounded-lg px-1 transition-colors text-left">
                                                        <div className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{ background: p.color || '#a78bfa' }} />
                                                        <div className="flex-1 min-w-0">
                                                            <p className="text-xs font-bold text-gray-700 truncate">{p.name}</p>
                                                        </div>
                                                        <span className={`text-[10px] font-black flex-shrink-0 ${daysLeft < 0 ? 'text-red-500' : daysLeft <= 7 ? 'text-orange-500' : 'text-gray-400'}`}>
                                                            {daysLeft < 0 ? `逾期${Math.abs(daysLeft)}天` : daysLeft === 0 ? '今天截止' : `${daysLeft}天`}
                                                        </span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    ) : (
                                        <p className="text-[10px] text-gray-300 font-medium mb-3">暂无进行中项目</p>
                                    )}
                                    <button onClick={() => { setEditingProject(null); setShowProjectModal(true); }}
                                        className="w-full py-2 rounded-xl text-[10px] font-black border border-dashed border-gray-200 text-gray-400 hover:border-gray-300 hover:text-gray-500 transition-colors">
                                        + 新增项目
                                    </button>
                                </div>
                                <div className="bg-white p-5 rounded-[2rem] shadow-sm flex-1 overflow-y-auto">
                                    <h3 className="text-base font-black mb-3 border-b border-gray-100 pb-2">{selectedDate} 记录</h3>
                                    {selectedEvents.length === 0 && selectedTodos.length === 0 ? (
                                        <div className="text-center text-gray-400 text-sm mt-8">这一天没有记录哦。</div>
                                    ) : (
                                        <div className="space-y-3">
                                            {selectedTodos.map(t => (

                                                                </span>

        // 真实 3x4 年历视图
        const YearlyView = ({ events, activeFilter, onOpenReport, user }) => {

            const [showReview, setShowReview] = useState(false);
            const months = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];
            const todayStr = (() => { const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; })();

                            </button>
                            <button onClick={() => setShowReview(true)} className="text-[11px] font-bold px-3 py-1.5 rounded-xl flex items-center gap-1.5 hover:opacity-80 transition-opacity" style={{ background: 'linear-gradient(135deg,#6366f1,#a78bfa)', color: '#fff' }}>

                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 flex-1">
                        {months.map((month, mIdx) => {

                                <div key={month} className="bg-white p-4 rounded-2xl shadow-sm border border-gray-50 flex flex-col gap-2">

                                    <div className="grid grid-cols-7 gap-1.5">

                                            const dayEvents = filteredEvents.filter(e => e.date === dateStr);
                                            const isToday = dateStr === todayStr;

                                            const bgColor = dayEvents.length > 0

                                                : isToday ? 'bg-yellow-300' : 'bg-gray-100';

                                            return <div key={dIdx}
                                                className={`w-full rounded-[3px] transition-colors ${bgColor} ${dayEvents.length > 0 ? 'shadow-sm' : ''}`}
                                                style={{ aspectRatio: '1', minHeight: '10px' }}

        };

        // ── 年度回顾弹窗 ──
        const YearReviewModal = ({ isOpen, onClose, year, events, user }) => {
            const reviewRef = React.useRef(null);
            if (!isOpen) return null;

            const stored = (() => { try { return JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}'); } catch { return {}; } })();
            const exchRate = stored.exchangeRate || 0.048;
            const toJPY = (amt, cur) => (cur === 'RMB' || cur === 'CNY') ? amt / exchRate : amt;

            // 全年交易
            const allTx = (stored.transactions || []).filter(t => t.date?.startsWith(`${year}`));
            const yearTotal = Math.round(allTx.reduce((s, t) => s + toJPY(parseFloat(t.amount)||0, t.currency), 0));

            // 按月汇总
            const monthlyTotals = Array.from({ length: 12 }, (_, i) => {
                const m = `${year}-${String(i+1).padStart(2,'0')}`;
                return { month: i+1, total: Math.round(allTx.filter(t => t.date?.startsWith(m)).reduce((s,t) => s + toJPY(parseFloat(t.amount)||0, t.currency), 0)) };
            });
            const maxMonthly = Math.max(...monthlyTotals.map(m => m.total), 1);

            // 分类汇总
            const catMap = {};
            allTx.forEach(t => { const c = t.category || '其他'; catMap[c] = (catMap[c] || 0) + toJPY(parseFloat(t.amount)||0, t.currency); });
            const topCatsSorted = Object.entries(catMap).sort((a,b) => b[1]-a[1]).slice(0, 6);
            const totalCatAmount = topCatsSorted.reduce((s,[,v]) => s+v, 0) || 1;

            // 最贵单笔
            const maxTx = allTx.reduce((best, t) => {
                const v = toJPY(parseFloat(t.amount)||0, t.currency);
                return v > toJPY(parseFloat(best?.amount||0)||0, best?.currency||'JPY') ? t : best;
            }, null);

            // 记录天数
            const eventDays = new Set(events.filter(e => e.date?.startsWith(`${year}`)).map(e => e.date)).size;

            // 经期次数
            const periodCount = (stored.periodLog || []).filter(e => e.startDate?.startsWith(`${year}`)).length;

            // 习惯最长连续
            const habitsData = stored.habits || {};
            let maxHabitStreak = 0;
            (DEFAULT_HABITS || []).forEach(habit => {
                let streak = 0, best = 0;
                const allDays = Object.keys(habitsData).sort();
                allDays.forEach(d => {
                    if ((habitsData[d] || []).includes(habit)) { streak++; best = Math.max(best, streak); }
                    else streak = 0;
                });
                maxHabitStreak = Math.max(maxHabitStreak, best);
            });

            // 爸爸平均抽烟
            const smokingLog = stored.smokingLog || {};
            const smokingEntries = Object.entries(smokingLog).filter(([k]) => k.startsWith(`${year}`));
            const smokingAvg = smokingEntries.length > 0 ? (smokingEntries.reduce((s,[,v]) => s+v, 0) / smokingEntries.length).toFixed(1) : '0';

            const importFileRef = useRef(null);

            const navItems = [
                { id: 'home',     icon: '🏠', label: 'Dashboard' },
                { id: 'calendar', icon: '📅', label: 'Calendar' },
                { id: 'year',     icon: '🎨', label: 'Year Map' },
                { id: 'vault',    icon: '📂', label: 'Vault Library' },
                { id: 'finance',  icon: '💰', label: 'Finance' },
                { id: 'anime',    icon: '🌸', label: 'Anime' },
            ];
            const mobileNavItems = navItems.filter(i => !i.desktopOnly);

            const saveQuickTx = () => {
                if (!quickTxForm.amount || isNaN(parseFloat(quickTxForm.amount))) return;
                haptic(60);
                const tx = {
                    id: Date.now(),
                    date: quickTxForm.date || TODAY_STR,
                    name: quickTxForm.name.trim() || quickTxForm.category || '记账',
                    amount: parseFloat(quickTxForm.amount),
                    currency: quickTxForm.currency,
                    category: quickTxForm.category,
                };
                try {
                    const stored = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}');
                    stored.transactions = [...(stored.transactions || []), tx];
                    localStorage.setItem('visualLifeOS_data', JSON.stringify(stored));
                } catch {}
                syncToCloud();
                MOCK_TRANSACTIONS.push(tx);
                setQuickTxForm({ amount: '', currency: 'JPY', category: '', name: '', date: TODAY_STR });
                setShowQuickTx(false);
            };

            const exportData = () => {
                try {
                    const raw = localStorage.getItem('visualLifeOS_data') || '{}';
                    const blob = new Blob([raw], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `lifeos-backup-${new Date().toISOString().slice(0,10)}.json`;
                    a.click();
                    URL.revokeObjectURL(url);
                } catch (e) { alert('导出失败: ' + e.message); }
            };

            const quickCats = (() => {
                try {
                    const d = getFinanceStorage();
                    return d.categories?.length > 0 ? d.categories.map(c => typeof c === 'string' ? c : c.name) : _DEFAULT_FINANCE_CATS;
                } catch { return _DEFAULT_FINANCE_CATS; }
            })();

            // 主题 effect
            const theme = THEMES.find(t => t.id === themeId) || THEMES[0];
            useEffect(() => {
                document.documentElement.setAttribute('data-theme', themeId);
                document.documentElement.style.setProperty('--theme-bg', theme.bg);
                document.documentElement.style.setProperty('--theme-accent', theme.accent);
                document.documentElement.style.setProperty('--theme-text', theme.text);
                document.documentElement.style.setProperty('--accent', theme.accent);
                document.documentElement.style.setProperty('--finance-bg', theme.financeBg);
                document.documentElement.style.setProperty('--finance-border', theme.financeBorder);
                try {
                    const d = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}');
                    d.theme = themeId;
                    localStorage.setItem('visualLifeOS_data', JSON.stringify(d));
                    syncToCloud();
                } catch {}
            }, [themeId]);

            // widgets 持久化
            useEffect(() => {
                try {
                    const d = JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}');
                    d.widgetConfig = widgets;
                    localStorage.setItem('visualLifeOS_data', JSON.stringify(d));
                } catch {}
            }, [widgets]);

            // 通知权限 + 提醒调度
            useEffect(() => {
                if (typeof Notification !== 'undefined') {
                    Notification.requestPermission();
                }
                scheduleSmokingReminder();
                scheduleDailyReminder();
            }, []);

            // Auth 状态监听
            useEffect(() => {
                _supabase.auth.getSession().then(({ data: { session } }) => {
                    const u = session?.user ?? null;
                    setUser(u);
                    CURRENT_USER_ID = u?.id ?? null;
                    setAuthChecked(true);
                });
                const { data: { subscription } } = _supabase.auth.onAuthStateChange((_event, session) => {
                    const u = session?.user ?? null;
                    setUser(u);
                    CURRENT_USER_ID = u?.id ?? null;
                });
                return () => subscription.unsubscribe();
            }, []);

            // 登录后从云端拉取
            useEffect(() => {
                if (!user) return;
                setSyncStatus('syncing');
                syncFromCloud().then(data => {
                    if (data) {
                        setSyncStatus('done');
                        setTimeout(() => setSyncStatus('idle'), 3000);
                        // 通知所有 Widget 重新从 localStorage 读取最新数据
                        window.dispatchEvent(new CustomEvent('lifeos:synced'));
                    } else {
                        setSyncStatus('idle');
                    }
                });
            }, [user]);

            // 同步状态指示器文本/样式
            const syncIndicator = syncStatus === 'syncing'
                ? { text: '⟳ 同步中…', color: '#94a3b8' }
                : syncStatus === 'done'
                ? { text: '✓ 已同步',  color: '#22c55e' }
                : syncStatus === 'error'
                ? { text: '✗ 同步失败', color: '#ef4444' }
                : null;


            // 拖拽逻辑
            const moveWidget = (fromIdx, toIdx) => {
                const newW = [...widgets];
                const [moved] = newW.splice(fromIdx, 1);
                newW.splice(toIdx, 0, moved);
                setWidgets(newW);
            };

            // 调整大小逻辑
            const cycleWidgetSize = (index) => {
                const newW = [...widgets];
                const sizes = ['small', 'medium', 'large'];
                newW[index].size = sizes[(sizes.indexOf(newW[index].size) + 1) % sizes.length];
                setWidgets(newW);
            };

            // 本地 JSON 导入逻辑
            const handleImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                e.target.value = '';
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    try {
                        const raw = JSON.parse(ev.target.result);
                        const transactions      = raw.transactions      || [];
                        const categories        = raw.categories        || [];
                        const fixedItemsByMonth = raw.fixedItemsByMonth || {};
                        const wishlist          = raw.wishlist          || [];
                        const exchangeRate      = raw.exchangeRate      || 0.048;
                        const monthlyRates      = raw.monthlyRates      || {};

                        const existing = (() => {
                            try { return JSON.parse(localStorage.getItem('visualLifeOS_data') || '{}'); } catch { return {}; }
                        })();
                        const merged = {
                            ...existing,
                            transactions, categories, fixedItemsByMonth,
                            wishlist, exchangeRate, monthlyRates,
                            migratedAt: new Date().toISOString(),
                        };
                        localStorage.setItem('visualLifeOS_data', JSON.stringify(merged));

                        // 确保拿到登录用户再上传
                        const { data: { session } } = await _supabase.auth.getSession();
                        const uid = session?.user?.id;
                        if (uid) {
                            CURRENT_USER_ID = uid;
                            const ok = await syncToCloud();
                            setToast({ ok: true, msg: `✅ 导入完成！共 ${transactions.length} 条记录，${ok ? '已同步到云端' : '本地保存成功（云端同步失败）'}` });
                        } else {
                            setToast({ ok: true, msg: `✅ 导入完成！共 ${transactions.length} 条记录（请登录后数据会自动同步到云端）` });
                        }
                        setTimeout(() => window.location.reload(), 3000);
                    } catch (err) {
                        setToast({ ok: false, msg: `❌ 导入失败：${err.message}` });
                        setTimeout(() => setToast(null), 4000);
                    }
                };
                reader.onerror = () => {
                    setToast({ ok: false, msg: '❌ 文件读取失败，请重试' });
                    setTimeout(() => setToast(null), 4000);
                };
                reader.readAsText(file, 'utf-8');
            };

            // 收集本周数据并打开 AI 周报面板
            const openWeeklyAI = () => {
                const now = new Date();
                const weekStart = OFFSET_WEEK_DATES[0];
                const weekEnd = OFFSET_WEEK_DATES[6];

                const stored = getFinanceStorage();

                // 本周消费
                const weekTx = (stored.transactions || []).filter(t => t.date >= weekStart && t.date <= weekEnd);
                const weekTotal = Math.round(weekTx.reduce((s,t) => s + (parseFloat(t.amount)||0) * (t.currency==='RMB'?15:1), 0));
                const catMap = {};
                weekTx.forEach(t => { catMap[t.category||'其他'] = (catMap[t.category||'其他']||0) + (parseFloat(t.amount)||0); });
                const topCategories = Object.entries(catMap).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k])=>k).join('、');
                const biggestTx = [...weekTx].sort((a,b)=>(parseFloat(b.amount)||0)-(parseFloat(a.amount)||0))[0];

                // 本年谷子
                const weekAnime = (stored.animeOrders||[]).filter(o => o.year === String(now.getFullYear()));

                // 本周 Vault
                const weekEvents = (stored.lifeEvents||[]).filter(e => e.date >= weekStart && e.date <= weekEnd);

                // 项目
                const activeProjects = (stored.projects||[]).filter(p => p.status !== '已完成');
                const projectSummary = activeProjects.length > 0
                    ? activeProjects.map(p => {
                        const days = Math.ceil((new Date(p.endDate) - now) / 86400000);
                        return `${p.name}${p.stage ? '('+p.stage+')' : ''}还有${days}天截止`;
                    }).join('、')
                    : '本周没有进行中的项目';

                // Todo
                const allTodos = stored.allTodos || {};
                const weekTodosAll = OFFSET_WEEK_DATES.flatMap(d => allTodos[d] || []);
                const doneTodos = weekTodosAll.filter(t => t.done).length;
                const undoneTodos = weekTodosAll.filter(t => !t.done).length;
                const completedNames = weekTodosAll.filter(t=>t.done).map(t=>t.title).slice(0,5).join('、');

                // 抽烟
                const smokingLog = stored.smokingLog || {};
                const weekSmokeData = OFFSET_WEEK_DATES.map(d => smokingLog[d] || 0);
                const weekSmoke = weekSmokeData.reduce((s,n)=>s+n,0);
                const smokeDays = weekSmokeData.filter(n=>n>0).length;
                const avgSmoke = smokeDays > 0 ? (weekSmoke/smokeDays).toFixed(1) : 0;
                const goal = stored.smokingGoal || 20;

                const weekNum = Math.ceil(now.getDate() / 7);
                const period = `${now.getFullYear()}年${now.getMonth() + 1}月第${weekNum}周`;

                const prompt = `你是我的私人生活助手，我叫Amy，请用闺蜜聊天的语气帮我总结这一周（400字以内，不要用标题分项，就像发微信一样自然）：

这周我花了¥${weekTotal}，主要花在${topCategories||'暂无消费记录'}${biggestTx ? `，最大的一笔是${biggestTx.category||''}${biggestTx.name?'的'+biggestTx.name:''}花了¥${biggestTx.amount}` : ''}。

${weekAnime.length > 0 ? `谷子方面入手了${weekAnime.slice(0,3).map(o=>o.name).join('、')}` : '这周没有买谷子'}。

${weekEvents.length > 0 ? `Vault里记了${weekEvents.map(e=>e.title||'一条记录').slice(0,3).join('、')}` : '这周没有新增Vault记录'}。

项目方面：${projectSummary}。

Todo完成了${doneTodos}件${undoneTodos > 0 ? `，还有${undoneTodos}件没做完` : '，全部搞定了'}${completedNames ? `，完成了${completedNames}` : ''}。

我爸这周抽了${weekSmoke}根烟，日均${avgSmoke}根${parseFloat(avgSmoke) > goal ? '，超标了有点多' : '，控制得还不错'}。

请根据这些内容，像闺蜜一样聊聊这周——有什么开心的事值得记一下，有什么花销有点肉疼但也没关系，爸爸的烟有没有控制住。然后给我一些真的有用的建议，不要那种「要好好休息哦」这种废话，是那种你真的观察到了我这周的状态之后，具体告诉我下周可以怎么做得更好的建议，比如哪个类别可以少花一点、谷子是不是可以等发货了再下单、项目截止日快到了要注意什么。最后一句话给我打个气。语气全程轻松，像发微信一样。`;

                setAIPanel({
                    isOpen: true,
                    title: `AI 周报 · ${period}`,
                    type: 'weekly',
                    data: { promptText: prompt, period }
                });
            };

            if (!authChecked) return (
                <div className="fixed inset-0 flex items-center justify-center" style={{ background: 'var(--theme-bg)' }}>
                    <div className="text-3xl animate-spin" style={{ color: 'var(--accent)' }}>⟳</div>
                </div>
            );
            if (!user) return <LoginForm />;

            return (
                <div className="flex h-screen font-sans" style={{ background: 'var(--theme-bg)', color: 'var(--theme-text)' }}>

                    {/* 顶部同步进度条 */}
                    {syncStatus === 'syncing' && <div className="sync-bar" style={{ background: 'transparent' }} />}

                    {/* 左侧边栏 - 大屏显示 */}
                    <aside className="hidden md:flex w-72 flex-col glass-panel border-r border-white/50 p-6 z-40 relative shadow-xl">
                        <div className="mb-8 flex items-center gap-3">
                            <div className="w-10 h-10 bg-os-text text-white rounded-xl flex items-center justify-center font-bold">( •̀ ω •́ )</div>
                            <h1 className="font-black text-xl tracking-tight">Visual OS.</h1>
                        </div>

                        {/* 搜索框 */}
                        <div className="mb-8 relative group">
                            <span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-os-purple transition-colors">🔍</span>
                            <input type="text" placeholder="Search insights..." className="w-full bg-white/60 rounded-full py-2.5 pl-10 pr-4 text-sm font-medium outline-none border border-white focus:border-os-purple focus:bg-white transition-all shadow-sm" />
                        </div>

                        {/* 导航 */}
                        <nav className="space-y-2 flex-shrink-0">
                            {navItems.map(item => (
                                <button key={item.id} onClick={() => setCurrentView(item.id)} className={`w-full flex items-center gap-3 px-4 py-3 rounded-2xl transition-all ${currentView === item.id ? 'bg-white shadow-sm font-bold text-os-text' : 'text-gray-500 hover:bg-white/50 font-medium'}`}>
                                    <span className="text-xl">{item.icon}</span> <span>{item.label}</span>
                                </button>
                            ))}
                        </nav>

                        {/* 侧边栏立绘 */}
                        {charTheme.url && (
                            <div className="relative flex-1 flex items-end justify-center overflow-hidden pointer-events-none min-h-0">
                                <img src={charTheme.url} alt=""
                                    className="w-full object-contain object-bottom select-none"
                                    style={{
                                        opacity: charTheme.opacity,
                                        maxHeight: '100%',
                                        maskImage: 'linear-gradient(to top, black 50%, transparent 100%)',
                                        WebkitMaskImage: 'linear-gradient(to top, black 50%, transparent 100%)',
                                    }}
                                />
                                {charTheme.border && (
                                    <div className="absolute inset-0"
                                        style={{
                                            background: `radial-gradient(ellipse at 50% 80%, ${theme?.accent || '#f9a8d4'}33 0%, transparent 70%)`,
                                        }} />
                                )}
                            </div>
                        )}

                        {/* 底部：用户信息 + 设置 + 退出 */}
                        <div className="mt-auto space-y-2">
                            <button onClick={() => setShowSettings(true)}
                                className="w-full bg-white/60 py-2.5 rounded-2xl font-bold text-sm text-gray-600 hover:bg-white/90 transition-colors flex items-center justify-center gap-2 border border-white/80 shadow-sm">
                                ⚙️ 设置
                            </button>
                            <div className="bg-white/60 rounded-2xl px-3 py-2 border border-white/80 shadow-sm flex items-center justify-between gap-2">
                                <p className="text-[10px] text-gray-400 truncate flex-1">{user?.email}</p>
                                {syncIndicator && <span className="text-[9px] font-bold flex-shrink-0" style={{color: syncIndicator.color}}>{syncIndicator.text}</span>}
                                <button onClick={() => _supabase.auth.signOut()}
                                    className="text-[10px] font-bold text-gray-400 hover:text-gray-600 flex-shrink-0">
                                    退出
                                </button>
                            </div>
                        </div>

                        {/* 大屏居中悬浮添加按钮 */}
                        <button onClick={() => setShowAddCenter(true)} className="w-full bg-os-text text-white py-4 rounded-2xl font-bold shadow-lg hover:bg-gray-800 transition-colors flex items-center justify-center gap-2">
                            <span className="text-xl">+</span> Quick Log
                        </button>
                    </aside>

                    {/* 角色立绘层 - 手机端显示在页面右下角 */}
                    {charTheme.url && (
                        <div className="md:hidden fixed inset-0 pointer-events-none z-0 overflow-hidden">
                            <div className="absolute right-0 bottom-16 h-[70%] flex items-end justify-end"
                                style={{ width: '50%' }}>
                                <img src={charTheme.url} alt=""
                                    className="h-full w-auto object-contain object-bottom select-none"
                                    style={{
                                        opacity: charTheme.opacity,
                                        maskImage: 'linear-gradient(to right, transparent 0%, black 40%, black 90%, transparent 100%), linear-gradient(to top, black 50%, transparent 100%)',
                                        WebkitMaskImage: 'linear-gradient(to right, transparent 0%, black 40%, black 90%, transparent 100%), linear-gradient(to top, black 50%, transparent 100%)',
                                        maskComposite: 'intersect',
                                        WebkitMaskComposite: 'source-in',
                                    }}
                                />
                            </div>
                            {charTheme.border && (
                                <div className="absolute inset-0"
                                    style={{
                                        background: `radial-gradient(ellipse at 85% 50%, ${theme.accent}22 0%, transparent 60%)`,
                                        pointerEvents: 'none',
                                    }} />
                            )}
                        </div>
                    )}

                    {/* 粒子效果层 */}
                    {charTheme.particles && charTheme.url && (
                        <ParticleLayer type={charTheme.particleType} accentColor={theme.accent} />
                    )}

                    {/* 主内容区 */}
                    <main className="flex-1 overflow-y-auto p-4 md:p-8 relative w-full hide-scrollbar">
                        
                        {/* 顶部过滤区 & 动作栏 */}
                        <header className="mb-6 flex flex-col md:flex-row md:items-end justify-between gap-4">
                            <div>
                                <div className="flex items-center gap-3 mb-2">
                                    {/* 手机端头像按钮（点击展开左侧边栏） */}
                                    <button onClick={() => setShowMobileSidebar(true)}
                                        className="md:hidden w-9 h-9 rounded-full bg-os-text flex items-center justify-center text-white text-sm font-black shadow-sm flex-shrink-0"
                                        title="我的">
                                        {user?.email?.[0]?.toUpperCase() || '?'}
                                    </button>
                                    <h1 className="text-3xl font-black capitalize tracking-tight">{currentView}.</h1>
                                </div>
                                {(currentView === 'calendar' || currentView === 'year' || currentView === 'vault') && (
                                    <FilterBar
                                        activeFilter={activeFilter}
                                        setActiveFilter={setActiveFilter}
                                        right={currentView === 'calendar' ? (
                                            <div className="md:hidden flex items-center gap-1.5">
                                                {syncIndicator && (
                                                    <span className="text-[10px] font-bold whitespace-nowrap" style={{ color: syncIndicator.color }}>{syncIndicator.text}</span>
                                                )}
                                                <button
                                                    onClick={() => { setCalSearchOpen(o => !o); if (calSearchOpen) setCalSearch(''); }}
                                                    className={`w-8 h-8 rounded-full flex items-center justify-center text-sm border transition-colors ${calSearchOpen ? 'bg-os-text text-white border-os-text' : 'bg-white border-gray-200'}`}>
                                                    {calSearchOpen ? '×' : '🔍'}
                                                </button>
                                            </div>
                                        ) : null}
                                    />
                                )}
                            </div>
                            
                            <div className="flex gap-1.5 self-end md:self-auto items-center">
                                {syncIndicator && (
                                    <span className={`text-[11px] font-bold transition-all ${currentView === 'calendar' ? 'hidden md:inline' : ''}`} style={{ color: syncIndicator.color }}>
                                        {syncIndicator.text}
                                    </span>
                                )}
                                {currentView !== 'calendar' && currentView !== 'finance' && currentView !== 'vault' && (
                                <button onClick={() => setShowGlobalSearch(true)}
                                    className="w-9 h-9 bg-white rounded-full flex items-center justify-center shadow-sm text-lg border border-gray-100 hover:bg-gray-50 transition-colors flex-shrink-0"
                                    title="全局搜索">🔍</button>
                                )}
                                {currentView === 'home' && (<>
                                    <button onClick={openWeeklyAI}
                                        className="px-3 py-1.5 rounded-full flex items-center justify-center shadow-sm text-sm font-bold border border-gray-100 bg-white hover:bg-gray-50 transition-colors gap-1.5 whitespace-nowrap">
                                        ✨ AI 周报
                                    </button>
                                    <button onClick={() => setShowWidgetLib(true)}
                                        className="px-3 py-1.5 rounded-full flex items-center justify-center shadow-sm text-sm font-bold border border-gray-100 bg-white hover:bg-gray-50 transition-colors gap-1 whitespace-nowrap">
                                        + Widget
                                    </button>
                                    <button onClick={() => setIsEditMode(!isEditMode)} className={`px-3 py-1.5 rounded-full flex items-center justify-center shadow-sm text-sm font-bold border border-gray-100 transition-colors whitespace-nowrap ${isEditMode ? 'bg-os-text text-white' : 'bg-white hover:bg-gray-50'}`}>
                                        {isEditMode ? 'Done' : 'Edit Layout'}
                                    </button>

                                </>)}
                            </div>
                        </header>

                        {/* 视图路由 */}
                        <div key={currentView} className="animate-view-in">
                            {currentView === 'home' && (
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 auto-rows-[180px] pb-32 md:pb-8" style={{ gridAutoFlow: 'dense' }}>
                                    {widgets.map((widget, index) => (
                                        <WidgetWrapper key={widget.id} widgetId={widget.id} size={widget.size} isEditMode={isEditMode} onEnterEdit={() => setIsEditMode(true)} index={index} onMove={moveWidget} onCycleSize={() => cycleWidgetSize(index)}>
                                            {widget.id === 'weekly' && <WeeklyWidget events={events} onOpenReport={(type)=>setReportConfig({isOpen:true, type, period:'2026年5月第2周'})} />}
                                            {widget.id === 'clock' && <ClockWidget />}
                                            {widget.id === 'countdown' && <CountdownWidget />}
                                            {widget.id === 'weather' && <WeatherWidget />}
                                            {widget.id === 'habits' && <HabitsWidget />}
                                            {widget.id === 'shopping' && <ShoppingWidget />}
                                            {widget.id === 'anime' && <AnimeWidget onOpen={() => setCurrentView('anime')} />}
                                            {widget.id === 'health' && <HealthWidget />}
                                            {widget.id === 'deadline' && <DeadlineWidget />}
                                            {widget.id === 'meals' && <MealsWidget />}
                                            {widget.id === 'period' && <PeriodWidget />}
                                            {widget.id === 'smoking' && <SmokingWidget />}
                                            {widget.id === 'finance' && <FinanceWidget onOpen={() => setCurrentView('finance')} />}
                                        </WidgetWrapper>
                                    ))}
                                </div>
                            )}
                            
                            {currentView === 'finance' && <FinanceView />}
                            {currentView === 'anime' && <AnimeView />}
                            {currentView === 'calendar' && <CalendarView events={events} todos={todos} activeFilter={activeFilter} diary={diary} projects={projects}
                                onSaveProject={(p) => {
                                    const next = projects.some(x => x.id === p.id) ? projects.map(x => x.id === p.id ? p : x) : [...projects, p];
                                    setProjects(next);
                                    try { const d = JSON.parse(localStorage.getItem('visualLifeOS_data')||'{}'); d.projects = next; localStorage.setItem('visualLifeOS_data', JSON.stringify(d)); } catch {}
                                    syncToCloud();
                                }}
                                onDeleteProject={(id) => {

                    <input ref={importFileRef} type="file" accept=".json,application/json" className="hidden" onChange={handleImport} />

                    {/* Toast 提示 */}
                    {toast && (
                        <div className="fixed bottom-24 md:bottom-8 left-1/2 -translate-x-1/2 z-[200] px-5 py-3 rounded-2xl shadow-2xl text-sm font-bold text-white animate-slide-up whitespace-nowrap"
                            style={{ background: toast.ok ? '#1e293b' : '#ef4444' }}>
                            {toast.msg}
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(r => console.log('SW registered:', r.scope))
                    .catch(e => console.log('SW failed:', e));
            });
        }
    </script>
</body>
</html>
