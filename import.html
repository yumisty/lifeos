<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据导入 · Visual Life OS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #FFFBEB;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: #fff;
            border-radius: 28px;
            padding: 48px 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.07);
        }

        .logo {
            width: 48px;
            height: 48px;
            background: #1e293b;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 28px;
        }

        h1 {
            font-size: 22px;
            font-weight: 900;
            color: #1e293b;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 500;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        /* ── 步骤指示 ── */
        .steps {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 32px;
        }
        .step-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e2e8f0;
            transition: background 0.2s;
        }
        .step-dot.active { background: #e6b422; }
        .step-dot.done   { background: #22c55e; }

        /* ── 输入框 ── */
        .field {
            margin-bottom: 14px;
        }
        .field label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
        }
        .field input {
            width: 100%;
            padding: 14px 16px;
            background: #f8fafc;
            border: 2px solid transparent;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            color: #1e293b;
            outline: none;
            transition: border-color 0.15s;
        }
        .field input:focus { border-color: #fcd34d; background: #fff; }
        .field input::placeholder { color: #cbd5e1; font-weight: 500; }

        /* ── 按钮 ── */
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: #e6b422;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.15s ease;
            margin-top: 6px;
        }
        .btn-primary:hover:not(:disabled) { background: #d4a11e; transform: translateY(-1px); }
        .btn-primary:active:not(:disabled) { transform: translateY(0); }
        .btn-primary:disabled { background: #e2e8f0; color: #94a3b8; cursor: not-allowed; }

        .btn-back {
            width: 100%;
            margin-top: 12px;
            padding: 14px;
            background: #f8fafc;
            color: #475569;
            font-size: 14px;
            font-weight: 700;
            border: 1.5px solid #e2e8f0;
            border-radius: 16px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
            transition: all 0.15s ease;
        }
        .btn-back:hover { background: #f1f5f9; border-color: #cbd5e1; }

        /* ── 错误提示 ── */
        .error-msg {
            background: #fff1f2;
            border: 1.5px solid #fca5a5;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 600;
            color: #dc2626;
            margin-bottom: 16px;
            display: none;
        }
        .error-msg.visible { display: block; }

        /* ── 已登录徽章 ── */
        .user-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f0fdf4;
            border: 1.5px solid #86efac;
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 24px;
        }
        .user-badge .avatar {
            width: 32px;
            height: 32px;
            background: #22c55e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }
        .user-badge .email {
            font-size: 13px;
            font-weight: 700;
            color: #15803d;
            word-break: break-all;
        }
        .user-badge .label {
            font-size: 10px;
            font-weight: 600;
            color: #86efac;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ── 文件上传区 ── */
        .upload-zone {
            border: 2px dashed #fcd34d;
            border-radius: 20px;
            background: #FFFBF0;
            padding: 36px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 16px;
        }
        .upload-zone:hover, .upload-zone.drag-over {
            border-color: #e6b422;
            background: #fef3c7;
        }
        .upload-zone .icon { font-size: 36px; margin-bottom: 10px; display: block; }
        .upload-zone .label { font-size: 15px; font-weight: 700; color: #92400e; margin-bottom: 4px; }
        .upload-zone .hint  { font-size: 12px; color: #b45309; font-weight: 500; }
        #fileInput { display: none; }

        /* ── 结果卡片 ── */
        .result {
            border-radius: 16px;
            padding: 18px 20px;
            margin-top: 16px;
            display: none;
        }
        .result.visible { display: block; }
        .result.success  { background: #f0fdf4; border: 1.5px solid #86efac; }
        .result.warning  { background: #fff7ed; border: 1.5px solid #fdba74; }
        .result.caution  { background: #fefce8; border: 1.5px solid #fde047; }
        .result.error    { background: #fff1f2; border: 1.5px solid #fca5a5; }

        .result-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .result.success .result-title { color: #15803d; }
        .result.warning .result-title { color: #c2410c; }
        .result.caution .result-title { color: #854d0e; }
        .result.error   .result-title { color: #dc2626; }

        .result-lines {
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            line-height: 2;
        }
        .result-lines span {
            display: inline-block;
            background: #fff;
            border-radius: 8px;
            padding: 1px 8px;
            margin: 1px 0;
            font-weight: 700;
        }
        .result.success .result-lines span { color: #15803d; }
        .result.warning .result-lines span { color: #c2410c; }
        .result.caution .result-lines span { color: #854d0e; }
        .result.error   .result-lines span { color: #dc2626; }

        /* ── 页面切换 ── */
        .page { display: none; }
        .page.active { display: block; }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">💰</div>

    <!-- 步骤指示 -->
    <div class="steps">
        <div class="step-dot active" id="dot1"></div>
        <div class="step-dot" id="dot2"></div>
    </div>

    <!-- ── 第一步：登录 ── -->
    <div class="page active" id="pageLogin">
        <h1>登录账户</h1>
        <p class="subtitle">导入前请先登录，数据将同步到你的云端账户。</p>

        <div class="error-msg" id="loginError"></div>

        <div class="field">
            <label>邮箱</label>
            <input type="email" id="emailInput" placeholder="your@email.com" autocomplete="email" />
        </div>
        <div class="field">
            <label>密码</label>
            <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="current-password" />
        </div>

        <button class="btn-primary" id="loginBtn">登录</button>
    </div>

    <!-- ── 第二步：导入 ── -->
    <div class="page" id="pageImport">
        <h1>导入备份数据</h1>
        <p class="subtitle">选择从记账 App 导出的 JSON 备份文件，将自动同步到云端。</p>

        <div class="user-badge">
            <div class="avatar">✓</div>
            <div>
                <div class="label">已登录</div>
                <div class="email" id="userEmail">—</div>
            </div>
        </div>

        <div class="upload-zone" id="uploadZone">
            <span class="icon">📂</span>
            <p class="label">点击选择 JSON 文件</p>
            <p class="hint">或将文件拖拽到此处</p>
            <input type="file" id="fileInput" accept=".json,application/json">
        </div>

        <div class="result" id="resultBox"></div>

        <a class="btn-back" href="index.html">← 返回 Life OS</a>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://aiyflmkzzuiwmamvoils.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFpeWZsbWt6enVpd21hbXZvaWxzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMzQ0OTksImV4cCI6MjA5NDYxMDQ5OX0.1L59zixF4zg1yCahqo44h41kOiBfrWvtAGYvhGpRKAs';
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const STORAGE_KEY = 'visualLifeOS_data';

    // ── DOM refs ──
    const pageLogin  = document.getElementById('pageLogin');
    const pageImport = document.getElementById('pageImport');
    const dot1       = document.getElementById('dot1');
    const dot2       = document.getElementById('dot2');

    const emailInput    = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const loginBtn      = document.getElementById('loginBtn');
    const loginError    = document.getElementById('loginError');

    const userEmailEl = document.getElementById('userEmail');
    const uploadZone  = document.getElementById('uploadZone');
    const fileInput   = document.getElementById('fileInput');
    const resultBox   = document.getElementById('resultBox');

    // ── 检查是否已有 session ──
    _supabase.auth.getSession().then(({ data: { session } }) => {
        if (session?.user) goToImport(session.user);
    });

    // ── 登录 ──
    loginBtn.addEventListener('click', doLogin);
    passwordInput.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    async function doLogin() {
        const email    = emailInput.value.trim();
        const password = passwordInput.value;
        if (!email || !password) return;

        loginBtn.disabled = true;
        loginBtn.textContent = '登录中…';
        loginError.classList.remove('visible');

        const { data, error } = await _supabase.auth.signInWithPassword({ email, password });

        if (error || !data.user) {
            loginError.textContent = error?.message || '登录失败，请重试';
            loginError.classList.add('visible');
            loginBtn.disabled = false;
            loginBtn.textContent = '登录';
        } else {
            goToImport(data.user);
        }
    }

    function goToImport(user) {
        userEmailEl.textContent = user.email;
        pageLogin.classList.remove('active');
        pageImport.classList.add('active');
        dot1.classList.remove('active');
        dot1.classList.add('done');
        dot2.classList.add('active');
    }

    // ── 文件上传 ──
    uploadZone.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', e => {
        const file = e.target.files[0];
        if (file) readAndImport(file);
    });

    uploadZone.addEventListener('dragover', e => {
        e.preventDefault();
        uploadZone.classList.add('drag-over');
    });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
    uploadZone.addEventListener('drop', e => {
        e.preventDefault();
        uploadZone.classList.remove('drag-over');
        const file = e.dataTransfer.files[0];
        if (file && file.name.endsWith('.json')) {
            readAndImport(file);
        } else {
            showResult('error', '❌ 格式错误', ['请选择 .json 格式的备份文件']);
        }
    });

    function readAndImport(file) {
        showResult('caution', '⏳ 解析中…', ['正在读取文件：' + file.name]);
        const reader = new FileReader();
        reader.onload = async e => {
            try {
                const raw = JSON.parse(e.target.result);
                await doImport(raw);
            } catch (err) {
                showResult('error', '❌ 文件解析失败', ['JSON 格式不正确：' + err.message]);
            }
        };
        reader.onerror = () => showResult('error', '❌ 文件读取失败', ['请重新选择文件']);
        reader.readAsText(file, 'utf-8');
    }

    async function doImport(raw) {
        const transactions      = raw.transactions      || [];
        const categories        = raw.categories        || [];
        const fixedItemsByMonth = raw.fixedItemsByMonth || {};
        const wishlist          = raw.wishlist          || [];
        const inventory         = raw.inventory         || [];
        const exchangeRate      = raw.exchangeRate      || 0.05;
        const monthlyRates      = raw.monthlyRates      || {};

        // 写入 localStorage
        let existing = {};
        try { existing = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch {}

        const merged = {
            ...existing,
            transactions, categories, fixedItemsByMonth,
            wishlist, inventory, exchangeRate, monthlyRates,
            migratedAt: new Date().toISOString(),
        };

        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
        } catch (err) {
            showResult('error', '❌ 写入本地失败', ['localStorage 空间不足：' + err.message]);
            return;
        }

        const detailLines = [
            '📊 交易记录：' + transactions.length + ' 条',
            '🏷️ 分类：' + categories.length + ' 个',
            '📅 固定收支：' + Object.keys(fixedItemsByMonth).length + ' 个月',
            '💝 心愿单：' + wishlist.length + ' 条',
            '📦 库存：' + inventory.length + ' 条',
        ];

        // 获取当前登录用户
        const { data: { session } } = await _supabase.auth.getSession();
        const user = session?.user;

        if (!user) {
            showResult('warning',
                '✅ 本地导入完成！但未检测到登录状态，请重新登录后导入',
                detailLines
            );
            return;
        }

        // 上传到 Supabase
        showResult('caution', '☁️ 同步中…', detailLines);

        const { error } = await _supabase.from('lifeos_data').upsert({
            id:                   user.id,
            transactions:         merged.transactions      || [],
            categories:           merged.categories        || [],
            fixed_items_by_month: merged.fixedItemsByMonth || {},
            wishlist:             merged.wishlist          || [],
            todos:                merged.allTodos          || {},
            habits:               merged.habits            || {},
            period_log:           merged.periodLog         || [],
            exchange_rate:        merged.exchangeRate      || 0.048,
            monthly_rates:        merged.monthlyRates      || {},
            updated_at:           new Date().toISOString(),
        });

        if (error) {
            showResult('caution',
                '✅ 本地导入成功，但云端同步失败，请手动同步',
                [...detailLines, '⚠️ 错误：' + error.message]
            );
        } else {
            showResult('success',
                '✅ 导入完成！共 ' + transactions.length + ' 条记录，已同步到云端',
                detailLines
            );
        }
    }

    function showResult(type, title, lines) {
        resultBox.className = 'result visible ' + type;
        resultBox.innerHTML =
            '<p class="result-title">' + title + '</p>' +
            '<div class="result-lines">' +
            lines.map(l => '<span>' + l + '</span><br>').join('') +
            '</div>';
    }
</script>
</body>
</html>
