<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Generate PWA Icons</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 48px;
      padding: 40px 20px;
    }
    h1 {
      font-size: 18px;
      font-weight: 800;
      color: #334155;
      letter-spacing: 0.05em;
    }
    .previews {
      display: flex;
      gap: 48px;
      align-items: flex-end;
      flex-wrap: wrap;
      justify-content: center;
    }
    .icon-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .icon-card canvas {
      border-radius: 22%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    }
    .icon-card .label {
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .btn {
      padding: 10px 24px;
      border-radius: 999px;
      border: none;
      background: #475569;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #334155; }
  </style>
</head>
<body>
  <h1>Visual Life OS · PWA 图标生成器</h1>

  <div class="previews">
    <div class="icon-card">
      <canvas id="c192" width="192" height="192"></canvas>
      <span class="label">192 × 192</span>
      <button class="btn" onclick="download('c192', 'icon-192.png')">下载 icon-192.png</button>
    </div>
    <div class="icon-card">
      <canvas id="c512" width="512" height="512"></canvas>
      <span class="label">512 × 512</span>
      <button class="btn" onclick="download('c512', 'icon-512.png')">下载 icon-512.png</button>
    </div>
  </div>

  <script>
    function drawIcon(canvasId) {
      const canvas = document.getElementById(canvasId);
      const size = canvas.width;
      const ctx = canvas.getContext('2d');

      // --- 背景 ---
      const bgRadius = size * 0.2;
      ctx.fillStyle = '#475569';
      roundRect(ctx, 0, 0, size, size, bgRadius);
      ctx.fill();

      // --- 白色圆角矩形 ---
      const cardW = size * 0.7;
      const cardH = size * 0.52;
      const cardX = (size - cardW) / 2;
      const cardY = size * 0.16;
      const cardR = size * 0.1;

      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      roundRect(ctx, cardX, cardY, cardW, cardH, cardR);
      ctx.fill();

      // --- 颜文字 ( •̀ω) ---
      const faceSize = size * 0.195;
      ctx.fillStyle = '#334155';
      ctx.font = `900 ${faceSize}px "Segoe UI", "Arial", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('( •̀ω)', size / 2, cardY + cardH * 0.46);

      // --- Life OS 小字 ---
      const subSize = size * 0.085;
      ctx.fillStyle = '#64748b';
      ctx.font = `800 ${subSize}px "Segoe UI", "Arial", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.letterSpacing = `${size * 0.012}px`;
      ctx.fillText('Life OS', size / 2, cardY + cardH * 0.82);
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function download(canvasId, filename) {
      const canvas = document.getElementById(canvasId);
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = filename;
      a.click();
    }

    drawIcon('c192');
    drawIcon('c512');
  </script>
</body>
</html>
