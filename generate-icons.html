<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>生成 Life OS 图标</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #1e293b; color: #f1f5f9;
           display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 40px; }
    h1 { font-size: 1.4rem; font-weight: 800; margin: 0; }
    p { color: #94a3b8; font-size: .9rem; margin: 0; text-align: center; }
    .canvases { display: flex; gap: 32px; align-items: flex-end; flex-wrap: wrap; justify-content: center; }
    .card { background: #0f172a; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    canvas { border-radius: 12px; display: block; max-width: 200px; max-height: 200px; }
    button { background: #E6B422; color: #1e293b; border: none; border-radius: 10px;
             padding: 10px 24px; font-size: .9rem; font-weight: 800; cursor: pointer; transition: opacity .15s; }
    button:hover { opacity: .85; }
    .label { font-size: .75rem; color: #64748b; font-weight: 600; }
    .steps { background: #0f172a; border-radius: 16px; padding: 20px 28px; max-width: 520px; }
    .steps ol { margin: 8px 0 0; padding-left: 20px; line-height: 2; color: #94a3b8; font-size: .85rem; }
    .steps li code { background: #1e293b; border-radius: 4px; padding: 1px 6px; color: #fbbf24; font-family: monospace; }
  </style>
</head>
<body>
  <h1>Visual Life OS — 图标生成器</h1>
  <p>点击按钮生成图标，下载后放到项目根目录再 git push</p>

  <div class="canvases">
    <div class="card">
      <canvas id="c192" width="192" height="192"></canvas>
      <div class="label">192 × 192</div>
      <button onclick="download('c192','icon-192.png')">⬇ 下载 icon-192.png</button>
    </div>
    <div class="card">
      <canvas id="c512" width="512" height="512"></canvas>
      <div class="label">512 × 512</div>
      <button onclick="download('c512','icon-512.png')">⬇ 下载 icon-512.png</button>
    </div>
  </div>

  <div class="steps">
    <strong>使用步骤：</strong>
    <ol>
      <li>点击上方按钮下载两个 PNG 文件</li>
      <li>将 <code>icon-192.png</code> 和 <code>icon-512.png</code> 放到项目根目录（和 index.html 同级）</li>
      <li>终端执行 <code>git add .</code> → <code>git commit -m "update icons"</code> → <code>git push</code></li>
      <li>iPhone Safari 重新「添加到主屏幕」即可看到新图标</li>
    </ol>
  </div>

  <script>
    function drawIcon(canvas) {
      const size = canvas.width;
      const ctx  = canvas.getContext('2d');

      // 背景渐变
      const grad = ctx.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, '#475569');
      grad.addColorStop(1, '#1e293b');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);

      // 外层半透明圆角框
      const pad = size * 0.14;
      const sq  = size - pad * 2;
      const r   = size * 0.14;
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      roundRect(ctx, pad, pad, sq, sq, r);
      ctx.fill();

      // 内层白色圆角正方形
      const pad2 = size * 0.18;
      const sq2  = size - pad2 * 2;
      const r2   = size * 0.11;
      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      roundRect(ctx, pad2, pad2, sq2, sq2, r2);
      ctx.fill();

      // 颜文字
      const faceSize = size * 0.18;
      ctx.fillStyle = '#1e293b';
      ctx.font = `800 ${faceSize}px -apple-system, "Helvetica Neue", Arial, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('( •̀ω•́ )', size / 2, size * 0.43);

      // "Life OS" 副标题
      const subSize = size * 0.1;
      ctx.fillStyle = '#475569';
      ctx.font = `900 ${subSize}px -apple-system, "Helvetica Neue", Arial, sans-serif`;
      ctx.fillText('Life OS', size / 2, size * 0.63);
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function download(id, filename) {
      const a = document.createElement('a');
      a.href = document.getElementById(id).toDataURL('image/png');
      a.download = filename;
      a.click();
    }

    ['c192', 'c512'].forEach(id => drawIcon(document.getElementById(id)));
  </script>
</body>
</html>
