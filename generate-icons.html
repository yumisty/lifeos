<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Generate Icons</title></head>
<body>
<p style="font-family:sans-serif;color:#555">正在生成图标，稍等片刻会自动下载两个文件…</p>
<canvas id="c" style="display:none"></canvas>
<script>
function makeIcon(size) {
  const c = document.getElementById('c');
  c.width = c.height = size;
  const ctx = c.getContext('2d');

  // 背景渐变
  const g = ctx.createLinearGradient(0, 0, size, size);
  g.addColorStop(0, '#F59E0B');
  g.addColorStop(1, '#D97706');
  ctx.fillStyle = g;
  const r = size * 0.18;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(size - r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r);
  ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fill();

  // 白色圆形内框
  const cx = size / 2, cy = size / 2;
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.beginPath();
  ctx.arc(cx, cy, size * 0.36, 0, Math.PI * 2);
  ctx.fill();

  // 文字 "LO"
  ctx.fillStyle = '#fff';
  ctx.font = `900 ${size * 0.28}px "Inter", "Arial Black", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.15)';
  ctx.shadowBlur = size * 0.04;
  ctx.fillText('LO', cx, cy);

  return c.toDataURL('image/png');
}

function download(dataUrl, filename) {
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = filename;
  a.click();
}

// 稍微延迟让页面先渲染
setTimeout(() => {
  download(makeIcon(192), 'icon-192.png');
  setTimeout(() => {
    download(makeIcon(512), 'icon-512.png');
    document.querySelector('p').textContent = '✅ 两个图标已下载！把 icon-192.png 和 icon-512.png 放到 index.html 同目录即可。';
  }, 500);
}, 200);
</script>
</body>
</html>
